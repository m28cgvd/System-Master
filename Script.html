<script>
/* =====================================================================
   CHAI GOVINDAM — ONE LOGIN · core (sign-in, shell, helpers)
   ===================================================================== */
var S = { token: null, boot: null, outlet: '', view: '', params: {}, cache: {}, persist: false };
var V = {};                         // views, filled by the Views* files
var TOKEN_KEY = 'cg1_token', EXP_KEY = 'cg1_exp', OUT_KEY = 'cg1_outlet', NAV_KEY = 'cg1_nav';

/* ---------------- screens loaded on demand ----------------
   The page carries only the core. Each other screen lives in a bundle that is
   fetched once, kept in this browser (checked against the server's content
   hash, so a new deployment is picked up at once) and pre-fetched in the
   background after sign-in. */
var BUNDLE_OF = { profile: 'ViewsSelf', my_requests: 'ViewsSelf', apps: 'ViewsSelf', vault: 'ViewsSelf',
  orders: 'ViewsStock', grn: 'ViewsStock', item_master: 'ViewsStock', production: 'ViewsStock', prod_entry: 'ViewsStock', closing: 'ViewsStock', dsr: 'ViewsStock', expenses: 'ViewsStock',
  attendance: 'ViewsPeople', leave: 'ViewsPeople', advance: 'ViewsPeople', roster: 'ViewsPeople', penalty: 'ViewsPeople', certificates: 'ViewsPeople',
  approvals: 'ViewsApprove', hr_attendance: 'ViewsHR', hr_dashboard: 'ViewsHR', employees: 'ViewsHR', fms: 'ViewsFms', tickets: 'ViewsTickets', reports: 'ViewsHR', payroll: 'ViewsPay', salary_slips: 'ViewsPay',
  poster: 'ViewsPoster', users: 'ViewsAdmin', access: 'ViewsAdmin', settings: 'ViewsAdmin', vault_admin: 'ViewsAdmin', empview: 'ViewsDirector',
  dir_hr: 'ViewsDirector', dir_dsr: 'ViewsDirector', dir_grn: 'ViewsDirector', dir_exp: 'ViewsDirector', dir_closing: 'ViewsDirector', dir_orders: 'ViewsDirector', dir_fms: 'ViewsDirector', dir_cash: 'ViewsDirector' };
var BUNDLES = {};
var CG_API = window.CG_API || '';
function fetchBundle(names) {
  if (!CG.web || CG.stale) return api('ui.bundle', { names: names });
  return Promise.all(names.map(function (n) {
    return fetch('b/' + n + '.html?v=' + encodeURIComponent(CG.uiv), { cache: 'force-cache' }).then(function (r) { if (!r.ok) throw new Error('Could not load ' + n + ' (' + r.status + ').'); return r.text(); });
  })).then(function (list) { var files = {}; names.forEach(function (n, i) { files[n] = list[i]; }); return { v: CG.uiv, files: files }; });
}
function injectBundle(html) {
  var box = document.createElement('div');
  box.innerHTML = html;
  Array.prototype.slice.call(box.querySelectorAll('style')).forEach(function (st) { document.head.appendChild(st); });
  Array.prototype.slice.call(box.querySelectorAll('script')).forEach(function (sc) {
    var s = document.createElement('script'); s.text = sc.textContent; document.body.appendChild(s);
  });
}
function loadBundle(names) {
  names = [].concat(names).filter(Boolean);
  var waits = [], need = [];
  names.forEach(function (n) {
    if (BUNDLES[n] === true) return;
    if (BUNDLES[n] && BUNDLES[n].then) { waits.push(BUNDLES[n]); return; }
    try {
      var raw = localStorage.getItem('cg1_b_' + n);
      if (raw) { var o = JSON.parse(raw); if (o && o.v === CG.uiv && o.html) { injectBundle(o.html); BUNDLES[n] = true; return; } }
    } catch (e) {}
    need.push(n);
  });
  if (need.length) {
    var p = fetchBundle(need).then(function (r) {
      need.forEach(function (n) {
        if (r.files[n] && BUNDLES[n] !== true) {
          injectBundle(r.files[n]); BUNDLES[n] = true;
          try { stPut(localStorage, 'cg1_b_' + n, JSON.stringify({ v: r.v, html: r.files[n] })); } catch (e) {}
        }
      });
    }).catch(function (e) { need.forEach(function (n) { if (BUNDLES[n] !== true) delete BUNDLES[n]; }); throw e; });
    need.forEach(function (n) { BUNDLES[n] = p; });
    waits.push(p);
  }
  return Promise.all(waits);
}
/** After sign-in: quietly fetch every screen this person can open. */
function prefetchBundles() {
  if (!S.boot) return;
  var want = [];
  S.boot.menu.forEach(function (m) { var b = BUNDLE_OF[m.key]; if (b && want.indexOf(b) < 0) want.push(b); if (m.key === 'orders' && want.indexOf('ViewsOrder') < 0) want.push('ViewsOrder'); });
  if (want.length) loadBundle(want).catch(function () {});
}
/** Extra browser libraries (xlsx reader, zip, poster capture) — loaded only when a screen needs them. */
var LIBS = {};
function loadScript(url) {
  if (LIBS[url]) return LIBS[url];
  LIBS[url] = new Promise(function (res, rej) {
    var s = document.createElement('script'); s.src = url; s.onload = res;
    s.onerror = function () { delete LIBS[url]; rej(new Error('Could not load a helper library — check the internet connection.')); };
    document.head.appendChild(s);
  });
  return LIBS[url];
}
function b64ToBlob(b64, mime) {
  var bin = atob(b64), arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime || 'application/octet-stream' });
}
function saveBlob(blob, name) {
  var url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name || 'download'; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
}
function downloadB64(b64, name, mime) { saveBlob(b64ToBlob(b64, mime), name); }

/* ---------------- storage (never trusted, never required) ---------------- */
function ls() { try { return window.localStorage; } catch (e) { return null; } }
function ss() { try { return window.sessionStorage; } catch (e) { return null; } }
function sget(k) { try { return (ls() && ls().getItem(k)) || (ss() && ss().getItem(k)) || ''; } catch (e) { return ''; } }
function sset(k, v, persist) { try { (persist ? ls() : ss()).setItem(k, v); } catch (e) {} }
function sdel(k) { try { ls() && ls().removeItem(k); ss() && ss().removeItem(k); } catch (e) {} }
function saveToken(t, remember, exp) { sdel(TOKEN_KEY); sdel(EXP_KEY); sset(TOKEN_KEY, t, remember); sset(EXP_KEY, String(exp || ''), remember); }
function loadToken() { var t = sget(TOKEN_KEY), e = Number(sget(EXP_KEY) || 0); if (!t) return ''; if (e && e < Date.now()) { sdel(TOKEN_KEY); return ''; } return t; }

/* ---------------- server ---------------- */
var CG_FAST = window.CG_FAST === undefined ? (CG.web && location.protocol === 'https:' ? '/api' : '') : (window.CG_FAST === 'off' ? '' : String(window.CG_FAST || ''));
var FAST_W = /^(auth\.(login|logout|password)|file\.|join\.submit|slip\.pdf|appr\.advHr|fms\.myDone|req\.(advance|leave|reimb|file)|oa\.write|apps\.(open|reveal)|vault\.(reveal|save|remove)|usr\.(save|endSessions|bulk)|set\.(save|run|appSave|appRemove|checklistSave|outletSave)|appr\.(adv(Resend|Close|Admin|Pay)|leave|reimb)|fast\.)|\.(save|submit|add|done|assign|unassign|update|create|approve|decide|request|place|receive|start|finish|remove|upload|deleteDate|saveRow|tableSave|refresh|edit|ulSave|editMany|excSave|excRemove|raise|bulk|replace|saveDay|shiftSave|grnSave|status|reject|docUpload|assetSave|changeDecide|salarySave|doerLink|write|personSave|userSave)$/;
var FAST = { off: 0, hold: {}, sy: [], v: CG.version };
(function () {
  try {
    var o = JSON.parse(localStorage.getItem('cg1_fast') || 'null'), now = Date.now();
    if (o && o.v !== CG.version) { o.off = 0; o.hold = {}; }
    if (o) { FAST.off = o.off > now ? o.off : 0; Object.keys(o.hold || {}).forEach(function (k) { if (o.hold[k] > now) FAST.hold[k] = o.hold[k]; }); FAST.sy = (o.sy || []).filter(function (x) { return x && x.t > now - 600000; }); }
  } catch (e) {}
})();
function fastSave() { try { localStorage.setItem('cg1_fast', JSON.stringify(FAST)); } catch (e) {} }
function fastWants(req) {
  if (!CG_FAST || !CG_API || FAST.off > Date.now()) return false;
  var a = String(req.action || ''), d = req.data || {};
  if (FAST_W.test(a) || (FAST.hold[a] || 0) > Date.now()) return false;
  return !/^(xlsx|xls|pdf|csv|zip)$/i.test(String(d.format || ''));
}
function fastSy() { var now = Date.now(); FAST.sy = FAST.sy.filter(function (x) { return x.t > now - 600000; }); return FAST.sy; }
function postText(url, body, extra) {
  return fetch(url, Object.assign({ method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', credentials: 'omit' }, extra || {}));
}
function fastNote(t) {
  var i = t.lastIndexOf('"_s":{'); if (i < 0) return;
  var x = null;
  try { x = JSON.parse(t.slice(i + 5, t.replace(/\s+$/, '').length - 1)); } catch (e) { x = null; }
  if (!x || !x.g || FAST.sy.some(function (y) { return y.g === x.g; })) return;
  FAST.sy = fastSy().concat([x]).slice(-12);
  fastSave();
  try { postText(CG_FAST, { action: 'fast.sync', sy: [x] }, { keepalive: true }).catch(function () {}); } catch (e) {}
}
function rpcGas(req) {
  return postText(CG_API, CG_FAST ? Object.assign({ nf: 1 }, req) : req)
    .then(function (r) { if (!r.ok) throw new Error('The server did not answer (' + r.status + ') — please try again.'); return r.text(); },
      function () { throw new Error('No connection — please try again.'); })
    .then(function (t) {
      if (/^\s*</.test(t)) throw new Error('The web app link in config.js sent back a web page instead of data. Put the current /exec link of version ' + CG.version + ' or later in config.js.');
      if (CG_FAST) fastNote(t);
      return t;
    });
}
function rpc(req) {
  if (CG_API) {
    if (!fastWants(req)) return rpcGas(req);
    return postText(CG_FAST, Object.assign({}, req, { sy: fastSy() }))
      .then(function (r) { if (!r.ok) { FAST.off = Date.now() + (r.status === 404 ? 3600000 : 30000); fastSave(); return null; } return r.text(); })
      .then(function (t) {
        if (t === null || /^\s*</.test(t)) return { gas: 1 };
        if (/^\{"ok":false,"gas":1/.test(t)) {
          var why = (/"why":"([a-z]+)"/.exec(t) || [])[1] || '';
          if (why === 'write' || why === 'access' || why === 'file') FAST.hold[req.action] = Date.now() + (why === 'write' ? 900000 : 600000);
          else if (why === 'off') FAST.off = Date.now() + 600000;
          else if (why === 'busy' || why === 'auth') FAST.off = Date.now() + 20000;
          fastSave();
          return { gas: 1 };
        }
        return { t: t };
      }, function () { FAST.off = Date.now() + 30000; return { gas: 1 }; })
      .then(function (x) { return x.gas ? rpcGas(req) : x.t; });
  }
  return new Promise(function (resolve, reject) {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(new Error((e && e.message) || 'No connection — please try again.')); }).api(req);
  });
}
function api(action, data) {
  return rpc({ action: action, token: S.token, data: data || {}, fresh: !!S.fresh, as: S.viewAs ? S.viewAs.uid : '' }).then(function (txt) {
    var r; try { r = JSON.parse(txt); } catch (e) { throw new Error('Unexpected reply from the server.'); }
    if (!r.ok) { if (r.expired && action !== 'auth.login') sessionEnded(); throw new Error(r.error || 'Something went wrong.'); }
    return r.data;
  }, function (e) {
    if (ACCT_RE.test(e.message)) acctHelp();
    throw e;
  });
}

/* ---------------- instant screens ----------------
   Speed: every list a person opened before is kept on this device (per login, only as long as the
   sign-in is kept) and shown AT ONCE; the server's answer replaces it a moment later — only when
   something changed. The main screens are pre-loaded quietly after sign-in, so even the first tap is
   instant. Signing out wipes it all. */
var DC = 'cg1_d_';
function dcStore() { return S.persist ? ls() : ss(); }
function dcKey(action, data) { return DC + ((S.boot && S.boot.user.uid) || '') + '|' + action + '|' + JSON.stringify(data || {}); }
function dcGet(k) { try { var st = dcStore(), raw = st && st.getItem(k); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
function dcSet(k, d) {
  var v; try { v = JSON.stringify({ t: Date.now(), d: d }); } catch (e) { return; }
  if (v.length > 400000) return;                                     // a very large list is not kept
  stPut(dcStore(), k, v);
}
/** setItem that makes room (drops the oldest half of the kept lists) when the browser storage is full. */
function stPut(st, k, v) {
  if (!st) return false;
  try { st.setItem(k, v); return true; } catch (e) { dcTrim(st); try { st.setItem(k, v); return true; } catch (x) { return false; } }
}
function dcDel(action, data) { try { var st = dcStore(); st && st.removeItem(dcKey(action, data)); } catch (e) {} }
function dcKeys(st) { var out = []; try { for (var i = 0; i < st.length; i++) { var k = st.key(i); if (k && k.indexOf(DC) === 0) out.push(k); } } catch (e) {} return out; }
function dcTrim(st) {
  st = st || dcStore(); if (!st) return;
  var list = dcKeys(st).map(function (k) { var o = null; try { o = JSON.parse(st.getItem(k)); } catch (e) {} return { k: k, t: o ? o.t : 0 }; })
    .sort(function (a, b) { return a.t - b.t; });
  list.slice(0, Math.ceil(list.length / 2)).forEach(function (x) { try { st.removeItem(x.k); } catch (e) {} });
}
function dcClear() {
  [ls(), ss()].forEach(function (st) { if (!st) return; dcKeys(st).forEach(function (k) { try { st.removeItem(k); } catch (e) {} }); try { st.removeItem('cg1_boot'); } catch (e) {} });
}
/* Only what the person really typed or ticked counts as "busy" (values the screen fills in itself do not). */
['input', 'change'].forEach(function (t) {
  document.addEventListener(t, function (e) { var x = e.target; if (e.isTrusted && x && x.dataset && !x.hasAttribute('data-free')) x.dataset.u = '1'; }, true);
});
/** Person is typing / has typed / a dialog is open inside el — new data then waits behind a button instead of redrawing. */
function userBusy(el) {
  if ($('.modal-bg')) return true;
  var a = document.activeElement;
  if (a && el && el.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && !a.hasAttribute('data-free')) return true;
  return !!(el && $('[data-u]', el));
}
function freshChip(el, apply) {
  var old = $('#freshChip'); if (old) old.remove();
  var b = document.createElement('button');
  b.id = 'freshChip'; b.className = 'fresh-chip'; b.innerHTML = icon('refresh') + 'New data — show';
  b.onclick = function () { b.remove(); apply(); };
  document.body.appendChild(b);                                      // go() takes it away when the person opens another screen
  setTimeout(function () { if (b.parentNode) b.remove(); }, 30000);
}
/* A thin line at the top while a screen shown from this device is being checked with the server. */
var LIVE_N = 0;
function liveBar(n) {
  LIVE_N = Math.max(0, LIVE_N + n);
  var b = document.getElementById('liveBar');
  if (!b) { b = document.createElement('div'); b.id = 'liveBar'; b.className = 'live-bar'; document.body.appendChild(b); }
  b.classList.toggle('on', LIVE_N > 0);
}
/**
 * live(action, data, render, opt): render(copyOnThisDevice, true) at once when there is one, then
 * render(serverAnswer, false) — skipped when nothing changed.
 * opt.busy: true → wait behind a "New data — show" button while the person is working inside opt.el
 * (see userBusy); or a function returning true/false.
 * opt.alive(): false when that part of the screen now shows something else (another tab / date) — the
 * answer is then only kept for the next visit. Moving to another screen counts too (S.nav).
 * opt.box: the element render() fills — anything else drawn into it meanwhile (e.g. a form opened from
 * the list) also means "moved on".
 * opt.quiet: the screen is already up to date with a change made here (e.g. the approved card was just
 * taken off) — no device copy is drawn, the answer only replaces the screen when the person is not busy.
 * opt.maxAge (ms): a device copy younger than this is trusted as it is (no server call).
 * Returns the server's answer (a failed refresh keeps the copy on screen and only shows a note).
 */
function live(action, data, render, opt) {
  opt = opt || {};
  var k = dcKey(action, data), c = S.fresh || opt.quiet ? null : dcGet(k), shown = null, tok = S.token, nav = S.nav;
  var box = opt.box || null, mine = box ? box.firstElementChild : null;      // what this list put into its box
  function alive() {
    return S.token === tok && S.nav === nav && (!opt.alive || opt.alive()) && (!box || !mine || (box.firstElementChild === mine && document.body.contains(box)));
  }
  function draw(d, fromCopy) { render(d, fromCopy); if (box) mine = box.firstElementChild; }
  if (c && c.d !== undefined && c.d !== null) { shown = JSON.stringify(c.d); try { draw(c.d, true); } catch (e) { shown = null; } }
  if (shown !== null && opt.maxAge && Date.now() - c.t < opt.maxAge) return Promise.resolve(c.d);
  var bg = shown !== null || !!opt.quiet;                             // something is on screen already
  if (bg) liveBar(1);
  return api(action, data).then(function (d) {
    if (bg) liveBar(-1);
    if (S.token !== tok) return d;
    var s = JSON.stringify(d);
    dcSet(k, d);
    if (s === shown || !alive()) return d;                            // unchanged, or the person has moved on — the next visit shows it
    var busyNow = opt.busy && ((typeof opt.busy === 'function' ? opt.busy() : userBusy(opt.el)) || SAVING > 0);   // never redraw a list over a change still being saved
    if (bg && busyNow) { freshChip(opt.el, function () { if (alive()) draw(d, false); }); return d; }
    dropFreshChip();
    keepFocus(function () { draw(d, false); });
    return d;
  }, function (e) {
    if (bg) liveBar(-1);
    if (!alive()) return null;
    if (!bg) throw e;
    if (!/session has ended/i.test(e.message)) toast((shown !== null ? 'Showing the last copy — ' : 'Could not refresh — ') + e.message, 'bad');
    return c ? c.d : null;
  });
}
/* ---------------- saving in the background ----------------
   A change the person makes (approve, reject, mark done …) shows on the screen at once and is sent to
   the server behind it, with a small "Saving…" note; if the server refuses it, the screen puts it back
   and says why. Closing the page while something is still saving asks first. */
var SAVING = 0;
window.addEventListener('beforeunload', function (e) { if (SAVING > 0) { e.preventDefault(); e.returnValue = 'Still saving'; return 'Still saving'; } });
function saveInBg(action, data, label) {
  SAVING++;
  var t = document.createElement('div');
  t.className = 'toast saving';
  t.innerHTML = '<span class="spinner"></span><div>' + h(label || 'Saving…') + '</div>';
  $('#toasts').appendChild(t);
  return api(action, data).then(function (r) { SAVING--; t.remove(); toast((r && r.message) || 'Saved', 'ok'); return r; },
    function (e) { SAVING--; t.remove(); toast(e.message, 'bad'); throw e; });
}
/** A card taken off the list while its change is saved: true = hide, false = put back, 'gone' = remove. */
function park(node, how) {
  if (!node) return;
  if (how === true) { node.dataset.gone = '1'; node.style.display = 'none'; $$('[data-u]', node).forEach(function (x) { delete x.dataset.u; }); }
  else if (how === false) { delete node.dataset.gone; node.style.display = ''; }
  else node.remove();
}
/** Server answers that mean "what you see is out of date" — the list is then fetched again. */
var STALE_RE = /sheet changed|already|not found|no longer|refresh/i;
/** Redraws without losing the cursor of a search box (same id before and after). */
function keepFocus(fn) {
  var a = document.activeElement, id = a && a.id, s = null, e = null;
  if (id && /INPUT|TEXTAREA/.test(a.tagName)) { try { s = a.selectionStart; e = a.selectionEnd; } catch (x) {} }
  fn();
  if (!id) return;
  var n = document.getElementById(id);
  if (n && n !== a && n.focus) { n.focus(); try { if (s !== null) n.setSelectionRange(s, e); } catch (x) {} }
}
function dropFreshChip() { var fc = $('#freshChip'); if (fc) fc.remove(); }
/** After a change made here: its card leaves the list at once; the typed-in marks of that part are cleared. */
function settle(node) {
  if (!node) return;
  $$('[data-u]', node).forEach(function (x) { delete x.dataset.u; });
  if (node.classList && (node.classList.contains('li') || node.tagName === 'TR')) {
    node.dataset.gone = '1'; node.style.transition = 'opacity .18s'; node.style.opacity = '0';
    setTimeout(function () { node.remove(); }, 190);
  }
}
/** Fills the device copy without drawing anything (pre-loading after sign-in). */
function warm(action, data, maxAgeMs) {
  var c = dcGet(dcKey(action, data));
  if (c && Date.now() - c.t < (maxAgeMs || 300000)) return Promise.resolve(c.d);
  return api(action, data).then(function (d) { dcSet(dcKey(action, data), d); return d; });
}
/** After sign-in: the screens this person uses most, fetched quietly one after another (never a burst —
 *  everyone's requests share the owner's Apps Script limits), so the first tap on them is instant too. */
function prefetchData() {
  if (!S.boot || S.prefetched === S.token) return;
  S.prefetched = S.token;
  var y = addDaysISO(todayISO(), -1), jobs = [];
  if (has('checklist')) jobs.push(['chk.my', {}]);
  if (has('checklist') && perm('checklistAssign')) jobs.push(['chk.overview', { date: todayISO() }, '', function (d) {   // then each checklist he runs
    (d && d.list || []).filter(function (c) { return c.manage && !c.error; }).slice(0, 8).forEach(function (c) { jobs.push(['chk.tasks', { id: c.id, date: todayISO() }]); });
  }]);
  if (has('my_requests')) jobs.push(['req.mine', {}], ['req.meta', {}]);
  if (has('approvals')) jobs.push(['appr.load', {}]);
  if (has('leave')) jobs.push(['leave.list', { outletId: S.outlet }]);
  if (has('advance')) jobs.push(['adv.list', { outletId: S.outlet }]);
  if (has('tasks')) jobs.push(['task.mine', {}]);
  if (has('attendance')) jobs.push(['att.day', { outletId: S.outlet, date: y }]);
  if (has('apps')) jobs.push(['apps.mine', {}]);
  if (has('profile')) jobs.push(['prof.me', {}]);
  // kept in memory only (dates / stock that must be today's): the first screen of Penalty, Orders, HR desks
  if (has('penalty')) jobs.push(['pen.meta', {}, 'penMeta']);
  if (has('hr_attendance')) jobs.push(['at.boot', {}, 'atBoot']);
  if (has('employees')) jobs.push(['emp.stats', {}, 'empStats']);
  var tok = S.token, i = 0;
  (function next() {                                                  // one after another; a job may add more (j[3])
    if (S.token !== tok || i >= jobs.length) return;
    var j = jobs[i++];
    var p = j[2] ? (S.cache[j[2]] ? Promise.resolve(S.cache[j[2]]) : api(j[0], j[1]).then(function (d) { if (S.token === tok && !S.cache[j[2]]) S.cache[j[2]] = d; return d; }))
      : warm(j[0], j[1]);
    p.then(function (d) { if (j[3] && S.token === tok) j[3](d); }).catch(function () {}).then(next);
  })();
}
/** The leave / advance / reimbursement forms: this device's copy at once (with today's date), the server's after. */
function reqMetaNow() {
  if (S.cache.reqMeta && !S.fresh) return Promise.resolve(S.cache.reqMeta);
