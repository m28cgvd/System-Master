<style>
/* Hiring Poster Maker — scoped to .pm so it never touches the rest of the app */
.pm{--brown:#6B3F1C; --brown-d:#4E2C12; --cream:#FEF5E6; --accent:#E8A317; --ink:#4E3520; --muted:#8C7259; --soft:#A98A6E; --line:rgba(107,63,28,.14); --page:#F4EFE7;}
.pm{background:transparent; color:var(--ink); font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif; font-size:14px; -webkit-font-smoothing:antialiased;}
.pm .wrap{display:flex;align-items:flex-start;padding:0}
.pm .panel{background:#fff;border:1px solid var(--line);border-radius:16px}
.pm .panel.form{width:430px;flex:0 0 430px;padding:6px 18px 18px;margin-right:18px; position:sticky;top:76px;max-height:calc(100vh - 92px);overflow-y:auto;}
.pm .panel.preview{flex:1;min-width:0;padding:14px}
.pm .grp{padding:16px 0;border-bottom:1px dashed var(--line)}
.pm .grp:last-child{border-bottom:0}
.pm .grp-h{font-size:11px;font-weight:600;letter-spacing:2.4px;color:var(--soft);text-transform:uppercase;margin-bottom:12px}
.pm .fl{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:12px}
.pm .opt{color:#B9A38C;font-weight:400}
.pm .fl input,.pm .fl select,.pm .fl textarea{display:block;width:100%;margin-top:5px;padding:9px 11px; font-family:inherit;font-size:13.5px;color:var(--ink); background:#FFFDFA;border:1px solid #E6DACB;border-radius:9px;outline:none;}
.pm .fl textarea{resize:vertical;line-height:1.55}
.pm .fl input:focus,.pm .fl select:focus,.pm .fl textarea:focus{border-color:var(--brown);background:#fff}
.pm .row2,.pm .row3{display:flex;margin:0 -5px}
.pm .row2>.fl{flex:1;margin:0 5px 12px}
.pm .row3>.fl{flex:1;margin:0 5px 12px}
.pm .hint{font-size:11.5px;color:#B09678;margin:-4px 0 4px}
.pm .chk{display:flex;align-items:center;font-size:13px;color:var(--ink);margin-top:4px;cursor:pointer}
.pm .chk input{margin:0 9px 0 0;width:15px;height:15px;accent-color:var(--brown)}
.pm .benlist{display:flex;flex-wrap:wrap;margin:0 -4px}
.pm .benlist .chk{width:calc(50% - 8px);margin:4px;padding:8px 10px;border:1px solid #EEE4D8;border-radius:9px;font-size:12.5px;line-height:1.25}
.pm .benlist .chk.on{border-color:var(--brown);background:#FFFBF4}
.pm .secs{margin:2px 0 12px}
.pm .sec{position:relative;margin-bottom:8px;padding:8px 9px 9px; background:#FFFDFA;border:1px solid #EEE4D8;border-radius:11px;}
.pm .sec.on{background:#fff;border-color:#DFCDB8}
.pm .sec.dragging{opacity:.45}
.pm .sec.over-top{box-shadow:0 -3px 0 -1px var(--accent)}
.pm .sec.over-bottom{box-shadow:0 3px 0 -1px var(--accent)}
.pm .sec-h{display:flex;align-items:center}
.pm .sec-grip{flex:0 0 auto;padding:0 7px 0 2px;color:#CCB79E;font-size:15px;letter-spacing:-4px; cursor:grab;user-select:none;-webkit-user-select:none;}
.pm .sec-grip:active{cursor:grabbing}
.pm .sec-ck{flex:0 0 auto;width:15px;height:15px;margin:0 8px 0 0;accent-color:var(--brown);cursor:pointer}
.pm .sec-t{flex:1 1 auto;min-width:0;padding:6px 8px; font-family:inherit;font-size:12.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase; color:#B3A08B;background:transparent;border:1px solid transparent;border-radius:7px;outline:none;}
.pm .sec.on .sec-t{color:var(--brown)}
.pm .sec-t:hover{border-color:#EEE4D8}
.pm .sec-t:focus{border-color:var(--brown);background:#fff}
.pm .sec-ty{flex:0 0 auto;margin-left:6px;padding:5px 3px; font-family:inherit;font-size:11px;color:var(--muted); background:#FFFDFA;border:1px solid #EEE4D8;border-radius:7px;outline:none;}
.pm .sec-ty:focus{border-color:var(--brown)}
.pm .sec-ty.fixed{padding:5px 8px;color:#C0AA92;border-style:dashed}
.pm .sec-b{flex:0 0 auto;width:24px;height:24px;margin-left:3px;padding:0;line-height:1; font-family:inherit;font-size:10px;color:var(--soft); background:#fff;border:1px solid #EEE4D8;border-radius:7px;cursor:pointer;}
.pm .sec-b:hover{border-color:var(--brown);color:var(--brown)}
.pm .sec-b.del:hover{border-color:#C4694A;color:#C4694A}
.pm .sec-pad{flex:0 0 auto;width:27px}
.pm .sec-tx{display:block;width:100%;margin-top:7px;padding:9px 11px; font-family:inherit;font-size:13.5px;line-height:1.55;color:var(--ink); background:#FFFDFA;border:1px solid #E6DACB;border-radius:9px;outline:none;resize:vertical;}
.pm .sec-tx:focus{border-color:var(--brown);background:#fff}
.pm .sec:not(.on) .sec-tx{opacity:.55}
.pm .sec.empty .sec-tx{border-color:#EAD3BE;background:#FFFBF3}
.pm .sec-note{margin:8px 2px 2px;font-size:12px;color:#B09678}
.pm .secs-foot{display:flex;align-items:center;flex-wrap:wrap;margin-top:12px}
.pm .secs-foot .hint{flex:1;min-width:130px;margin:0 0 0 10px}
.pm .pv-bar{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 12px}
.pm .pv-title{font-size:12px;font-weight:600;letter-spacing:2px;color:var(--soft);text-transform:uppercase}
.pm .pv-size{font-weight:400;letter-spacing:.4px;text-transform:none;color:#C0AA92;margin-left:8px}
.pm .pv-warn{display:none;margin-left:10px;padding:3px 9px;border-radius:20px;font-size:11px; font-weight:600;letter-spacing:.3px;text-transform:none;background:#FBE9DF;color:#A5522A}
.pm .pv-warn.on{display:inline-block}
.pm .pv-right{display:flex;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pm .pv-btns{display:flex}
.pm .pv-chk{margin:0 14px 0 0;font-size:12.5px;color:var(--muted);white-space:nowrap}
.pm .pv-sel{margin-right:8px;padding:9px 8px;font-family:inherit;font-size:12.5px;color:var(--ink); background:#FFFDFA;border:1px solid #E6DACB;border-radius:9px;outline:none;max-width:260px}
.pm .pv-sel:focus{border-color:var(--brown)}
.pm .addrow{display:flex;align-items:center;margin:8px 0 10px}
.pm .addrow input[type=text]{flex:1;min-width:0;padding:9px 11px;font-family:inherit;font-size:13px; color:var(--ink);background:#FFFDFA;border:1px solid #E6DACB;border-radius:9px;outline:none}
.pm .addrow input[type=text]:focus{border-color:var(--brown);background:#fff}
.pm .addrow select{width:112px;margin-left:6px;padding:9px 6px;font-family:inherit;font-size:12.5px; color:var(--ink);background:#FFFDFA;border:1px solid #E6DACB;border-radius:9px;outline:none}
.pm .result{display:none;margin:0 4px 12px;padding:12px 14px;border-radius:11px; background:#FBF6EE;border:1px solid var(--line);font-size:13px;color:var(--ink)}
.pm .result.on{display:block}
.pm .result.err{background:#FDF1EE;border-color:#E9C7BC}
.pm .result a{color:var(--brown);font-weight:600;text-decoration:none;margin-right:14px;border-bottom:1px solid var(--line)}
.pm .result .rl{font-size:11px;letter-spacing:2px;color:var(--soft);text-transform:uppercase;display:block;margin-bottom:6px}
.pm .stage{position:relative;overflow:hidden;border-radius:12px;background:#EFE7DC}
.pm .poster{--k:1; --title:66px; width:1240px;height:1754px;overflow:hidden; transform-origin:top left; display:flex;flex-direction:column; background:var(--cream);color:var(--brown); font-family:'Poppins',sans-serif;}
.pm .poster.measuring{height:auto}
.pm .poster.measuring .p-body{overflow:visible}
.pm .p-topbar{flex:0 0 auto;height:18px;background:var(--brown)}
.pm .p-body{flex:1 1 auto;overflow:hidden; padding:max(42px, calc(62px*var(--k))) max(58px, calc(82px*var(--k))) max(40px, calc(58px*var(--k))); display:flex;flex-direction:column;}
.pm .p-main{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center}
.pm .p-secs{display:flex;flex-direction:column}
.pm .p-head{flex:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:calc(44px*var(--k))}
.pm .p-head-txt{flex:1 1 auto;min-width:0;padding-right:calc(24px*var(--k))}
.pm .p-hire{font-family:'Archivo Black','Poppins',sans-serif; font-size:calc(90px*var(--k));line-height:.96;letter-spacing:-1.5px; color:var(--brown);text-transform:uppercase;white-space:nowrap;}
.pm .p-accent{width:calc(104px*var(--k));height:calc(9px*var(--k));border-radius:5px; background:var(--accent);margin:calc(24px*var(--k)) 0 calc(17px*var(--k))}
.pm .p-sub{font-size:calc(21px*var(--k));font-weight:600;letter-spacing:calc(7px*var(--k)); color:var(--soft);text-transform:uppercase}
.pm .p-logo{flex:0 0 auto;width:calc(284px*var(--k));height:auto;margin-top:calc(4px*var(--k))}
.pm .p-card{flex:0 0 auto;background:#fff;border:1px solid var(--line); border-radius:calc(25px*var(--k));padding:calc(42px*var(--k)) calc(48px*var(--k))}
.pm .p-card-top{display:flex;align-items:center;justify-content:space-between; padding-bottom:calc(31px*var(--k));border-bottom:1px solid var(--line)}
.pm .p-title-wrap{flex:1;padding-right:calc(24px*var(--k))}
.pm .p-title{font-family:'Archivo Black','Poppins',sans-serif; font-size:calc(var(--title)*var(--k));line-height:1.04;letter-spacing:-1px;color:var(--brown)}
.pm .p-type{display:inline-block;margin-top:calc(15px*var(--k)); padding:calc(8px*var(--k)) calc(20px*var(--k));border:1px solid var(--line); border-radius:999px;font-size:calc(19px*var(--k));font-weight:500;color:var(--muted)}
.pm .p-vac{flex:0 0 auto;min-width:calc(150px*var(--k));padding:calc(22px*var(--k)) calc(27px*var(--k)); border-radius:calc(18px*var(--k));background:var(--brown);text-align:center}
.pm .p-vac-n{font-family:'Archivo Black','Poppins',sans-serif;font-size:calc(52px*var(--k));line-height:1;color:var(--cream)}
.pm .p-vac-l{font-size:calc(14px*var(--k));font-weight:500;letter-spacing:calc(3.4px*var(--k)); color:rgba(254,245,230,.72);margin-top:calc(7px*var(--k))}
.pm .p-stats{display:flex;margin-top:calc(31px*var(--k))}
.pm .p-stat{flex:1;padding-left:calc(34px*var(--k));border-left:1px solid var(--line)}
.pm .p-stat:first-child{padding-left:0;border-left:0}
.pm .p-stat.off{display:none}
.pm .p-stat-l{font-size:calc(13.5px*var(--k));font-weight:600;letter-spacing:calc(3.4px*var(--k));color:var(--soft)}
.pm .p-stat-v{font-size:calc(28px*var(--k));font-weight:600;color:var(--brown); margin-top:calc(9px*var(--k));line-height:1.24}
.pm .p-stat-s{font-size:calc(17.5px*var(--k));font-weight:400;color:var(--muted);margin-top:calc(3px*var(--k))}
.pm .p-sec{margin-top:calc(46px*var(--k))}
.pm .p-sec.off{display:none}
.pm .p-sec-h{display:flex;align-items:center}
.pm .p-sec-h span{font-size:calc(23px*var(--k));font-weight:700;letter-spacing:calc(4.4px*var(--k)); color:var(--brown);text-transform:uppercase}
.pm .p-sec-line{flex:1;height:1px;background:var(--line);margin-left:calc(24px*var(--k));display:block}
.pm .p-lead{margin-top:calc(22px*var(--k));padding:calc(29px*var(--k)) calc(34px*var(--k)); background:#fff;border:1px solid var(--line);border-radius:calc(18px*var(--k)); font-size:calc(25px*var(--k));line-height:1.55;color:var(--ink)}
.pm .p-jd{margin-top:calc(24px*var(--k))}
.pm .jd-i{display:flex;align-items:flex-start;margin-bottom:calc(16px*var(--k))}
.pm .jd-b{flex:0 0 auto;width:calc(10px*var(--k));height:calc(10px*var(--k));border-radius:50%; background:var(--accent);margin:calc(14px*var(--k)) calc(20px*var(--k)) 0 0}
.pm .jd-t{font-size:calc(26px*var(--k));line-height:1.52;color:var(--ink);font-weight:400}
.pm .p-ben{display:flex;flex-wrap:wrap;margin:calc(15px*var(--k)) calc(-8px*var(--k)) 0}
.pm .ben-i{width:calc(33.333% - 16px*var(--k));min-height:calc(88px*var(--k));margin:calc(8px*var(--k)); display:flex;align-items:center;background:#fff;border:1px solid var(--line); border-radius:calc(16px*var(--k));padding:calc(16px*var(--k)) calc(18px*var(--k))}
.pm .ben-ic{flex:0 0 auto;width:calc(50px*var(--k));height:calc(50px*var(--k)); border-radius:calc(14px*var(--k));background:#F6EDE2; display:flex;align-items:center;justify-content:center;margin-right:calc(15px*var(--k))}
.pm .ben-ic svg{width:calc(27px*var(--k));height:calc(27px*var(--k))}
.pm .ben-t{font-size:calc(20px*var(--k));font-weight:500;color:var(--brown);line-height:1.3}
.pm .p-foot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between; background:var(--brown);padding:max(32px, calc(46px*var(--k))) max(58px, calc(82px*var(--k)))}
.pm .p-apply{font-size:calc(16px*var(--k));font-weight:600;letter-spacing:calc(4.4px*var(--k)); color:rgba(254,245,230,.7);text-transform:uppercase}
.pm .p-phone{font-family:'Archivo Black','Poppins',sans-serif;font-size:calc(63px*var(--k)); line-height:1.1;color:var(--cream);margin-top:calc(11px*var(--k))}
.pm .p-note{font-size:calc(19px*var(--k));color:rgba(254,245,230,.62);margin-top:calc(9px*var(--k))}
.pm .p-foot-r{text-align:right;padding-left:calc(26px*var(--k))}
.pm .p-web-l{font-size:calc(13.5px*var(--k));font-weight:600;letter-spacing:calc(4.4px*var(--k));color:rgba(254,245,230,.5)}
.pm .p-web{font-size:calc(27px*var(--k));font-weight:600;color:var(--cream);margin-top:calc(7px*var(--k))}
.pm .p-strip{flex:0 0 auto;height:16px;background:var(--accent)}
@keyframes pmsp{to{transform:rotate(360deg)}}
@media (max-width:1250px){.pm .wrap{flex-direction:column}.pm .panel.form{width:100%;flex:none;position:static;max-height:none;margin:0 0 16px}}
.pm .pv-btns{gap:6px;flex-wrap:wrap}
.pm .secs-foot .hint{margin:0 0 0 10px}
.pm .addrow .btn{margin-left:6px}
.pm .busy{display:none;position:fixed;inset:0;z-index:80;background:rgba(62,40,22,.30);align-items:center;justify-content:center}
.pm .busy.on{display:flex}
.pm .busy-box{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:16px 22px;font-size:13.5px;font-weight:500;color:var(--brown)}
.pm .pv-bar{flex-wrap:wrap;gap:8px}

</style>
<script>
/* =====================================================================
   HR · Hiring Poster Maker — the same maker as the old app (A4 poster +
   job description, WhatsApp / Instagram share sizes, A4 print, PDF,
   caption), inside One Login. Config lives in the Poster tabs here.
   ===================================================================== */
V.poster = function (el) {
  el.innerHTML = pageHead('Hiring Poster', '', '<a class="btn sm ghost" id="pmSheet" target="_blank">' + icon('table_chart') + 'Edit outlets, roles & sections</a>') +
    '<div class="card">' + loadingHtml('Opening the poster maker…') + '</div>';
  if (!document.getElementById('pmFonts')) {
    var lk = document.createElement('link'); lk.id = 'pmFonts'; lk.rel = 'stylesheet';
    lk.href = 'https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@300;400;500;600;700&display=swap';
    document.head.appendChild(lk);
  }
  api('poster.config').then(function (cfg) { posterMaker(el, cfg); }).catch(function (e) { el.innerHTML = pageHead('Hiring Poster') + errHtml(e); });
};

function posterMaker(el, CFG) {
  'use strict';
  var H2C = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  var JSPDF = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
  var SET = CFG.settings || {};
  var POSTER_W = 1240, POSTER_H = 1754, K_MIN = 0.58;
  var QUALITY = [
    { key: 'hd', label: 'JPG · HD  2×', mult: 2, mime: 'image/jpeg', q: 1.0, ext: 'jpg' },
    { key: 'ultra', label: 'JPG · Ultra  3×', mult: 3, mime: 'image/jpeg', q: 1.0, ext: 'jpg' },
    { key: 'max', label: 'JPG · Maximum  4×', mult: 4, mime: 'image/jpeg', q: 1.0, ext: 'jpg' },
    { key: 'exact', label: 'JPG · exact size 1×', mult: 1, mime: 'image/jpeg', q: 1.0, ext: 'jpg' },
    { key: 'png', label: 'PNG · lossless 1×', mult: 1, mime: 'image/png', q: null, ext: 'png' }
  ];
  var SHARE = [
    { key: 'status', label: 'WhatsApp Status  1080 × 1920', w: 1080, h: 1920, safe: { x: 70, y: 230, w: 940, h: 1330 }, suffix: 'Status' },
    { key: 'post', label: 'Instagram / Facebook  1080 × 1350', w: 1080, h: 1350, safe: { x: 56, y: 56, w: 968, h: 1238 }, suffix: 'Post' },
    { key: 'square', label: 'Square post  1080 × 1080', w: 1080, h: 1080, safe: { x: 60, y: 52, w: 960, h: 976 }, suffix: 'Square' }
  ];
  function s(key, fallback) { var v = SET[key]; return (v === undefined || v === null || v === '') ? fallback : String(v); }
  var BROWN = s('Brand Brown', '#6B3F1C'), CREAM = s('Brand Cream', '#FEF5E6'), ACCENT = s('Brand Accent', '#E8A317'), CUR = s('Currency Symbol', '₹');

  el.innerHTML = pageHead('Hiring Poster', '',
    (CFG.sheetUrl ? '<a class="btn sm ghost" href="' + h(CFG.sheetUrl) + '" target="_blank">' + icon('table_chart') + 'Edit outlets, roles & sections</a>' : '')) +
    '<div class="pm" id="pmRoot"><main class="wrap">' +
    '<section class="panel form">' +
      '<div class="grp"><div class="grp-h">1 · Position</div>' +
        '<label class="fl">Load a saved role<select id="fRole"></select></label>' +
        '<label class="fl">Job title<input id="fTitle" type="text" placeholder="Cashier" maxlength="42"></label>' +
        '<div class="row3"><label class="fl">Openings<input id="fVac" type="text" placeholder="2" maxlength="6"></label>' +
        '<label class="fl">Job type<input id="fType" type="text" placeholder="Full Time" maxlength="22"></label>' +
        '<label class="fl">Experience<input id="fExp" type="text" placeholder="0–2 years" maxlength="22"></label></div>' +
        '<label class="chk" id="fFreshWrap"><input id="fFresh" type="checkbox"><span>No experience needed — print <b>“Freshers Welcome”</b> on the poster</span></label>' +
        '<div class="row2"><label class="fl">Salary from (₹)<input id="fSalFrom" type="number" placeholder="12000" min="0" step="500"></label>' +
        '<label class="fl">Salary to (₹)<input id="fSalTo" type="number" placeholder="15000" min="0" step="500"></label></div>' +
        '<div class="hint">Leave both blank to print “Salary as per experience”.</div></div>' +
      '<div class="grp"><div class="grp-h">2 · Location &amp; contact</div>' +
        '<label class="fl">Outlet<select id="fOutlet"></select></label>' +
        '<div class="row2"><label class="fl">Address line 1<input id="fLine1" type="text" maxlength="40"></label><label class="fl">Address line 2<input id="fLine2" type="text" maxlength="40"></label></div>' +
        '<div class="row2"><label class="fl">Call / WhatsApp number<input id="fPhone" type="text" maxlength="20"></label><label class="fl">Website<input id="fWeb" type="text" maxlength="34"></label></div>' +
        '<label class="fl">Footer note <span class="opt">optional</span><input id="fNote" type="text" maxlength="52" placeholder="Walk-in interview · 11 AM to 5 PM"></label></div>' +
      '<div class="grp"><div class="grp-h">3 · Poster content &amp; order</div>' +
        '<div class="hint">Tick a block to print it. Drag the handle — or use ↑ ↓ — to change the order on the poster. Unticked blocks still go into the caption text.</div>' +
        '<div id="fSections" class="secs"></div>' +
        '<div class="addrow"><input id="fNewSec" type="text" placeholder="Add a heading — e.g. Company Profile" maxlength="40">' +
        '<select id="fNewSecType" title="How this block prints"><option value="bullets">Bullet points</option><option value="paragraph">Paragraph</option></select>' +
        '<button id="btnAddSec" class="btn sm" type="button">Add</button></div>' +
        '<label class="chk"><input id="fSaveSec" type="checkbox" checked><span>Keep the new heading in the <b>Poster Sections</b> tab for next time</span></label>' +
        '<div class="secs-foot"><button id="btnSaveOrder" class="btn sm ghost" type="button">Save this order as default</button><span class="hint">Writes the sequence, headings and ticks back to the sheet.</span></div></div>' +
      '<div class="grp"><div class="grp-h">4 · Benefit list</div>' +
        '<div class="hint">These print inside the <b>What you get</b> block — move that block in section 3 to change where it lands on the poster.</div>' +
        '<div id="fBen" class="benlist"></div>' +
        '<div class="addrow"><input id="fNewBen" type="text" placeholder="Add a benefit — e.g. Bonus after 6 months" maxlength="34"><select id="fNewIcon" title="Icon"></select>' +
        '<button id="btnAddBen" class="btn sm" type="button">Add</button></div>' +
        '<label class="chk"><input id="fSaveBen" type="checkbox" checked><span>Keep it in the Poster Benefits tab for next time</span></label></div>' +
    '</section>' +
    '<section class="panel preview">' +
      '<div class="pv-bar"><div class="pv-title">Preview <span id="pvSize" class="pv-size"></span><span id="pvWarn" class="pv-warn"></span></div>' +

  }
  function scaleStage() {
    var stage = $i('stage'), poster = $i('poster'); if (!stage || !poster) return;
    var pad = 24, avail = Math.max(280, stage.clientWidth - pad), scale = Math.min(1, avail / POSTER_W);
    poster.style.transform = 'scale(' + scale + ')'; poster.style.marginLeft = (pad / 2) + 'px'; poster.style.marginTop = (pad / 2) + 'px';
    stage.style.height = Math.ceil(poster.offsetHeight * scale + pad) + 'px';
    var k = parseFloat(getComputedStyle(poster).getPropertyValue('--k')) || 1;
    $i('pvSize').textContent = 'A4 · ' + POSTER_W + ' × ' + POSTER_H + ' px' + (k < 0.995 ? ' · text at ' + Math.round(k * 100) + '%' : '');
  }

  /* ---------- capture · JPG / PNG / PDF ---------- */
  function pBusy(on, msg) {
    $i('busyTxt').textContent = msg || 'Working…'; $i('pmBusy').className = on ? 'busy on' : 'busy';
    ['btnShare', 'btnPng', 'btnPdf', 'btnCap'].forEach(function (id) { $i(id).disabled = on; });
  }
  function safeName(ext, suffix) {
    var t = ($i('fTitle').value || 'Position').replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-');
    var o = (outletName() || 'Outlet').replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-');
    var d = new Date(), stamp = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    return 'CG-Hiring_' + t + '_' + o + '_' + stamp + (suffix ? '_' + suffix : '') + '.' + ext;
  }
  function captureCanvas(scale) {
    var poster = $i('poster'), stage = $i('stage'), keepT = poster.style.transform, keepH = stage.style.height;
    poster.style.transform = 'none'; poster.style.margin = '0'; stage.style.height = 'auto';
    return loadScript(H2C).then(function () { return document.fonts && document.fonts.ready ? document.fonts.ready : null; })
      .then(function () {
        return html2canvas(poster, { scale: scale || 2, backgroundColor: CREAM, useCORS: true, logging: false, width: poster.offsetWidth, height: poster.offsetHeight,
          windowWidth: POSTER_W + 120, scrollX: 0, scrollY: -window.scrollY });
      })
      .then(function (canvas) { poster.style.transform = keepT; stage.style.height = keepH; scaleStage(); return canvas; })
      .catch(function (err) { poster.style.transform = keepT; stage.style.height = keepH; scaleStage(); throw err; });
  }
  function shade(hex, f) {
    var m = /^#?([0-9a-f]{6})$/i.exec(String(hex).trim()); if (!m) return '#43250F';
    var n = parseInt(m[1], 16); return 'rgb(' + Math.round(((n >> 16) & 255) * f) + ',' + Math.round(((n >> 8) & 255) * f) + ',' + Math.round((n & 255) * f) + ')';
  }
  function stepDown(src, targetW) {
    var cur = src;
    while (cur.width / 2 > targetW) {
      var half = document.createElement('canvas'); half.width = Math.round(cur.width / 2); half.height = Math.round(cur.height / 2);
      var hg = half.getContext('2d'); hg.imageSmoothingEnabled = true; hg.imageSmoothingQuality = 'high'; hg.drawImage(cur, 0, 0, half.width, half.height); cur = half;
    }
    return cur;
  }
  function composeShare(src, preset, mult) {
    var m = mult || 1, c = document.createElement('canvas'); c.width = preset.w * m; c.height = preset.h * m;
    var g = c.getContext('2d'); g.fillStyle = shade(BROWN, 0.66); g.fillRect(0, 0, c.width, c.height);
    var sc = Math.min(preset.safe.w / POSTER_W, preset.safe.h / POSTER_H), w = Math.round(POSTER_W * sc * m), hh = Math.round(POSTER_H * sc * m);
    var x = Math.round((preset.safe.x + (preset.safe.w - w / m) / 2) * m), y = Math.round((preset.safe.y + (preset.safe.h - hh / m) / 2) * m);
    var small = stepDown(src, w); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high'; g.drawImage(small, 0, 0, small.width, small.height, x, y, w, hh);
    return c;
  }
  function mb(bytes) { return (bytes / 1048576).toFixed(2) + ' MB'; }
  function captureFor(mult) { var want = Math.min(3, Math.max(2, mult)); return captureCanvas(want).catch(function () { return captureCanvas(2); }); }
  function meta(fmt) { return { outlet: outletName(), title: $i('fTitle').value, vacancies: $i('fVac').value, salary: salaryText().v, format: fmt }; }
  function blobToB64(blob) { return new Promise(function (res, rej) { var fr = new FileReader(); fr.onload = function () { res(String(fr.result).split(',')[1]); }; fr.onerror = rej; fr.readAsDataURL(blob); }); }
  function showResult(html, isErr) { var r = $i('result'); r.className = 'result on' + (isErr ? ' err' : ''); r.innerHTML = html; }
  function upload(blob, name, mime, fmt) {
    pBusy(true, 'Saving to Drive…');
    blobToB64(blob).then(function (b64) { return api('poster.save', { fileName: name, mimeType: mime, data: b64, meta: meta(fmt) }); }).then(function (res) {
      pBusy(false);
      showResult('<span class="rl">Poster ready</span><a href="' + escAttr(res.downloadUrl) + '" target="_blank" rel="noopener">Download link</a><a href="' + escAttr(res.viewUrl) + '" target="_blank" rel="noopener">Open in Drive</a>' +
        '<a href="' + escAttr(res.folderUrl) + '" target="_blank" rel="noopener">All posters</a><div style="margin-top:8px;font-size:12px;color:#8C7259">' + esc(name) + ' · share the download link on WhatsApp or download it again any time.</div>');
    }).catch(function (err) { pBusy(false); showResult('<span class="rl">Saved on this device only</span>' + esc(err.message), true); });
  }
  function deliver(blob, name, mime, fmt) {

    if ($i('fDrive').checked) upload(blob, name, mime, fmt);
    else { pBusy(false); showResult('<span class="rl">Downloaded</span><b>' + esc(name) + '</b> saved to this device.<div style="margin-top:6px;font-size:12px;color:#8C7259">Not uploaded to Drive. Tick <b>Save to Drive</b> above if you also want a share link.</div>'); }
  }
  function fail(err) { pBusy(false); showResult('<span class="rl">Could not render</span>' + esc(err && err.message ? err.message : err), true); }
  function doShare() {
    var preset = SHARE[Number($i('fShare').value) || 0], Q = qual();
    pBusy(true, 'Rendering ' + (preset.w * Q.mult) + ' × ' + (preset.h * Q.mult) + '…');
    captureFor(Q.mult).then(function (canvas) {
      var out = composeShare(canvas, preset, Q.mult), name = safeName(Q.ext, preset.suffix);

          (Q.mime === 'image/png' ? 'PNG, lossless' : 'JPG at maximum quality') + '<div style="margin-top:6px;font-size:12px;color:#8C7259">Posts at ' + esc(preset.label.split('  ')[0]) +

  /* ---------- WhatsApp / social caption, in the same block order ---------- */
  function captionText() {
    var L = [], sal = salaryText();
    var loc = [outletName(), $i('fLine1').value, $i('fLine2').value].filter(function (x, i, a) { return x && a.indexOf(x) === i; }).join(', ');
    L.push('*' + s('Poster Headline', 'WE ARE HIRING') + ' — ' + ($i('fTitle').value || '').toUpperCase() + '*');
    L.push(s('Company Name', 'Chai Govindam') + (loc ? ' · ' + loc : '')); L.push('');
    L.push('*Salary:* ' + sal.v + (sal.s ? ' ' + sal.s : ''));
    if ($i('fVac').value.trim()) L.push('*Openings:* ' + $i('fVac').value.trim());
    var capExp = $i('fExp').value.trim() || ($i('fFresh').checked ? 'Freshers Welcome' : ''); if (capExp) L.push('*Experience:* ' + capExp);
    if ($i('fType').value.trim()) L.push('*Job type:* ' + $i('fType').value.trim());
    var bens = selectedBenefits();
    SECS.forEach(function (sec) {
      var head = String(sec.heading || '').trim();
      if (sec.type === 'benefits') { if (!bens.length) return; L.push(''); L.push('*' + head + '*'); bens.forEach(function (b) { L.push('• ' + b.label); }); return; }
      var t = String(sec.text || '').trim(); if (!t) return;
      L.push(''); L.push('*' + head + '*');
      if (sec.type === 'paragraph') L.push(t); else splitPoints(t).forEach(function (p) { L.push('• ' + p); });
    });
    L.push(''); L.push('*' + s('Apply Line', 'TO APPLY — CALL / WHATSAPP') + ':* ' + ($i('fPhone').value.trim() || s('Default Contact', '')));
    if ($i('fNote').value.trim()) L.push($i('fNote').value.trim()); if ($i('fWeb').value.trim()) L.push($i('fWeb').value.trim());
    return L.join('\n');
  }
  function copyCaption() {
    var txt = captionText();
    copyText(txt);
    showResult('<span class="rl">Caption copied</span>Paste it with the poster on WhatsApp, Instagram or Facebook.<textarea readonly style="width:100%;height:120px;margin-top:8px;font:inherit;font-size:12px;border:1px solid #E6DACB;border-radius:8px;padding:8px">' + esc(txt) + '</textarea>');
  }

  /* ---------- boot ---------- */
  $i('pLogo').src = CG_POSTER_LOGO;
  fillSelect($i('fRole'), CFG.roles || [], function (r) { return r.title; }, '— custom position —');
  fillSelect($i('fOutlet'), CFG.outlets || [], function (o) { return o.name; }, '— type address below —');
  initSections(); buildSections(); wireSections(); buildBenefits();
  ICON_NAMES.forEach(function (ic) { $i('fNewIcon').appendChild(new Option(ic[1], ic[0])); }); $i('fNewIcon').value = 'star';
  $i('fWeb').value = s('Website', 'chaigovindam.com'); $i('fPhone').value = s('Default Contact', ''); $i('fNote').value = s('Footer Note', ''); $i('fType').value = 'Full Time';
  if ((CFG.roles || []).length) { $i('fRole').value = '0'; applyRole(0); }
  if ((CFG.outlets || []).length) { $i('fOutlet').value = '0'; applyOutlet(0); }
  $i('fRole').addEventListener('change', function () { if (this.value !== '') applyRole(Number(this.value)); render(); });
  $i('fOutlet').addEventListener('change', function () { if (this.value !== '') applyOutlet(Number(this.value)); render(); });
  ['fTitle', 'fVac', 'fType', 'fExp', 'fSalFrom', 'fSalTo', 'fLine1', 'fLine2', 'fPhone', 'fWeb', 'fNote'].forEach(function (id) { $i(id).addEventListener('input', render); $i(id).addEventListener('change', render); });
  $i('fBen').addEventListener('change', function (e) { var l = e.target.closest('.chk'); if (l) l.classList.toggle('on', e.target.checked); render(); });
  $i('btnAddBen').addEventListener('click', addBenefit);
  $i('fNewBen').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addBenefit(); } });
  $i('btnAddSec').addEventListener('click', addSectionBlock);
  $i('fNewSec').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addSectionBlock(); } });
  $i('btnSaveOrder').addEventListener('click', saveOrder);
  $i('fFresh').addEventListener('change', render);
  SHARE.forEach(function (sp, i) { $i('fShare').appendChild(new Option(sp.label, String(i))); }); $i('fShare').value = '0';
  QUALITY.forEach(function (q, i) { $i('fQuality').appendChild(new Option(q.label, String(i))); }); $i('fQuality').value = '0';
  $i('btnShare').addEventListener('click', doShare); $i('btnPng').addEventListener('click', doPng); $i('btnPdf').addEventListener('click', doPdf); $i('btnCap').addEventListener('click', copyCaption);
  function onResize() { if (!document.body.contains(ROOT)) { window.removeEventListener('resize', onResize); return; } scaleStage(); }
  window.addEventListener('resize', onResize);

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
  setTimeout(render, 900);
