<script>
/* =====================================================================
   Attendance · Leave Approval · Advance Approval · Roster · Certificates
   ===================================================================== */

/* ---------------- ATTENDANCE ---------------- */
V.attendance = function (el, p) {
  var tab = p.tab || 'day', date = p.date || addDaysISO(todayISO(), -1), month = p.month || thisMonth();
  el.innerHTML = pageHead('Attendance Report', h(outletName())) +
    tabsHtml([['day', 'Day report'], ['month', 'Month · attendance, leave & advance']], tab) + '<div id="ab"></div>';
  bindTabs(el, function (t) { tab = t; show(); });
  /** a compact table: one line per person, tap it for the rest */
  function bindRows(box) {
    $$('tr[data-x]', box).forEach(function (tr) { tr.onclick = function () { var d = tr.nextElementSibling; if (d && d.classList.contains('xrow')) { d.hidden = !d.hidden; tr.classList.toggle('open', !d.hidden); } }; });
  }
  function show() {
    var b = $('#ab', el);
    if (tab === 'day') {
      b.innerHTML = '<div class="card"><div class="row"><div class="field" style="margin:0"><label>Date</label><input type="date" class="inp sm" id="ad" value="' + date + '" max="' + todayISO() + '"></div>' +
        '<div class="seg" style="align-self:flex-end"><button data-o="-1">Yesterday</button><button data-o="-2">Day before</button><button data-o="0">Today</button></div></div></div><div id="adb" class="mt">' + loadingHtml() + '</div>';
      $('#ad', b).onchange = function () { date = this.value; show(); };
      $$('.seg button', b).forEach(function (x) { x.onclick = function () { date = addDaysISO(todayISO(), +x.dataset.o); show(); }; });
      var forDate = date;
      live('att.day', { outletId: S.outlet, date: date }, function (d) {
        var s = d.summary;
        s.penalty = d.rows.reduce(function (t, r) { return t + (Number(r.penalty) || 0); }, 0);
        $('#adb', b).innerHTML = (d.note ? '<div class="pill-note mb">' + h(d.note) + '</div>' : '') +
          '<div class="row mb" style="flex-wrap:wrap">' + chip(s.total + ' staff', 'grey') + chip(s.present + ' full day', 'green') + (s.half ? chip(s.half + ' half day', 'orange') : '') +
          (s.leave ? chip(s.leave + ' on leave', 'blue') : '') + (s.missed ? chip(s.missed + ' punch missed', 'orange') : '') + (s.absent ? chip(s.absent + ' absent / no punch', 'red') : '') +
          (s.penalty ? chip('penalty ' + money(s.penalty), 'red') : '') + '</div>' +
          (d.rows.length ? '<div class="tbl-wrap"><table class="tbl compact"><tr><th>Employee</th><th>In – Out</th><th>Status</th><th class="num">Penalty</th></tr>' +
            d.rows.map(function (r) {
              return '<tr class="click" data-x><td><div class="b">' + h(r.name) + '</div><div class="tiny muted">' + h(r.designation) + (S.outlet === 'ALL' ? ' · ' + h(r.outlet) : '') + '</div></td>' +
                '<td class="nowrap small">' + h(r.in || '—') + ' – ' + h(r.out || '—') + '</td><td>' + statusChip(r.status) + (r.late > 0 ? '<div class="tiny" style="color:var(--orange)">late ' + r.late + ' min</div>' : '') + '</td>' +
                '<td class="num">' + (r.penalty > 0 ? '<span style="color:var(--red)">' + money(r.penalty) + '</span>' : '<span class="muted">—</span>') + '</td></tr>' +
                '<tr class="xrow" hidden><td colspan="4"><div class="kv small"><b>ID</b><span>' + h(r.id) + '</span><b>Shift</b><span>' + h(r.shift || '—') + '</span><b>Worked</b><span>' + h(r.hours || '—') + '</span>' +
                (r.brk ? '<b>Break</b><span>' + h(r.brk) + '</span>' : '') + (r.penaltyText ? '<b>Penalty for</b><span>' + h(r.penaltyText) + '</span>' : '') + '</div></td></tr>';
            }).join('') + '</table></div>' : '<div class="card">' + emptyHtml('groups', 'No employee is linked to this outlet yet.') + '</div>');
        bindRows($('#adb', b));
      }, { alive: function () { return tab === 'day' && date === forDate; } }).catch(function (e) { $('#adb', b).innerHTML = errHtml(e); });
    } else {
      b.innerHTML = '<div class="card"><div class="row"><div class="field" style="margin:0"><label>Month</label><input type="month" class="inp sm" id="am" value="' + h(month) + '" max="' + thisMonth() + '"></div>' +
        '<span class="grow"></span></div></div><div id="amb" class="mt">' + loadingHtml() + '</div>';
      $('#am', b).onchange = function () { if (this.value) { month = this.value; show(); } };
      var forMonth = month;
      live('att.month', { outletId: S.outlet, month: month }, function (d) {
        var P = d.people || [], t = { full: 0, half: 0, absent: 0, leave: 0, pen: 0 };
        P.forEach(function (x) { t.full += x.full; t.half += x.half; t.absent += x.absent; t.leave += x.leave; t.pen += x.penalty; });
        var open = function (n) { return n && n <= 6 ? ' open' : ''; };
        $('#amb', b).innerHTML = '<div class="row mb" style="flex-wrap:wrap">' + chip(d.month, 'brown') + chip(t.full + ' full days', 'green') + (t.half ? chip(t.half + ' half days', 'orange') : '') +
          (t.absent ? chip(t.absent + ' absent', 'red') : '') + (t.leave ? chip(t.leave + ' leave / week off', 'blue') : '') + (t.pen ? chip('penalty ' + money(t.pen), 'red') : '') + '</div>' +
          '<details class="card"' + open(P.length || 1) + '><summary class="b" style="cursor:pointer">' + icon('how_to_reg') + ' Attendance · ' + P.length + ' people</summary><div class="mt">' +
          (P.length ? '<div class="tbl-wrap"><table class="tbl compact"><tr><th>Employee</th><th class="num">Full</th><th class="num">Half</th><th class="num">Absent</th><th class="num">Leave</th><th class="num">Penalty</th></tr>' +
            P.map(function (x) {
              return '<tr class="click" data-x><td><div class="b">' + h(x.name) + '</div><div class="tiny muted">' + h(x.designation) + (x.late ? ' · late ' + x.late + '×' : '') + '</div></td><td class="num">' + x.full + '</td><td class="num">' + (x.half || '—') + '</td>' +
                '<td class="num">' + (x.absent ? '<b style="color:var(--red)">' + x.absent + '</b>' : '—') + '</td><td class="num">' + (x.leave || '—') + '</td><td class="num">' + (x.penalty ? '<span style="color:var(--red)">' + money(x.penalty) + '</span>' : '—') + '</td></tr>' +
                '<tr class="xrow" hidden><td colspan="6"><div class="small" style="line-height:1.8">' + x.days.map(function (y) {
                  return '<div class="row gap6"><b class="nowrap" style="min-width:86px">' + h(y.d) + '</b>' + statusChip(y.s) + '<span class="muted nowrap">' + h(y.i) + ' – ' + h(y.o) + '</span>' +
                    (y.l ? '<span style="color:var(--orange)">late ' + y.l + 'm</span>' : '') + (y.p ? '<span style="color:var(--red)" title="' + h(y.t) + '">' + money(y.p) + '</span>' : '') + '</div>'; }).join('') + '</div></td></tr>';
            }).join('') + '</table></div>' : emptyHtml('cloud_off', 'No attendance uploaded for ' + d.month + ' yet.')) + '</div></details>' +
          '<details class="card mt"' + open(d.leaves.length) + '><summary class="b" style="cursor:pointer">' + icon('event_busy') + ' Leave · ' + d.leaves.length + '</summary><div class="mt">' +
          (d.leaves.length ? '<div class="tbl-wrap"><table class="tbl compact"><tr><th>Employee</th><th>From – To</th><th>Your step</th><th>Final</th></tr>' +
            d.leaves.map(function (l) {
              return '<tr class="click" data-x><td><div class="b">' + h(l.name) + '</div><div class="tiny muted">' + h(l.designation) + '</div></td><td class="nowrap small">' + h(l.from) + (l.to && l.to !== l.from ? ' – ' + h(l.to) : '') + ' · ' + num(l.days) + 'd</td>' +
                '<td>' + (l.l1 === '-' ? '<span class="muted">—</span>' : statusChip(l.l1)) + '</td><td>' + statusChip(l.final) + '</td></tr>' +
                '<tr class="xrow" hidden><td colspan="4" class="small">' + h(l.reason || '—') + (l.replacement ? ' · replacement: ' + h(l.replacement) : '') + '</td></tr>';
            }).join('') + '</table></div>' : emptyHtml('event_available', 'No leave in ' + d.month + '.')) + '</div></details>' +
          '<details class="card mt"' + open(d.advances.length) + '><summary class="b" style="cursor:pointer">' + icon('payments') + ' Advance · ' + d.advances.length + '</summary><div class="mt">' +
          (d.advances.length ? '<div class="tbl-wrap"><table class="tbl compact"><tr><th>Employee</th><th class="num">Requested</th><th class="num">Approved</th><th>Stage</th></tr>' +
            d.advances.map(function (a) {
              var amt = a.admAmount || a.hrAmount || a.incAmount;
              return '<tr class="click" data-x><td><div class="b">' + h(a.name) + '</div><div class="tiny muted">' + h(a.designation) + '</div></td><td class="num">' + money(a.requested) + '</td><td class="num">' + (amt ? money(amt) : '—') + '</td><td>' + statusChip(a.stage) + '</td></tr>' +
                '<tr class="xrow" hidden><td colspan="4" class="small">Applied ' + h(a.applied) + (a.purpose ? ' · ' + h(a.purpose) : '') + '</td></tr>';
            }).join('') + '</table></div>' : emptyHtml('payments', 'No advance in ' + d.month + '.')) + '</div></details>';
        bindRows($('#amb', b));
      }, { alive: function () { return tab === 'month' && month === forMonth; } }).catch(function (e) { $('#amb', b).innerHTML = errHtml(e); });
    }
  }
  show();
};

/* ---------------- LEAVE APPROVAL ---------------- */
V.leave = function (el) {
  el.innerHTML = pageHead('Leave Approval', '') + '<div id="lb">' + loadingHtml() + '</div>';
  var b = $('#lb', el);
  function load(quiet) {
    live('leave.list', { outletId: S.outlet }, draw, { el: b, busy: true, quiet: quiet }).catch(function (e) { b.innerHTML = errHtml(e); });
  }
  function draw(d) {
    setBadge('leave', d.pending.length);
    b.innerHTML = '<div class="section-title mt0" data-cnt>Waiting for you (' + d.pending.length + ')</div>' +
      (d.pending.length ? '<div class="list">' + d.pending.map(function (l, i) {
        var staff = d.staff.filter(function (s) { return s.outletId === l.outletId && s.id !== l.empId; });
        return '<div class="li" data-m="' + h(l.month || String(l.sheet || '').replace(/^(Leave|Advance|Reimbursement) /, '')) + '" data-sum="' + h(l.from + (l.to && l.to !== l.from ? ' → ' + l.to : '') + ' · ' + num(l.days) + ' day(s)' + (l.reason ? ' · ' + l.reason : '')) + '"><div class="top"><div class="grow"><div class="title">' + h(l.name) + ' <span class="small muted">' + h(l.empId) + ' · ' + h(l.designation) + '</span></div>' +
          '<div class="row gap6 mt" style="margin-top:6px">' + chip(l.from + (l.to && l.to !== l.from ? ' → ' + l.to : ''), 'blue') + chip(l.days + ' day' + (l.days > 1 ? 's' : ''), 'grey') +
          (S.outlet === 'ALL' ? chip(l.outlet, 'grey') : '') + '</div>' +
          '<div class="mt" style="margin-top:6px">' + h(l.reason || '—') + '</div><div class="small muted">Applied ' + h(l.applied) + '</div>' +
          (l.skipped ? '<div class="mt">' + chip('Sent straight to HR · HR not decided yet', 'orange') + '</div>' : '') + '</div></div>' +
          '<div class="form-grid mt"><div class="field"><label>Replacement (optional)</label><select class="inp sm" data-rep="' + i + '"><option value="">—</option>' +
          staff.map(function (s) { return '<option value="' + h(s.id) + '">' + h(s.name) + ' · ' + h(s.designation) + '</option>'; }).join('') + '</select></div>' +
          '<div class="field"><label>Remarks</label><input class="inp sm" data-rm="' + i + '" placeholder="Required when rejecting"></div></div>' +
          '<div class="row"><span class="grow"></span><button class="btn sm red" data-rej="' + i + '">' + icon('close') + 'Reject</button><button class="btn sm green" data-app="' + i + '">' + icon('check') + 'Approve</button></div></div>';
      }).join('') + '</div>' : '<div class="card">' + emptyHtml('event_available', 'No leave request is pending with you.') + '</div>') +
      '<details class="card mt"><summary class="b" style="cursor:pointer">' + icon('history') + ' Done at your step · this month (' + d.recent.length + ')</summary><div class="mt">' + (d.recent.length ? '<div class="tbl-wrap"><table class="tbl"><tr><th>Employee</th><th>Dates</th><th>Your step</th><th>Final</th><th>Remarks</th></tr>' +
        d.recent.map(function (l) { return '<tr><td>' + h(l.name) + '</td><td class="nowrap">' + h(l.from) + (l.to !== l.from ? ' – ' + h(l.to) : '') + '</td><td>' + (l.l1 === '-' || l.l1 === '' ? chip('Went straight to HR', 'grey') : statusChip(l.l1)) + (l.l1By ? '<div class="small muted">' + h(l.l1By) + '</div>' : '') + '</td><td>' + statusChip(l.final) + '</td><td class="small">' + h(l.remarks) + (l.replacement ? '<br>Replacement: ' + h(l.replacement) : '') + '</td></tr>'; }).join('') + '</table></div>' : emptyHtml('history', 'Nothing decided yet this month.')) + '</div></details>';
    function decide(i, dec, btn) {
      var l = d.pending[i], card = btn.closest('.li'), rm = $('[data-rm="' + i + '"]', b).value;
      if (dec === 'REJECTED' && !rm.trim()) return toast('Write the reason for rejecting.', 'bad');
      park(card, true); recount(b, 'leave');                                   // at once — saved behind it
      saveInBg('leave.decide', { sheet: l.sheet, row: l.row, empId: l.empId, decision: dec, remarks: rm, replacementId: $('[data-rep="' + i + '"]', b).value },
        (dec === 'APPROVED' ? 'Approving ' : 'Rejecting ') + l.name + '…')
        .then(function () { park(card, 'gone'); if (!SAVING) load(true); })
        .catch(function (e) { park(card, false); recount(b, 'leave'); if (STALE_RE.test(e.message)) load(true); });
    }
    $$('[data-app]', b).forEach(function (x) { x.onclick = function () { decide(+x.dataset.app, 'APPROVED', x); }; });
    $$('[data-rej]', b).forEach(function (x) { x.onclick = function () { decide(+x.dataset.rej, 'REJECTED', x); }; });
    foldCards(b);
    if ($('.list', b)) monthChips($('.list', b), monthLabelNow(), b);
  }
  load(false);
};
/** "Pending with you (n)" and the menu badge right after a card was decided (the server's list follows). */
function recount(b, badge) {
  var n = $$('.li', b).filter(function (x) { return !x.dataset.gone; }).length, t = $('[data-cnt]', b);
  if (t) t.textContent = 'Pending with you (' + n + ')';
  setBadge(badge, n);
}

/* ---------------- ADVANCE APPROVAL ---------------- */
V.advance = function (el) {
  el.innerHTML = pageHead('Advance Approval', '') + '<div id="vb">' + loadingHtml() + '</div>';
  var b = $('#vb', el);
  function load(quiet) {
    live('adv.list', { outletId: S.outlet }, draw, { el: b, busy: true, quiet: quiet }).catch(function (e) { b.innerHTML = errHtml(e); });
  }
  function draw(d) {
    setBadge('advance', d.pending.length);
    b.innerHTML = '<div class="section-title mt0" data-cnt>Waiting for you (' + d.pending.length + ')</div>' +
      (d.pending.length ? '<div class="list">' + d.pending.map(function (a, i) {
        var amt = Math.min(a.requested || a.maxSuggest, a.maxSuggest || a.requested);
        return '<div class="li" data-m="' + h(a.month || String(a.sheet || '').replace(/^(Leave|Advance|Reimbursement) /, '')) + '" data-sum="' + h(money(a.requested) + ' requested · ' + (a.applied || '') + (a.purpose ? ' · ' + a.purpose : '')) + '"><div class="top"><div class="grow"><div class="title">' + h(a.name) + ' <span class="small muted">' + h(a.empId) + ' · ' + h(a.designation) + '</span></div>' +
          '<div class="small muted">Applied ' + h(a.applied) + (S.outlet === 'ALL' ? ' · ' + h(a.outlet) : '') + '</div>' +
          '<div class="kv mt"><b>Requested</b><span class="b">' + money(a.requested) + '</span><b>Purpose</b><span>' + h(a.purpose || '—') + '</span>' +
          '<b>Present days (claimed)</b><span>' + num(a.days) + '</span><b>Salary</b><span>' + money(a.salary) + ' · ' + money(a.daily) + '/day</span>' +
          '<b>Suggested max</b><span>' + money(a.maxSuggest) + ' <span class="small muted">(' + h(d.rule) + ')</span></span></div>' +
          (a.skipped ? '<div class="mt">' + chip('Sent straight to HR · HR not decided yet', 'orange') + '</div>' : '') + '</div></div>' +
          '<div class="form-grid mt"><div class="field"><label>Max allowed (₹) *</label><input class="inp sm" inputmode="numeric" data-max="' + i + '" value="' + (a.maxSuggest || a.requested) + '"></div>' +
          '<div class="field"><label>Approve amount (₹)</label><input class="inp sm" inputmode="numeric" data-amt="' + i + '" value="' + amt + '"></div>' +
          '<div class="field full"><label>Remarks</label><input class="inp sm" data-rm="' + i + '" placeholder="Required when rejecting"></div></div>' +
          '<div class="row"><span class="grow"></span><button class="btn sm red" data-rej="' + i + '">' + icon('close') + 'Reject</button><button class="btn sm green" data-app="' + i + '">' + icon('check') + 'Approve & send to HR</button></div></div>';
      }).join('') + '</div>' : '<div class="card">' + emptyHtml('payments', 'No advance request is pending with you.') + '</div>') +
      '<details class="card mt"><summary class="b" style="cursor:pointer">' + icon('route') + ' Tracker — from your step to the payment (' + d.tracker.length + ')</summary><div class="mt">' +
      (d.tracker.length ? '<div class="tbl-wrap"><table class="tbl"><tr><th>Employee</th><th class="num">Requested</th><th>You (Outlet Incharge)</th><th>HR</th><th>Director</th><th>Payment</th></tr>' +
        d.tracker.map(function (a) {
          return '<tr><td style="min-width:160px"><div class="b">' + h(a.name) + '</div><div class="small muted">' + h(a.empId) + (S.outlet === 'ALL' ? ' · ' + h(a.outlet) : '') + '</div>' +
            '<div class="row gap6" style="margin-top:4px">' + statusChip(a.stage) + (a.month !== d.month ? chip(a.month, 'grey') : '') + '</div></td>' +
            '<td class="num"><b>' + money(a.requested) + '</b><div class="tiny muted nowrap">' + h(a.applied) + '</div></td>' +
            advSteps(a).map(function (s) { return '<td>' + advCell(s) + '</td>'; }).join('') + '</tr>';
        }).join('') + '</table></div>' : emptyHtml('history', 'Nothing else this month.')) + '</div></details>';
    function decide(i, dec, btn) {
      var a = d.pending[i], card = btn.closest('.li'), rm = $('[data-rm="' + i + '"]', b).value;
      if (dec === 'REJECTED' && !rm.trim()) return toast('Write the reason for rejecting.', 'bad');
      if (dec === 'APPROVED' && !(parseInt($('[data-max="' + i + '"]', b).value, 10) > 0)) return toast('Enter the max allowed amount.', 'bad');
      park(card, true); recount(b, 'advance');
      saveInBg('adv.decide', { sheet: a.sheet, row: a.row, empId: a.empId, decision: dec, maxAllowed: $('[data-max="' + i + '"]', b).value, amount: $('[data-amt="' + i + '"]', b).value, remarks: rm },
        (dec === 'APPROVED' ? 'Approving ' : 'Rejecting ') + a.name + '\u2019s advance…')
        .then(function () { park(card, 'gone'); if (!SAVING) load(true); })
        .catch(function (e) { park(card, false); recount(b, 'advance'); if (STALE_RE.test(e.message)) load(true); });
    }
    $$('[data-app]', b).forEach(function (x) { x.onclick = function () { decide(+x.dataset.app, 'APPROVED', x); }; });
    $$('[data-rej]', b).forEach(function (x) { x.onclick = function () { decide(+x.dataset.rej, 'REJECTED', x); }; });
    foldCards(b);
    if ($('.list', b)) monthChips($('.list', b), monthLabelNow(), b);
  }
  load(false);
};

/* ---------------- ROSTER ---------------- */
function rosterCrumb(title, p) { return '<div class="crumb"><button class="btn sm ghost" id="roBack">' + icon('arrow_back') + 'Roster</button><b>' + h(title) + '</b></div>'; }
function rosterBack(el, p) { $('#roBack', el).onclick = function () { go('roster', { outletId: p.outletId }); }; }
function rosterTime(t) {
  var m = /^(\d{1,2}):(\d{2})/.exec(t || ''); if (!m) return t || '';
  var hh = +m[1], ap = hh >= 12 ? 'PM' : 'AM', h12 = hh % 12 || 12;
  return h12 + (m[2] !== '00' ? ':' + m[2] : '') + ' ' + ap;
}
function rosterLabel(s) { return s.start && s.end ? rosterTime(s.start) + ' – ' + rosterTime(s.end) : s.name; }
function rosterChoices(shifts) { return shifts.filter(function (s) { return (s.start && s.end) || /^L$/i.test(s.code); }); }
function rosterOpts(shifts, code, start, end) {
  var list = rosterChoices(shifts), extra = code && code !== 'MANUAL' && !list.some(function (s) { return s.code === code; }) ? shifts.filter(function (s) { return s.code === code; })[0] : null;
  return '<option value=""></option>' + list.map(function (s) { return '<option value="' + h(s.code) + '"' + (code === s.code ? ' selected' : '') + '>' + h(rosterLabel(s)) + '</option>'; }).join('') +
    (extra ? '<option value="' + h(extra.code) + '" selected>' + h(rosterLabel(extra)) + '</option>' : '') +
    '<option value="MANUAL"' + (code === 'MANUAL' ? ' selected' : '') + '>' + h(code === 'MANUAL' && start ? rosterTime(start) + ' – ' + rosterTime(end) + ' (manual)' : 'Manual timing') + '</option>';
}
function rosterAskTime(cur, done) {
  modal({ title: 'Manual shift timing', body: '<div class="form-grid"><div class="field"><label>Start</label><input type="time" class="inp" data-s value="' + h(cur.start || '') + '"></div>' +
    '<div class="field"><label>End</label><input type="time" class="inp" data-e value="' + h(cur.end || '') + '"></div></div>',
    actions: [{ label: 'Cancel', cls: 'ghost', click: function (close) { close(); done(null); } }, { label: 'Use this timing', cls: 'green', click: function (close, m) {
      var a = val('[data-s]', m), b = val('[data-e]', m); if (!a || !b) return toast('Enter the start and the end.', 'bad'); close(); done({ start: a, end: b });
    } }] });
}
/** Day sheet: the Daily Staff Duty Roster — shift by shift, timing, leave status and replacement (written on the leave row). */
function rosterDay(el, p) {
  el.innerHTML = pageHead('Roster', '') + rosterCrumb('Roster · ' + fmtISO(p.date || todayISO()), p) + '<div id="rb">' + loadingHtml() + '</div>';
  rosterBack(el, p);
  var date = p.date || todayISO();
  api('ros.day', { outletId: p.outletId || singleOutlet(), date: date }).then(function (d) {
    var b = $('#rb', el), n = 0;
    function staffSel(r) {
      if (!r.leave || !r.leave.sheet) return '<span class="muted">-</span>';
      return '<select class="inp sm" data-rep="' + h(r.id) + '" style="min-width:150px"><option value="">No replacement</option>' + d.staff.filter(function (s) { return s.id !== r.id; }).map(function (s) {

  function giveModal(pre, done) {
    var people = M.employees.filter(function (e) { return e.penaltyOn; });
    if (!people.length) return toast('Penalties are switched off for these locations.', 'bad');
    if (!M.catalog.length) return toast('No manual penalty type is set up yet — HR adds them in Payroll ▸ Rules ▸ Penalty rules (Rule Type MANUAL).', 'bad');
    modal({ title: 'Give a penalty', body:
      '<div class="field"><label>Employee *</label><input class="inp sm" data-es placeholder="Search name / ID…" style="margin-bottom:6px">' +
      '<select class="inp" data-emp size="6" style="min-height:150px">' + people.map(function (e) {
        return '<option value="' + h(e.employeeId) + '">' + h(e.name) + ' · ' + h(e.employeeId) + ' · ' + h(e.designation) + (M.wide ? ' · ' + h(e.group) : '') + '</option>'; }).join('') + '</select></div>' +
      '<div class="form-grid"><div class="field"><label>Date *</label><input type="date" class="inp" data-dt value="' + h(pre.date && pre.date <= M.today ? pre.date : M.today) + '" max="' + h(M.today) + '"></div>' +
      '<div class="field"><label>Penalty *</label><select class="inp" data-rule><option value="">Pick the employee first</option></select></div>' +
      '<div class="field"><label>Amount (₹)</label><input class="inp" data-amt inputmode="decimal"' + (M.canAmount ? '' : ' readonly style="background:#FBF6EE"') + '></div>' +
      '<div class="field"><label>Note</label><input class="inp" data-nt placeholder="What happened?"></div></div>' +
      (M.canAmount ? '' : '<div class="small muted">The amount is fixed by HR for each penalty type.</div>'),
      onOpen: function (m) {
        var sel = $('[data-emp]', m), rs = $('[data-rule]', m);
        $('[data-es]', m).oninput = function () {
          var q = this.value.toLowerCase();
          $$('option', sel).forEach(function (o) { o.hidden = q && o.textContent.toLowerCase().indexOf(q) < 0; });
        };
        sel.onchange = function () {
          var e = people.filter(function (p) { return p.employeeId === sel.value; })[0]; if (!e) return;
          var list = rulesFor(e.groupKey);
          rs.innerHTML = list.length ? list.map(function (c) { return '<option value="' + h(c.ruleId) + '" data-amt="' + c.amount + '">' + h(c.label) + ' · ' + money(c.amount) + '</option>'; }).join('') : '<option value="">None for ' + h(e.group) + '</option>';
          rs.onchange();
        };
        rs.onchange = function () { var o = rs.options[rs.selectedIndex]; $('input[data-amt]', m).value = o && o.dataset.amt ? o.dataset.amt : ''; };
      },
      actions: [{ label: 'Cancel', cls: 'ghost' }, { label: icon('gavel') + 'Give penalty', cls: 'red', click: function (close, m, btn) {
        if (!val('[data-emp]', m)) return toast('Pick the employee.', 'bad');
        if (!val('[data-rule]', m)) return toast('Pick the penalty.', 'bad');
        busy(btn, true);
        api('pen.add', { employeeId: val('[data-emp]', m), date: val('[data-dt]', m), ruleId: val('[data-rule]', m), amount: M.canAmount ? val('input[data-amt]', m) : '', notes: val('[data-nt]', m) })
          .then(function (r) { close(); toast(r.message, 'ok'); if (done) done(); }).catch(function (e) { busy(btn, false); toast(e.message, 'bad'); });
      } }] });
  }

  /* ---------- month summary ---------- */
  function summaryTab(x) {
    var now = new Date(), lmA = isoOf(new Date(now.getFullYear(), now.getMonth() - 1, 1)), lmB = isoOf(new Date(now.getFullYear(), now.getMonth(), 0));
    x.innerHTML = '<div class="card"><div class="filters"><span class="small muted">From</span><input type="date" class="inp sm" data-f value="' + h(st.from) + '" max="' + h(M.today) + '">' +
      '<span class="small muted">to</span><input type="date" class="inp sm" data-t value="' + h(st.to) + '" max="' + h(M.today) + '">' +
      '<span class="qf" data-m="this">This month</span><span class="qf" data-m="last">Last month</span>' + scopeSel() +
      '<input class="inp sm" data-q placeholder="Search…" style="width:150px"><span class="grow"></span>' + penDl() + '</div></div>' +
      '<div data-sb class="mt">' + loadingHtml() + '</div>';
    var R = null;
    $('[data-f]', x).onchange = function () { st.from = this.value; summaryTab(x); };
    $('[data-t]', x).onchange = function () { st.to = this.value; summaryTab(x); };
    $$('[data-m]', x).forEach(function (q) {
      q.classList.toggle('on', q.dataset.m === 'this' ? (st.from === M.monthStart && st.to === M.today) : (st.from === lmA && st.to === lmB));
      q.onclick = function () { if (q.dataset.m === 'this') { st.from = M.monthStart; st.to = M.today; } else { st.from = lmA; st.to = lmB; } summaryTab(x); };
    });
    bindScope(x, function () { summaryTab(x); });
    $('[data-q]', x).oninput = debounce(function () { paint(); }, 150);
    bindDl(x, 'summary');
    api('pen.summary', { from: st.from, to: st.to, group: st.group, outletId: st.outletId }).then(function (d) { R = d; paint(); })
      .catch(function (e) { $('[data-sb]', x).innerHTML = errHtml(e); });
    function paint() {
      var q = val('[data-q]', x).toLowerCase(), b = $('[data-sb]', x), t = R.totals;
      var list = R.rows.filter(function (r) { return !q || (r.name + ' ' + r.employeeId + ' ' + r.group).toLowerCase().indexOf(q) >= 0; });
      b.innerHTML = '<div class="kpis mb"><div class="kpi"><div class="l">People with a penalty</div><div class="v">' + t.people + '</div><div class="s">' + h(R.fromText + ' – ' + R.toText) + '</div></div>' +
        '<div class="kpi red"><div class="l">Total</div><div class="v">' + money(t.total) + '</div></div>' +
        '<div class="kpi orange"><div class="l">Automatic</div><div class="v">' + money(t.auto) + '</div></div>' +
        '<div class="kpi violet"><div class="l">Given by hand</div><div class="v">' + money(t.manual) + '</div></div></div>' +
        '<div class="small muted mb">' + R.uploadedDays + ' day(s) of punches uploaded in these dates. Salary preparation deducts these totals.</div>' +
        (list.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Employee</th><th>Location</th><th class="num">Days</th><th class="num">Automatic</th><th class="num">By hand</th><th class="num">Total</th></tr></thead><tbody>' +
          list.map(function (r) {
            return '<tr class="click" data-r="' + R.rows.indexOf(r) + '"><td><div class="b">' + h(r.name) + '</div><div class="small muted">' + h(r.employeeId) + ' · ' + h(r.designation) + '</div></td>' +
              '<td class="small">' + h(r.group) + '</td><td class="num">' + r.days + (r.pending ? ' <span class="tiny muted" title="Given for a day not uploaded yet">+</span>' : '') + '</td>' +
              '<td class="num">' + (r.auto ? money(r.auto) : '—') + '</td><td class="num">' + (r.manual ? money(r.manual) : '—') + '</td><td class="num b" style="color:var(--red)">' + money(r.total) + '</td></tr>';
          }).join('') + '</tbody><tfoot><tr><td colspan="3">Total</td><td class="num">' + money(t.auto) + '</td><td class="num">' + money(t.manual) + '</td><td class="num">' + money(t.total) + '</td></tr></tfoot></table></div>'
          : '<div class="card">' + emptyHtml('sentiment_satisfied', 'No penalty in these dates.') + '</div>');
      $$('[data-r]', b).forEach(function (tr) {
        tr.onclick = function () {
          var r = R.rows[+tr.dataset.r];
          modal({ title: r.name + ' · ' + money(r.total), wide: true, body: '<div class="small muted mb">' + h(r.employeeId + ' · ' + r.designation + ' · ' + r.group) + '</div>' +
            tableHtml([{ t: 'Date', f: function (l) { return '<span class="nowrap">' + h(l.date) + '</span>'; } }, { t: 'Status', f: function (l) { return statusChip(l.status); } },
              { t: 'Why', cls: 'wrap', f: function (l) { return l.items.map(function (i) { return h(i.label) + (i.manual ? ' <span class="chip mini violet">by hand</span>' : '') + (i.notes ? ' <span class="muted small">(' + h(i.notes) + ')</span>' : '') + ' · ' + money(i.amount); }).join('<br>'); } },
              { t: 'Amount', cls: 'num', f: function (l) { return '<b>' + money(l.amount) + '</b>'; } }], r.lines) });
        };
      });
    }
  }

  /* ---------- rules ---------- */
  function rulesTab(x) {
    var by = {}, order = [];
    M.rules.filter(function (r) { return r.type !== 'MANUAL'; }).forEach(function (r) { if (!by[r.group]) { by[r.group] = []; order.push(r.group); } by[r.group].push(r); });
    x.innerHTML = (M.canConfig ? '<div class="row mb"><span class="grow"></span>' +
        '<button class="btn sm ghost" data-edit>' + icon('tune') + 'Edit rules</button></div>' : '') +
      '<div class="card"><h3>' + icon('location_on') + ' Where penalties apply</h3><div class="row gap6">' + M.groups.map(function (g) {
        return chip(g.groupName + (g.applyPenalty ? ' · on' : ' · off'), g.applyPenalty ? 'green' : 'grey'); }).join('') + '</div>' +
        (M.maxPerDay ? '<div class="small muted mt">At most ' + money(M.maxPerDay) + ' per person per day.</div>' : '') +
        '<div class="small muted" style="margin-top:6px">Break allowed: ' + num(M.allowedBreak) + ' minutes a day.</div></div>' +
      (order.length ? order.map(function (g) {
        return '<div class="section-title">Automatic · ' + h(g) + '</div>' + tableHtml([
          { t: 'Penalty', f: function (r) { return '<b>' + h(r.label) + '</b>'; } },
          { t: 'When', cls: 'wrap', f: function (r) { return h(r.typeText) + (r.unit ? ' — ' + num(r.from) + (r.to ? ' to ' + num(r.to) : '+') + ' ' + h(r.unit) : ''); } },
          { t: 'Amount', f: function (r) { return h(amountText(r)); } },
          { t: 'Shift', f: function (r) { return h(r.shift || 'All'); } },
          { t: 'Charged from', f: function (r) { return h(r.since || 'Always'); } }], by[g]);
      }).join('') : '<div class="card mt">' + emptyHtml('rule', 'No automatic penalty rule is active.') + '</div>') +
      '<div class="section-title">Given by hand</div>' + (M.catalog.length ? '<div class="card"><div class="row gap6">' + M.catalog.map(function (c) {
        return c.label + ' · ' + money(c.amount); }).filter(function (t, i, all) { return all.indexOf(t) === i; }).map(function (t) { return chip(t, 'violet'); }).join('') + '</div></div>' : '<div class="card">' + emptyHtml('rule', 'No manual penalty type yet.') + '</div>');
    if ($('[data-edit]', x)) $('[data-edit]', x).onclick = function () { go('hr_attendance', { view: 'rules', back: has('payroll') ? 'payroll' : '' }); };
  }
}
</script>
