<script>
var DIR_LOCS = ['HQ', 'GFP', 'Chanderi', 'Pandri'];
function dirLocList(have) {
  var out = DIR_LOCS.filter(function (l) { return have.indexOf(l) >= 0; });
  have.forEach(function (l) { if (out.indexOf(l) < 0) out.push(l); });
  return out;
}
function dirSel(id, label, list, on, cls) {
  return '<div class="ff' + (cls ? ' ' + cls : '') + '"><label>' + h(label) + '</label><select class="inp sm" id="' + id + '">' + list.map(function (x) {
    return '<option value="' + h(x[0]) + '"' + (String(x[0]) === String(on) ? ' selected' : '') + '>' + h(x[1]) + '</option>';
  }).join('') + '</select></div>';
}
function dirOnSel(root, id, fn) { var e = $('#' + id, root); if (e) e.onchange = function () { fn(this.value); }; }
function dirN(label, n) { return label + ' (' + n + ')'; }
function dirWeekRange() {
  var n = new Date(), mon = new Date(n.getFullYear(), n.getMonth(), n.getDate() - ((n.getDay() + 6) % 7));
  return { mon: isoOf(mon), today: todayISO() };
}
function uniqList(a) { var s0 = {}, o = []; a.forEach(function (x) { if (!s0[x]) { s0[x] = 1; o.push(x); } }); return o; }
function dirPeriodNote(d) {
  return 'Daily tasks of today, weekly tasks of this week (' + fmtISO(d.weekFrom).slice(0, 5) + ' – ' + fmtISO(addDaysISO(d.weekFrom, 6)).slice(0, 5) + ') and monthly tasks of this month.';
}

function dirDashboard(el) {
  var b = S.boot, H = null, nav = S.nav, view = (S.params && S.params.card) || '';
  el.innerHTML = '<div class="page-head"><div class="grow"><p class="greet">' + greeting() + ', ' + h(b.user.first) + '</p><div class="sub">' + dateLong() + '</div></div>' +
    '<button class="btn sm ghost" id="drR">' + icon('sync') + 'Refresh</button></div><div id="drB"></div>';
  var B = $('#drB', el);
  function alive() { return S.nav === nav && document.body.contains(B); }
  function load(force) {
    if (force) return api('dir.home', { force: true }).then(function (d) { H = d; dcSet(dcKey('dir.home', {}), d); if (alive() && !view) paint(); });
    return live('dir.home', {}, function (d) { H = d; if (alive() && !view) paint(); }, { alive: alive }).catch(function (e) { if (!H && !view) B.innerHTML = errHtml(e); });
  }
  $('#drR', el).onclick = function () {
    var bt = this; busy(bt, true);
    S.cache.dirChkData = {}; dcDel('dir.chk', {}); dcDel('dlg.list', {});
    load(true).then(function () { busy(bt, false); if (view) paint(); }).catch(function (e) { busy(bt, false); toast(e.message, 'bad'); });
  };
  function v(f) { if (!H) return null; try { var x = f(H); return x === undefined ? '—' : x; } catch (e) { return '—'; } }
  function card(k, c, ic, label, val, sub) {
    return '<button class="dcard" data-card="' + k + '"><span class="dc-ic ' + c + '">' + icon(ic, 'fill') + '</span><span class="dc-body"><span class="dc-l">' + h(label) + '</span>' +
      '<span class="dc-v">' + (val === null ? '<span class="shimmer"></span>' : val) + '</span><span class="dc-s">' + (sub === null ? '' : sub) + '</span></span>' + icon('chevron_right') + '</button>';
  }
  function paint() {
    if (view === 'chk') return dirChkView(B, back);
    if (view === 'tasks') return dirTasksView(B, back);
    B.innerHTML = (H && H.errors.length ? '<div class="warn mb">' + h(H.errors.join(' · ')) + '</div>' : '') + '<div class="dash-cards dir-cards">' +
      card('chk', 'c1', 'task_alt', 'Pending Checklists', v(function (x) { return x.chk.pending + x.chk.overdue; }),
        v(function (x) { return x.chk.overdue + ' overdue · ' + x.chk.done + ' done · ' + x.chk.lists + ' checklists'; })) +
      card('approvals', 'c2', 'approval', 'Approvals', v(function (x) { return x.appr.all; }), v(function (x) { return x.appr.cards.filter(function (c) { return c.all; }).map(function (c) { return h(c.label) + ' ' + c.all; }).join(' · ') || 'Nothing pending'; })) +
      card('issues', 'c5', 'report_problem', 'Issues Raised', v(function (x) { return x.issues.pending + x.issues.overdue; }),
        v(function (x) { return x.issues.pending + ' pending · ' + x.issues.overdue + ' overdue' + (x.issues.forMe ? ' · ' + x.issues.forMe + ' for you' : ''); })) +
      card('tasks', 'c4', 'forward_to_inbox', 'Delegated Tasks', v(function (x) { return x.tasks.pending; }),
        v(function (x) { return 'pending · ' + (x.tasks.waiting || 0) + ' pending with EA · ' + x.tasks.overdue + ' overdue'; })) + '</div>';
    $$('[data-card]', B).forEach(function (c) { c.onclick = function () { open(c.dataset.card); }; });
  }
  function open(k) {
    if (k === 'approvals') return go('approvals', {});
    if (k === 'issues') return go('tickets', {});
    view = k; S.params.card = k; paint();
  }
  function back() { view = ''; delete S.params.card; paint(); }
  paint();
  load(false);
}

function dirChkView(B, back) {
  var st = S.cache.dirChk = S.cache.dirChk || { tab: 'team', loc: '', id: '', seg: 'pending', doer: '', q: '' };
  var p = hubPanel(B, 'Pending Checklists', 'checklist', back);
  p.innerHTML = tabsHtml([['team', 'Team View'], ['scores', 'Scores']], st.tab) + '<div id="dcB"></div>';
  bindTabs(p, function (t) { st.tab = t; st.id = ''; body(); });
  var box = $('#dcB', p);
  function body() { if (st.tab === 'scores') return dirChkScores(box, st); if (st.id) return dirChkDetail(box, st, body); dirChkCards(box, st, body); }
  body();
}

function dirLocSel(locs, st) {
  if (st.loc && locs.indexOf(st.loc) < 0) st.loc = '';
  return dirSel('dcLoc', 'Location', [['', 'All locations']].concat(dirLocList(locs).map(function (l) { return [l, l]; })), st.loc);
}

function dirChkCards(box, st, body) {
  box.innerHTML = loadingHtml('Reading every checklist…');
  live('dir.chk', {}, function (d) {
    if (st.tab !== 'team' || st.id) return;
    box.innerHTML = '<div class="fbar">' + dirLocSel(d.locs, st) + '<div class="ff grow small muted" style="justify-content:flex-end">' + h(dirPeriodNote(d)) + '</div></div><div id="dcL"></div>';
    dirOnSel(box, 'dcLoc', function (v0) { st.loc = v0; draw(); });
    function draw() {
      var L = d.list.filter(function (x) { return !st.loc || x.loc === st.loc; }).sort(function (a, c) { return (c.pending + c.overdue) - (a.pending + a.overdue) || a.name.localeCompare(c.name); });
      $('#dcL', box).innerHTML = L.length ? '<div class="grid g3 dchk">' + L.map(function (c) {
        return '<div class="card dchk-c" data-id="' + h(c.id) + '"><div class="row"><div class="grow"><h3 style="margin:0">' + h(c.name) + '</h3>' +
          '<div class="small muted">' + h(c.loc + (c.dept ? ' · ' + c.dept : '')) + '</div></div>' + icon('chevron_right') + '</div>' +
          (c.error ? '<div class="small mt" style="color:var(--red)">' + h(c.error) + '</div>' :
            '<div class="row mt small" style="flex-wrap:wrap;gap:6px">' + chip('Pending ' + c.pending, c.pending ? 'orange' : 'grey') + (c.overdue ? chip('Overdue ' + c.overdue, 'red') : '') + chip('Done ' + c.done, 'green') + '</div>') + '</div>';
      }).join('') + '</div>' : '<div class="card">' + emptyHtml('checklist', 'No checklist here.') + '</div>';
      $$('[data-id]', box).forEach(function (c) { c.onclick = function () { st.id = c.dataset.id; st.seg = 'pending'; st.doer = ''; st.q = ''; body(); }; });
    }
    draw();
  }, { alive: function () { return document.body.contains(box) && st.tab === 'team' && !st.id; } }).catch(function (e) { box.innerHTML = errHtml(e); });
}

function dirChkDetail(box, st, body) {
  var cache = S.cache.dirChkData = S.cache.dirChkData || {}, id = st.id;
  box.innerHTML = loadingHtml('Reading the tasks…');
  function get(force) {
    if (cache[id] && !force) return Promise.resolve(cache[id]);
    return Promise.all([api('chk.tasks', { id: id, scope: true }), api('dir.chkUsers', { id: id }).catch(function () { return { people: [], dept: '' }; })])
      .then(function (r) { cache[id] = { day: r[0], users: r[1] }; return cache[id]; });
  }
  get(false).then(draw).catch(function (e) { box.innerHTML = '<button class="btn sm ghost mb" id="dcBk">' + icon('arrow_back') + 'All checklists</button>' + errHtml(e); $('#dcBk', box).onclick = function () { st.id = ''; body(); }; });
  function draw(D) {
    if (st.id !== id || !document.body.contains(box)) return;
    var T = D.day.tasks, today = D.day.today;
    var sets = { pending: T.filter(function (t) { return t.state === 'pending'; }), overdue: T.filter(function (t) { return t.state === 'overdue'; }), done: T.filter(function (t) { return t.state === 'done'; }), all: T };
    var doers = uniqList(T.map(function (t) { return t.name; }).filter(Boolean)).sort();
    box.innerHTML = '<div class="crumb"><button class="btn sm ghost" id="dcBk">' + icon('arrow_back') + 'All checklists</button><b class="grow">' + h(D.day.name) + '</b>' +
      '<span class="small muted">' + h(D.day.loc + (D.day.dept ? ' · ' + D.day.dept : '')) + '</span></div>' +
      '<div class="fbar">' + dirSel('dcS', 'Filter By', [['pending', dirN('Pending', sets.pending.length)], ['overdue', dirN('Overdue', sets.overdue.length)], ['done', dirN('Done', sets.done.length)], ['all', dirN('All', T.length)]], st.seg) +
      (doers.length > 1 ? dirSel('dcD', 'Doer', [['', 'Every doer']].concat(doers.map(function (n) { return [n, n]; })), st.doer) : '') +
      '<div class="ff grow"><label>Search</label><input class="inp sm" id="dcQ" placeholder="Task, ID…" value="' + h(st.q) + '"></div></div>' +
      '<div class="small muted mb">' + h(dirPeriodNote(D.day)) + ' Tick tasks to give them to someone of the ' + h(D.users.dept || 'same') + ' department.</div>' +
      '<div id="dcR"></div><div id="dcBulk"></div>';
    $('#dcBk', box).onclick = function () { st.id = ''; body(); };
    dirOnSel(box, 'dcS', function (v0) { st.seg = v0; rows(); });
    dirOnSel(box, 'dcD', function (v0) { st.doer = v0; rows(); });
    $('#dcQ', box).oninput = debounce(function () { st.q = val('#dcQ', box).toLowerCase(); rows(); }, 200);
    function rows() {
      var R = sets[st.seg].filter(function (t) { return (!st.doer || t.name === st.doer) && (!st.q || (t.task + ' ' + t.id + ' ' + t.name).toLowerCase().indexOf(st.q) >= 0); })
        .slice().sort(function (a, c) { return (a.done - c.done) || (a.planned - c.planned); });
      var bx = $('#dcR', box);
      if (!R.length) { bx.innerHTML = '<div class="card">' + emptyHtml('task_alt', { pending: 'Nothing pending.', overdue: 'Nothing overdue.', done: 'Nothing done yet.', all: 'No task in this period.' }[st.seg]) + '</div>'; bx.R = []; bulk(); return; }
      bx.innerHTML = '<div class="recs">' + R.map(function (t, i) {
        var dday = isoOf(new Date(t.planned)), late = t.state === 'overdue';
        var tag = t.done ? (t.late ? chip('Done late', 'orange') : chip('Done', 'green')) : t.assignedTo ? chip('Given to ' + t.assignedTo.split(' ')[0], 'violet') : late ? chip('Overdue', 'red') : chip('Pending', 'grey');
        return '<div class="ck-r' + (t.done ? ' done' : '') + '" data-i="' + i + '">' + (t.done ? '' : '<input type="checkbox" class="selbox" data-ck="' + i + '">') +
          '<span class="ck-dot ' + (t.done ? 'd-ok' : late ? 'd-bad' : 'd-up') + '"></span><div class="ck-t"><b>' + h(t.task) + '</b>' +
          '<span>' + h([freqName(t.freq), dday === today ? t.time : fmtISO(dday).slice(0, 5) + ' ' + t.time, t.name, t.id].join(' · ')) + '</span></div>' + tag + '</div>';
      }).join('') + '</div>';
      $$('.ck-r', bx).forEach(function (r) {
        var t = R[+r.dataset.i];
        r.onclick = function (e) {
          if (e.target.classList.contains('selbox')) return bulk();
          if (t.done) return modal({ title: 'Task details', body: kvHtml([['Task', t.task], ['Doer', t.name], ['Frequency', freqName(t.freq)], ['Planned', t.plannedText], ['Done', t.actualText], ['Remark', t.remark || '—'],
            t.att ? ['Photo', '<a href="' + h(t.att) + '" target="_blank">Open</a>', true] : null]) });
          var c = $('.selbox', r); if (c) { c.checked = !c.checked; bulk(); }
        };
      });
      bx.R = R;
      bulk();
    }
    function bulk() {
      var bx = $('#dcR', box), bar = $('#dcBulk', box), R = bx.R || [];
      var sel = $$('[data-ck]', bx).filter(function (c) { return c.checked; }).map(function (c) { return R[+c.dataset.ck]; });
      if (!sel.length) { bar.innerHTML = ''; return; }
      var P = D.users.people || [];
      bar.innerHTML = '<div class="bulk"><b>' + sel.length + ' selected</b>' +
        (P.length ? '<select class="inp sm" id="dcTo" style="width:auto;min-width:170px"><option value="">Give to…</option>' + P.map(function (u) {
          return '<option value="' + h(u.uid) + '">' + h(u.name + (u.designation ? ' · ' + u.designation : '') + (u.outlet ? ' · ' + u.outlet : '')) + '</option>'; }).join('') + '</select>' +
          '<input class="inp sm" id="dcN" placeholder="Note (optional)" style="width:auto;flex:1 1 160px;min-width:120px"><button class="btn sm amber" id="dcGo">' + icon('person_add') + 'Give</button>'
          : '<span class="small">Nobody else is in the ' + h(D.users.dept || 'same') + ' department.</span>') + '</div>';
      if (!$('#dcGo', bar)) return;
      $('#dcGo', bar).onclick = function () {
        var to = val('#dcTo', bar);
        if (!to) return toast('Pick the person.', 'bad');
        var bt = this; busy(bt, true, 'Giving…');
        api('chk.assign', { id: id, to: to, date: today, note: val('#dcN', bar), items: sel.map(function (t) { return { row: t.row, taskId: t.id }; }) })
          .then(function (r) { toast(r.message, 'ok'); dcDel('dir.chk', {}); return get(true).then(draw); })
          .catch(function (e) { busy(bt, false); toast(e.message, 'bad'); });
      };
    }
    rows();
  }
}

function dirChkScores(box, st) {
  box.innerHTML = loadingHtml('Working out the scores…');
  var sel = { id: '', week: '', doer: '' };
  live('chk.scores', { weeks: 8 }, function (D) {
    if (st.tab !== 'scores') return;
    var locs = uniqList(D.lists.map(function (l) { return l.loc || 'Other'; }));
    function sum(rows) {
      var p0 = 0, dn = 0, ot = 0; rows.forEach(function (x) { p0 += x.plan; dn += x.done; ot += x.onTime; });
      return p0 ? { plan: p0, done: dn, onTime: ot, nd: dn / p0 * 100 - 100, ot: ot / p0 * 100 - 100 } : null;
    }
    function wk(w) { return w ? fmtISO(w.from).slice(0, 5) + ' – ' + fmtISO(w.to).slice(0, 5) : ''; }
    function metric(x) {
      return '<div class="ck-sm"><div class="ck-m ' + chkScoreTone(x.nd) + '"><b>' + chkPct(x.nd) + '</b><span>% work not done</span></div>' +
        '<div class="ck-m ' + chkScoreTone(x.ot) + '"><b>' + chkPct(x.ot) + '</b><span>% work not done on time</span></div></div>';
    }
    function cards() {
      var last = D.weeks[0];
      box.innerHTML = (D.errors.length ? '<div class="warn mb">' + h(D.errors.join(' · ')) + '</div>' : '') + '<div class="fbar">' + dirLocSel(locs, st) +
        '<div class="ff grow small muted" style="justify-content:flex-end">Last week ' + h(wk(last)) + '</div></div><div id="scC"></div>';
      dirOnSel(box, 'dcLoc', function (v0) { st.loc = v0; cards(); });
      var L = D.lists.filter(function (l) { return !st.loc || (l.loc || 'Other') === st.loc; });
      if (!L.length) { $('#scC', box).innerHTML = '<div class="card">' + emptyHtml('insights', 'No checklist here.') + '</div>'; return; }
      hubCards($('#scC', box), L.map(function (l) {
        var x = sum(l.rows.filter(function (r) { return r.week === last.i; }));
        return { key: l.id, icon: 'checklist', label: l.name, value: x ? chkPct(x.nd) : '—', sub: x ? h((l.loc || '') + ' · on time ' + chkPct(x.ot) + ' · ' + l.doers.length + ' doers') : h(l.loc || '') + ' · nothing planned last week' };
      }), function (k) { sel.id = k; sel.week = String(last.i); sel.doer = ''; detail(); });
    }
    function detail() {
      var l = D.lists.filter(function (x) { return x.id === sel.id; })[0];
      box.innerHTML = '<div class="crumb"><button class="btn sm ghost" id="scBk">' + icon('arrow_back') + 'All checklists</button><b class="grow">' + h(l.name) + ' · Scores</b><span class="small muted">' + h(l.loc || '') + '</span></div>' +
        '<div class="fbar">' + dirSel('scW', 'Week', [['', 'Last 8 weeks']].concat(D.weeks.map(function (w) { return [String(w.i), wk(w)]; })), sel.week) +
        dirSel('scD', 'Doer', [['', 'Every doer']].concat(l.doers.map(function (n) { return [n, n]; })), sel.doer, 'grow') + '</div>' +
        '<div id="scT"></div><div class="section-title">Doer-wise</div><div id="scL"></div>';
      $('#scBk', box).onclick = cards;
      dirOnSel(box, 'scW', function (v0) { sel.week = v0; rows(); });
      dirOnSel(box, 'scD', function (v0) { sel.doer = v0; rows(); });
      function rows() {
        var R = l.rows.filter(function (x) { return (sel.week === '' || String(x.week) === sel.week) && (!sel.doer || x.doer === sel.doer); });
        var tot = sum(R), by = {};
        R.forEach(function (x) { var k = sel.doer ? x.week : x.doer; (by[k] = by[k] || []).push(x); });
        $('#scT', box).innerHTML = tot ? '<div class="ck-score"><div class="ck-sh">' + icon('insights') + '<b>' + h(sel.doer || 'Everyone') + '</b><span>' + (sel.week === '' ? 'last 8 weeks' : wk(D.weeks.filter(function (w) { return String(w.i) === sel.week; })[0])) + '</span></div>' +
          metric(tot) + '<div class="ck-sx">' + tot.done + ' of ' + tot.plan + ' done · ' + tot.onTime + ' on time</div></div>' : '';
        var list = Object.keys(by).map(function (k) { var x = sum(by[k]); x.key = k; return x; }).sort(function (a, c) { return sel.doer ? Number(c.key) - Number(a.key) : (a.nd - c.nd) || String(a.key).localeCompare(String(c.key)); });
        recList($('#scL', box), list, {
          title: function (x) { return h(sel.doer ? wk(D.weeks.filter(function (w) { return String(w.i) === String(x.key); })[0]) : x.key); },
          sub: function (x) { return x.done + ' of ' + x.plan + ' done · ' + x.onTime + ' on time'; },
          right: function (x) { return '<span class="chip ' + (x.nd >= -5 ? 'green' : x.nd >= -20 ? 'orange' : 'red') + '">' + chkPct(x.nd) + '</span> <span class="chip ' + (x.ot >= -5 ? 'green' : x.ot >= -20 ? 'orange' : 'red') + '">' + chkPct(x.ot) + '</span>'; },
          empty: 'No task was planned for this choice.', emptyIcon: 'insights'
        });
      }
      rows();
    }
    if (sel.id) detail(); else cards();
  }, { alive: function () { return document.body.contains(box) && st.tab === 'scores'; } }).catch(function (e) { box.innerHTML = errHtml(e); });
}

function dirTasksView(B, back) {
  var st = S.cache.dirTk = S.cache.dirTk || { sub: '', show: 'pending', doer: '', q: '' };
  var p = hubPanel(B, st.sub === 'add' ? 'Delegate Task' : st.sub === 'list' ? 'Delegated tasks' : 'Delegated Tasks', st.sub === 'add' ? 'add_task' : 'forward_to_inbox',
    function () { if (st.sub) { st.sub = ''; return dirTasksView(B, back); } back(); });
  p.innerHTML = loadingHtml('Loading delegated tasks…');
  live('dlg.list', {}, function (D) {
    if (!document.body.contains(p)) return;
    if (!st.sub) {
      p.innerHTML = '<div id="dtC"></div>';
      hubCards($('#dtC', p), [
        { key: 'list', icon: 'pending_actions', label: 'Pending delegated tasks', value: D.counts.pending, sub: D.counts.overdue + ' overdue · ' + D.counts.dueToday + ' due today · ' + (D.counts.waiting || 0) + ' pending with EA · ' + D.counts.done + ' done' },
        { key: 'add', icon: 'add_task', label: 'Delegate Task', value: icon('chevron_right'), sub: 'Give a task to one or more doers' }
      ], function (k) { st.sub = k; dirTasksView(B, back); });
      return;
    }
    if (st.sub === 'add') return dlgForm(p, D, function () { st.sub = 'list'; st.show = 'pending'; dcDel('dlg.list', {}); dcDel('dir.home', {}); dirTasksView(B, back); });
    var doers = uniqList(D.tasks.map(function (t) { return t.doer; })).sort();
    function counts() {
      var L = D.tasks.filter(function (t) { return !st.doer || t.doer === st.doer; });
      return { all: L.length, pending: L.filter(function (t) { return t.status === 'Pending'; }).length, waiting: L.filter(function (t) { return t.status === 'Pending with EA'; }).length, done: L.filter(function (t) { return t.status === 'Done'; }).length };
    }
    function bar() {
      var c = counts();
      return dirSel('dtS', 'Filter By', [['pending', dirN('Pending', c.pending)], ['waiting', dirN('Pending with EA', c.waiting)], ['done', dirN('Done', c.done)], ['all', dirN('All', c.all)]], st.show) +
        dirSel('dtD', 'Doer', [['', 'Every doer']].concat(doers.map(function (n) { return [n, n]; })), st.doer) +
        '<div class="ff grow"><label>Search</label><input class="inp sm" id="dtQ" placeholder="Task, ID…" value="' + h(st.q) + '"></div>';
    }
    p.innerHTML = '<div class="fbar" id="dtF">' + bar() + '</div><div id="dtL"></div>';
    function bind() {
      dirOnSel(p, 'dtS', function (v0) { st.show = v0; rows(); });
      dirOnSel(p, 'dtD', function (v0) { st.doer = v0; var q = st.q; $('#dtF', p).innerHTML = bar(); bind(); $('#dtQ', p).value = q; rows(); });
      $('#dtQ', p).oninput = debounce(function () { st.q = val('#dtQ', p).toLowerCase(); rows(); }, 200);
    }
    bind();
    function rows() {
      var R = D.tasks.filter(function (t) {
        if (st.show === 'pending' && t.status !== 'Pending') return false;
        if (st.show === 'done' && t.status !== 'Done') return false;
        if (st.show === 'waiting' && t.status !== 'Pending with EA') return false;
        if (st.doer && t.doer !== st.doer) return false;

      '<div class="ff grow small muted" style="justify-content:flex-end">' + h(D.store) + '</div></div><div id="cmC"></div><div id="cmL" class="mt"></div>';
    hubCards($('#cmC', B), [
      { key: 'o', icon: 'login', label: 'Opening issued', value: money(T.opening), sub: st.mode === 'day' ? h(D.dateText) : h(fmtISO(D.from) + ' – ' + fmtISO(D.to)), static: true },
      { key: 'c', icon: 'logout', label: 'Closing received', value: money(T.closing), sub: 'net cash ' + money(T.net), static: true },
      { key: 'd', icon: 'balance', label: 'Short / Excess', value: money(T.short), sub: 'short · ' + money(T.excess) + ' excess', static: true },
      { key: 'p', icon: 'pending_actions', label: 'Waiting to be accepted', value: T.pending, sub: (T.returned ? T.returned + ' returned · ' : '') + (D.waiting ? D.waiting + ' from earlier days' : T.entries + ' entries'), static: true }
    ]);
    dirOnSel(B, 'cmM', function (v0) { st.mode = v0; load(); });
    if ($('#cmD', B)) $('#cmD', B).onchange = function () { st.date = this.value; load(); };
    if ($('#cmF', B)) $('#cmF', B).onchange = function () { st.from = this.value; load(); };
    if ($('#cmT', B)) $('#cmT', B).onchange = function () { st.to = this.value; load(); };
    var box = $('#cmL', B);
    if (D.mode === 'day') {
      box.innerHTML = '<div class="grid g2 cash-g">' + D.slots.map(function (s) {
        function row(label, e) {
          if (!e) return '<div class="cash-r none"><span class="grow"><b>' + label + '</b><span class="tiny muted">Not prepared yet</span></span></div>';
          return '<div class="cash-r" data-e="' + h(e.id) + '"><span class="grow"><b>' + label + '</b><span class="tiny muted">' + h([e.by ? 'by ' + e.by : '', e.acceptedBy ? (e.type === 'OPENING' ? 'accepted by ' : 'received by ') + e.acceptedBy : ''].filter(Boolean).join(' · ')) + '</span></span>' +
            '<b class="nowrap">' + money(e.amount) + '</b>' + (e.difference ? chip((e.difference < 0 ? 'Short ' : 'Excess ') + money(Math.abs(e.difference)), e.difference < 0 ? 'red' : 'blue') : '') + statusChip2(e.status) + '</div>';
        }
        return '<div class="card cash-slot"><div class="row mb"><b class="grow">' + h(s.counter) + '</b><span class="small muted">' + h(s.shiftLabel) + '</span></div>' +
          row('Opening', s.opening) + row('Closing', s.closing) +
          '<div class="row small mt"><span class="grow muted">Net cash (closing − opening)</span><b>' + (s.net === null ? '—' : money(s.net)) + '</b></div></div>';
      }).join('') + '</div>';
      $$('[data-e]', box).forEach(function (r) { r.onclick = function () { entry(r.dataset.e); }; });
      return;
    }
    box.innerHTML = (D.days.length ? '<div class="tbl-wrap"><table class="tbl"><tr><th>Day</th><th class="num">Opening</th><th class="num">Closing</th><th class="num">Net cash</th><th class="num">Short</th><th class="num">Excess</th><th class="num">Waiting</th></tr>' +
      D.days.map(function (x) {
        return '<tr><td class="nowrap">' + h(x.dateText) + '</td><td class="num">' + money(x.opening) + '</td><td class="num">' + money(x.closing) + '</td><td class="num b">' + money(x.net) + '</td>' +
          '<td class="num">' + (x.short ? '<b style="color:var(--red)">' + money(x.short) + '</b>' : '—') + '</td><td class="num">' + (x.excess ? money(x.excess) : '—') + '</td><td class="num">' + (x.pending || '—') + '</td></tr>';
      }).join('') + '<tfoot><tr><td>Total</td><td class="num">' + money(T.opening) + '</td><td class="num">' + money(T.closing) + '</td><td class="num">' + money(T.net) + '</td><td class="num">' + money(T.short) + '</td><td class="num">' + money(T.excess) + '</td><td class="num">' + T.pending + '</td></tr></tfoot></table></div>'
      : '') + '<div class="section-title">Entries (' + D.entries.length + ')</div><div id="cmE"></div>';
    recList($('#cmE', box), D.entries, {
      title: function (e) { return h((e.type === 'OPENING' ? 'Opening' : 'Closing') + ' · ' + e.counter + ' · Shift ' + e.shift); },
      sub: function (e) { return h([fmtISO(e.date), e.id, e.by ? 'by ' + e.by : '', e.acceptedBy ? 'accepted by ' + e.acceptedBy : ''].filter(Boolean).join(' · ')); },
      right: function (e) { return '<b class="nowrap">' + money(e.amount) + '</b> ' + statusChip2(e.status); },
      body: function (e0, e) { lines(e0, e.id); },
      empty: 'No cash entry in this period.', emptyIcon: 'payments'
    });
  }
  function linesHtml(r) {
    var e = r.entry;
    return kvHtml([['Entry', e.id + ' · ' + (e.type === 'OPENING' ? 'Opening' : 'Closing')], ['Day · shift · counter', fmtISO(e.date) + ' · Shift ' + e.shift + ' · ' + e.counter],
      ['Prepared', money(e.declared) + (e.by ? ' · ' + e.by : '') + (e.at ? ' · ' + e.at : '')], ['Accepted', e.received === null ? 'Not yet' : money(e.received) + (e.acceptedBy ? ' · ' + e.acceptedBy : '') + (e.acceptedAt ? ' · ' + e.acceptedAt : '')],
      ['Difference', e.difference === null ? '—' : (e.difference < 0 ? 'Short ' : e.difference > 0 ? 'Excess ' : '') + money(Math.abs(e.difference))], ['Status', e.status],
      e.remarks ? ['Remarks', e.remarks] : null, e.officeRemarks ? ['Office remarks', e.officeRemarks] : null]) +
      (r.lines.length ? '<div class="tbl-wrap mt"><table class="tbl"><tr><th>Denomination</th><th class="num">Prepared</th><th class="num">Amount</th><th class="num">Accepted</th><th class="num">Amount</th></tr>' + r.lines.map(function (l) {
        var diff = l.accepted !== null && l.declared !== null && l.accepted !== l.declared;
        return '<tr><td>' + h(l.label) + '</td><td class="num">' + (l.declared === null ? '—' : num(l.declared)) + '</td><td class="num">' + (l.declaredAmount === null ? '—' : money(l.declaredAmount)) + '</td>' +
          '<td class="num"' + (diff ? ' style="color:var(--red);font-weight:700"' : '') + '>' + (l.accepted === null ? '—' : num(l.accepted)) + '</td><td class="num">' + (l.acceptedAmount === null ? '—' : money(l.acceptedAmount)) + '</td></tr>';
      }).join('') + '</table></div>' : '<div class="small muted mt">No denomination count saved.</div>');
  }
  function lines(box, id) {
    box.innerHTML = loadingHtml();
    api('dir.cashLines', { id: id }).then(function (r) { box.innerHTML = linesHtml(r); }).catch(function (e) { box.innerHTML = errHtml(e); });
  }
  function entry(id) {
    var m = modal({ title: 'Cash entry ' + id, wide: true, body: '<div id="cmX">' + loadingHtml() + '</div>' });
    lines($('#cmX', m.el), id);
  }
  load();
};

V.dir_orders = function (el, p) {
  var st = { day: p.day || 'today', outlet: '', state: '' };
  el.innerHTML = pageHead('Orders Summary', '') + '<div id="doB">' + loadingHtml() + '</div>';
  var B = $('#doB', el), D = null;
  function load() { B.innerHTML = loadingHtml('Reading the orders…'); live('dir.orders', { day: st.day }, function (d) { D = d; draw(); }, { box: B }).catch(function (e) { B.innerHTML = errHtml(e); }); }
  function draw() {
    var T = D.totals;
    B.innerHTML = '<div class="fbar">' + dirSel('doD', 'Day', [['today', 'Today'], ['yesterday', 'Yesterday']], st.day) +
      (D.outlets.length > 1 ? dirSel('doO', 'Outlet', [['', 'All outlets']].concat(D.outlets.map(function (o) { return [o.name, o.name + ' (' + o.count + ')']; })), st.outlet) : '') +
      dirSel('doS', 'Filter By', [['', dirN('All', T.orders)], ['To dispatch', dirN('To dispatch', T.pending)], ['Part dispatched', dirN('Part dispatched', T.part)], ['Dispatched', dirN('Dispatched', T.dispatched)]], st.state) + '</div>' +
      (D.ndError ? '<div class="warn mb">' + icon('error') + ' Item Not Dispatch: ' + h(D.ndError) + '</div>' : '') + '<div id="doK"></div><div class="section-title">' + h(D.dateText) + '</div><div id="doL"></div>';
    hubCards($('#doK', B), [
      { key: 'a', icon: 'receipt_long', label: 'Orders', value: T.orders, sub: D.outlets.map(function (o) { return h(o.name) + ' ' + o.count; }).join(' · ') || 'No order', static: true },
      { key: 'b', icon: 'local_shipping', label: 'Dispatched', value: T.dispatched, sub: T.part + ' part · ' + T.pending + ' to dispatch', static: true },
      { key: 'c', icon: 'remove_shopping_cart', label: 'Items not dispatched', value: T.ndLines, sub: D.reasons.slice(0, 3).map(function (r) { return h(r.name) + ' ' + r.count; }).join(' · ') || 'Nothing recorded', static: true }
    ]);
    dirOnSel(B, 'doD', function (v0) { st.day = v0; st.outlet = ''; load(); });
    dirOnSel(B, 'doO', function (v0) { st.outlet = v0; list(); });
    dirOnSel(B, 'doS', function (v0) { st.state = v0; list(); });
    list();
  }
  function list() {
    var L = D.orders.filter(function (o) { return (!st.outlet || o.outlet === st.outlet) && (!st.state || o.state === st.state); }), box = $('#doL', B);
    box.innerHTML = L.length ? '<div class="grid g3 dord">' + L.map(function (o, i) {
      var k = o.state === 'Dispatched' ? 'green' : o.state === 'Part dispatched' ? 'orange' : 'blue';
      return '<div class="card dord-c" data-o="' + i + '"><div class="row"><div class="grow"><h3 style="margin:0">' + h(o.no) + '</h3><div class="small muted">' + h(o.outlet + ' · ' + o.time.slice(-8) + (o.by ? ' · ' + o.by : '')) + '</div></div>' + statusChip(o.status) + '</div>' +
        '<div class="row mt small" style="flex-wrap:wrap;gap:6px">' + chip(o.state, k) + chip(o.items + ' items', 'grey') + chip('Ordered ' + num(o.qty), 'grey') + chip('Sent ' + num(o.dispatched), o.dispatched ? 'green' : 'grey') +
        (o.ndLines ? chip(o.ndLines + ' not dispatched', 'red') : '') + '</div></div>';
    }).join('') + '</div>' : '<div class="card">' + emptyHtml('receipt_long', 'No GFP order here on ' + D.dateText + '.') + '</div>';
    $$('[data-o]', box).forEach(function (c) { c.onclick = function () { lines(L[+c.dataset.o]); }; });
  }
  function lines(o) {
    modal({ title: o.no + ' · ' + o.outlet, wide: true, body: '<div class="kv mb"><b>Ordered</b><span>' + h(o.time) + (o.by ? ' · ' + h(o.by) : '') + '</span><b>Status</b><span>' + statusChip(o.status) + ' ' + chip(o.state, 'blue') + '</span></div>' +
      '<div class="tbl-wrap"><table class="tbl"><tr><th>Item</th><th class="num">Ordered</th><th class="num">Dispatched</th><th class="num">Not sent</th><th>Reason</th></tr>' +
      o.lines.map(function (l) {
        var dq = l.disp === null || l.disp === undefined ? '' : l.disp, short = dq !== '' && Number(dq) < Number(l.qty);
        return '<tr><td>' + h(l.name) + '<div class="small muted">' + h(l.code || '') + '</div></td><td class="num nowrap">' + num(l.qty) + ' ' + h(l.unit) + '</td>' +
          '<td class="num">' + (dq === '' ? '<span class="muted">—</span>' : '<b style="color:' + (short ? 'var(--orange)' : 'var(--green)') + '">' + num(dq) + '</b>') + '</td>' +
          '<td class="num">' + (l.nd ? '<b style="color:var(--red)">' + num(l.nd) + '</b>' : '—') + '</td><td class="small">' + h([l.reason, l.remark].filter(Boolean).join(' · ')) + '</td></tr>';
      }).join('') + '</table></div>' });
  }
  load();
};

V.dir_fms = function (el) {
  var nav = S.nav, view = '', sub = '';
  el.innerHTML = pageHead('FMS Summary', '', '<button class="btn sm ghost" id="dfR">' + icon('sync') + 'Refresh</button>') + '<div id="dfB">' + loadingHtml('Reading the FMS sheets…') + '</div>';
  var B = $('#dfB', el), D = null;
  function load(force) {
    var take = function (d) { D = d; if (S.nav === nav) paint(); };
    if (force) return api('dir.fms', { force: true }).then(function (d) { dcSet(dcKey('dir.fms', {}), d); take(d); });
    return live('dir.fms', {}, take, { alive: function () { return S.nav === nav; } }).catch(function (e) { B.innerHTML = errHtml(e); });
  }
  $('#dfR', el).onclick = function () { var bt = this; busy(bt, true); load(true).then(function () { busy(bt, false); }).catch(function (e) { busy(bt, false); toast(e.message, 'bad'); }); };
  function paint() {
    if (view) return detail();
    var I = D.indent, O = D.onboarding, X = D.dispatch;
    B.innerHTML = '<div id="dfC"></div>';
    hubCards($('#dfC', B), [
      { key: 'indent', icon: 'assignment_add', label: 'Indent to Offer Letter', value: I.error ? '—' : I.dueWeek, sub: I.error ? h(I.error) : 'pending this week · ' + I.overdue + ' overdue · ' + I.offersMonth + ' offer letters sent this month' },
      { key: 'onboard', icon: 'hourglass_top', label: 'Onboarding to Probation', value: O.error ? '—' : O.probation, sub: O.error ? h(O.error) : 'under probation · ' + O.joined.length + ' joined this month' },
      { key: 'dispatch', icon: 'local_shipping', label: 'Outlet Order to Dispatch', value: X.error ? '—' : X.week.overdue,
        sub: X.error ? h(X.error) : 'overdue steps this week · today ' + X.today.pending + ' pending · ' + X.today.overdue + ' overdue' }
    ], function (k) { view = k; sub = ''; paint(); });
  }
  function steps(list, title) {
    return '<div class="card mb"><h3>' + icon('account_tree') + ' ' + h(title) + '</h3>' + (list || []).map(function (s) {
      return '<div class="row small" style="margin:6px 0;gap:8px"><span class="grow">' + s.n + '. ' + h(s.name) + '</span>' + (s.overdue ? chip(s.overdue + ' overdue', 'red') : '') + (s.pending ? chip(s.pending + ' pending', 'orange') : '') + chip(s.done + ' done', 'green') + '</div>';
    }).join('') + '</div>';
  }
  function detail() {
    var T = { indent: ['Indent to Offer Letter', 'assignment_add'], onboard: ['Onboarding to Probation', 'hourglass_top'], dispatch: ['Outlet Order to Dispatch', 'local_shipping'] }[view];
    var bx = hubPanel(B, T[0], T[1], function () { view = ''; paint(); });
    if (view === 'indent') {
      var I = D.indent, now = Date.now(), wEnd = new Date(dirWeekRange().mon.replace(/-/g, '/')).getTime() + 7 * 86400000 - 1;
      if (I.error) { bx.innerHTML = errHtml(I.error); return; }
      sub = sub || 'week';
      bx.innerHTML = '<div class="fbar">' + dirSel('fiS', 'Filter By', [['week', dirN('Pending this week', I.dueWeek)], ['late', dirN('Overdue', I.overdue)], ['offers', dirN('Offer letter sent this month', I.offersMonth)]], sub) + '</div><div id="fiL"></div>';
      dirOnSel(bx, 'fiS', function (v0) { sub = v0; list(); });
      function list() {
        var box = $('#fiL', bx);
        if (sub === 'offers') return recList(box, I.offers, { title: function (x) { return h(x.pos); }, sub: function (x) { return h(x.place + ' · offer letter sent ' + x.when); }, right: function () { return chip('Sent', 'green'); }, empty: 'No offer letter sent this month.', emptyIcon: 'description' });
        var L = I.list.filter(function (x) { return sub === 'late' ? !!x.late : x.due && x.due >= now && x.due <= wEnd; });
        recList(box, L, { title: function (x) { return h(x.pos + ' · ' + x.place); }, sub: function (x) { return h(['Step ' + x.stepNo + '/' + x.of + ' · ' + x.step, x.dueText ? 'due ' + x.dueText : '', x.raised ? 'raised ' + x.raised : '', x.by ? 'by ' + x.by : ''].filter(Boolean).join(' · ')); },
          right: function (x) { return x.late ? chip(x.late + ' late', 'red') : chip('Due ' + x.dueText.split(',')[0], 'orange'); }, empty: sub === 'late' ? 'Nothing overdue.' : 'Nothing due for the rest of this week.', emptyIcon: 'task_alt' });
      }
      list();
    } else if (view === 'onboard') {
      var O = D.onboarding;
      if (O.error) { bx.innerHTML = errHtml(O.error); return; }
      sub = sub || 'prob';
      bx.innerHTML = '<div class="fbar">' + dirSel('foS', 'Filter By', [['prob', dirN('Under probation', O.probation)], ['joined', dirN('Joined this month', O.joined.length)], ['late', dirN('Late steps', O.late.length)]], sub) + '</div><div id="foL"></div>';
      dirOnSel(bx, 'foS', function (v0) { sub = v0; list2(); });
      function list2() {
        var box = $('#foL', bx);
        if (sub === 'prob') recList(box, O.probationList, { title: function (x) { return h(x.name); }, sub: function (x) { return h([x.pos, x.place, x.when ? 'joined ' + x.when : ''].filter(Boolean).join(' · ')); }, right: function (x) { return chip(x.status || 'Probation', 'orange'); }, empty: 'Nobody on probation.' });
        else if (sub === 'joined') recList(box, O.joined, { title: function (x) { return h(x.name); }, sub: function (x) { return h([x.pos, x.place, x.when, x.step].filter(Boolean).join(' · ')); }, right: function (x) { return x.came ? chip(x.came, /yes/i.test(x.came) ? 'green' : 'grey') : ''; }, empty: 'Nobody joined this month yet.' });
        else recList(box, O.late, { title: function (x) { return h(x.label); }, sub: function (x) { return h(x.step + ' · planned ' + x.planned); }, right: function (x) { return chip(x.late + ' late', 'red'); }, empty: 'Nothing late.', emptyIcon: 'task_alt' });
      }
      list2();
    } else {
      var X = D.dispatch;
      if (X.error) { bx.innerHTML = errHtml(X.error); return; }
      var W = X.week, today = X.list.filter(function (x) { return x.today; });
      var sets = { tp: today.filter(function (x) { return x.state === 'pending'; }), to: today.filter(function (x) { return x.state === 'overdue'; }),
        wo: X.list.filter(function (x) { return x.state === 'overdue'; }), wp: X.list.filter(function (x) { return x.state === 'pending'; }) };
      sub = sub || (sets.to.length || !sets.tp.length ? 'to' : 'tp');
      bx.innerHTML = '<div class="fbar">' + dirSel('fdS', 'Filter By', [['tp', dirN('Today · pending steps', sets.tp.length)], ['to', dirN('Today · overdue steps', sets.to.length)],
          ['wo', dirN('This week · overdue steps', sets.wo.length)], ['wp', dirN('This week · pending steps', sets.wp.length)], ['steps', 'This week · step by step']], sub) +
        '<div class="ff grow small muted" style="justify-content:flex-end">This week ' + h(X.weekText) + ' · ' + W.orders + ' orders · ' + W.done + ' steps done · ' + W.overdue + ' overdue · ' + W.pending + ' pending</div></div><div id="fdL"></div>';
      dirOnSel(bx, 'fdS', function (v0) { sub = v0; list3(); });
      function list3() {
        var box = $('#fdL', bx);
        if (sub === 'steps') { box.innerHTML = steps(X.steps, 'This week · ' + X.weekText); return; }
        recList(box, sets[sub], { title: function (x) { return h(x.order + (x.outlet ? ' · ' + x.outlet : '')); },
          sub: function (x) { return h(['Step ' + x.stepNo + '/' + x.of + ' · ' + x.step, 'planned ' + x.planned, x.date ? 'ordered ' + x.date : '', x.items ? x.items + ' items' : ''].filter(Boolean).join(' · ')); },
          right: function (x) { return x.late ? chip(x.late + ' late', 'red') : chip('Pending', 'orange'); }, empty: 'Nothing here.', emptyIcon: 'task_alt' });
        if (X.more && sub.charAt(0) === 'w') box.insertAdjacentHTML('beforeend', '<div class="small muted mt">' + X.more + ' more steps this week are not listed.</div>');
      }
      list3();
    }
  }
  load(false);
};

V.empview = function (el) {

  el.innerHTML = pageHead('Employee View', '') + '<div id="evB">' + loadingHtml() + '</div>';

  live('ev.list', {}, function (d) { L = d; paint(); }, { alive: function () { return document.body.contains(B); } }).catch(function (e) { B.innerHTML = errHtml(e); });
  function paint() {
    B.innerHTML = '<div class="fbar"><div class="ff grow"><label>Search</label><input class="inp sm" id="evQ" placeholder="Name, employee ID, designation…" value="' + h(st.q) + '"></div>' +
      '<div class="ff"><label>Location</label><select class="inp sm" id="evP"><option value="">All</option>' + L.places.map(function (p) { return '<option' + (p === st.place ? ' selected' : '') + '>' + h(p) + '</option>'; }).join('') + '</select></div>' +
      '<div class="ff"><label>Role</label><select class="inp sm" id="evR"><option value="">All</option>' + L.roles.map(function (p) { return '<option' + (p === st.role ? ' selected' : '') + '>' + h(p) + '</option>'; }).join('') + '</select></div></div><div id="evL"></div>';
    $('#evQ', B).oninput = debounce(function () { st.q = val('#evQ', B).toLowerCase(); rows(); }, 150);
    $('#evP', B).onchange = function () { st.place = this.value; rows(); };
    $('#evR', B).onchange = function () { st.role = this.value; rows(); };

  function rows() {
    var R = L.list.filter(function (u) {
      if (st.place && u.place !== st.place) return false;

      if (st.q && (u.name + ' ' + u.empId + ' ' + u.designation + ' ' + u.dept).toLowerCase().indexOf(st.q) < 0) return false;
      return true;
    });
    recList($('#evL', B), R.slice(0, 200), {
      title: function (u) { return h(u.name); },
      sub: function (u) { return h([u.designation || u.role, u.dept, u.place, u.empId].filter(Boolean).join(' · ')); },
      right: function (u) { return '<button class="btn sm soft" data-ev="' + h(u.uid) + '">' + icon('visibility') + 'View</button>'; },
      empty: 'Nobody matches.'
    });
    $$('[data-ev]', B).forEach(function (bt) { bt.onclick = function (e) { e.stopPropagation(); viewAs(bt.dataset.ev, bt); }; });
  }
};
