        '<div class="is-row-sub">' + escHtml([it.code, it.unit, it.category].filter(Boolean).join(' · ')) + '</div></div>' +
        '<button type="button" class="is-btn show" data-is-act="show" data-i="' + i + '">Show</button></div>';
    });

  if (isLastInact.length) {
    html += '<div class="is-section">⛔ In the Item Master, not Active</div>';
    isLastInact.forEach(function (it, i) {
      html += '<div class="is-row"><div class="is-row-main">' +
        '<div class="is-row-name">' + escHtml(it.name) + ' <span class="is-badge inactive">' + escHtml(it.status || 'Inactive') + '</span></div>' +
        '<div class="is-row-sub">' + escHtml([it.code, it.unit, it.category].filter(Boolean).join(' · ')) + '</div></div>' +
        '<button type="button" class="is-btn req" data-is-act="activate" data-i="' + i + '">📨 Request to activate</button></div>';
    });

    html += '<div class="is-note">⏳ Checking the full Item Master…</div>';
  } else if (!itemReq.sourceOk) {
    html += '<div class="is-note">⚠️ Inactive items could not be checked right now — your request will still reach HQ.</div>';
  }
  if (!exact) {
    var shown = typed.length > 40 ? typed.substring(0, 40) + '…' : typed;
    html += '<div class="is-new"><p>' + ((isLastAct.length || isLastInact.length) ? 'None of these? ' : 'Not in the Item Master? ') +
      'Send “' + escHtml(typed) + '” to HQ as a new item.</p>' +
      '<button type="button" class="is-btn req" data-is-act="new">📨 Submit “' + escHtml(shown) + '”</button></div>';

var PRINT_EXTRA_MIN = 3;
var LIB_URLS = {
  jspdf: ['https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js',
    'https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js'],

    'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js']
};

function loadLib(name, ready, cb) {
  if (ready()) { cb(true); return; }
  var urls = (LIB_URLS[name] || []).slice();
  (function next() {
    var u = urls.shift();
    if (!u) { cb(false); return; }
    var s = document.createElement('script');
    s.src = u;
    s.async = true;
    s.onload = function () { if (ready()) cb(true); else next(); };
    s.onerror = function () { s.remove(); next(); };
    document.head.appendChild(s);
  })();
}

function printSheetInfo() {

  if (/^CG$/i.test(outlet)) outlet = '';
  return {

    outlet: outlet,

    fileBase: 'Order_Sheet' + (outlet ? '_' + outlet.replace(/[^A-Za-z0-9]+/g, '_') : '') + '_' + dateStr
  };
}

function buildPrintRows(items) {
  var rows = [], lastCat = null;
  items.forEach(function (it, i) {
    var cat = it.category || 'Other';
    if (cat !== lastCat) { rows.push({ t: 'cat', text: cat }); lastCat = cat; }
    rows.push({ t: 'item', sno: it.sno || (i + 1), name: it.name, unit: it.unit || '' });
  });
  return rows;
}

function paginatePrint(rows, perCol) {
  var cols = [], cur = [], curCat = '';
  rows.forEach(function (r) {
    if (r.t === 'cat') {
      curCat = r.text;
      if (cur.length >= perCol - 1) { cols.push(cur); cur = []; }
      cur.push(r);
      return;
    }
    if (cur.length >= perCol) {
      cols.push(cur);
      cur = [];
      if (curCat) cur.push({ t: 'cat', text: curCat, contd: true });
    }
    cur.push(r);
  });
  if (cur.length) cols.push(cur);

  var last = cols[cols.length - 1];
  var extraHead = { t: 'cat', text: 'Extra Items', extra: true };
  if (last && perCol - last.length >= PRINT_EXTRA_MIN) {
    last.push(extraHead);
  } else if (cols.length % 2 === 1) {
    last = [extraHead];
    cols.push(last);
  }
  while (last && last.length < perCol) last.push({ t: 'blank' });

  var pages = [];
  for (var c = 0; c < cols.length; c += 2) pages.push([cols[c], cols[c + 1] || []]);
  return pages;
}

function printLayout() {
  var info = printSheetInfo();
  var rows = buildPrintRows(bulkData.items);
  var best = null;
  for (var per = PRINT_ROWS_MIN; per <= PRINT_ROWS_MAX; per++) {
    var pages = paginatePrint(rows, per);
    if (!best || pages.length < best.pages.length) best = { pages: pages, perCol: per };
  }
  return {
    info: info, pages: best.pages, perCol: best.perCol,
    rh: Math.round((PRINT_TABLE_MM / (best.perCol + 1)) * 100) / 100
  };
}

function runPrintChoice(kind, btn) {
  var L = printLayout();
  if (kind === 'print') {
    closeDialog();
    printSheetNow(L);

  }
  var label = btn.querySelector('b');
  var orig = label ? label.textContent : '';
  btn.disabled = true;
  if (label) label.textContent = 'Preparing...';
  var done = function (ok, msg) {
    btn.disabled = false;
    if (label) label.textContent = orig;
    if (ok) { closeDialog(); showNotification('✅ ' + msg, 'success'); }
    else showNotification('⚠️ ' + msg, 'error');
  };
  if (kind === 'pdf') {
    loadLib('jspdf', function () { return !!(window.jspdf && window.jspdf.jsPDF); }, function (ok) {
      if (!ok) { done(false, 'Could not load the PDF maker — check the internet and try again'); return; }
      try {
        var doc = makeOrderSheetPdf(L);
        downloadBlob(doc.output('blob'), L.info.fileBase + '.pdf');
        done(true, 'PDF downloaded — ' + L.pages.length + ' page' + (L.pages.length === 1 ? '' : 's'));
      } catch (err) { done(false, 'PDF failed: ' + (err && err.message ? err.message : err)); }
    });
  }
  if (kind === 'xlsx') {
    loadLib('exceljs', function () { return !!window.ExcelJS; }, function (ok) {
      if (!ok) { done(false, 'Could not load the Excel maker — check the internet and try again'); return; }
      try {
        makeOrderSheetXlsx(L).then(function (buf) {
          downloadBlob(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }),
            L.info.fileBase + '.xlsx');
          done(true, 'Excel downloaded');
        }).catch(function (err) { done(false, 'Excel failed: ' + (err && err.message ? err.message : err)); });
      } catch (err) { done(false, 'Excel failed: ' + (err && err.message ? err.message : err)); }
    });
  }
}

function downloadBlob(blob, filename) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.style.display = 'none';
  oaLayer().appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 60000);
}

function pdfText(s) {
  return (s === null || s === undefined ? '' : s.toString())
    .replace(/[–—]/g, '-').replace(/[‘’]/g, "'").replace(/[“”]/g, '"')
    .replace(/[^\x20-\x7E\xA0-\xFF]/g, '?');
}

function makeOrderSheetPdf(L) {
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
  var PW = 210, PH = 297, M = PRINT_MARGIN_MM, GUT = 4;
  var COLW = (PW - 2 * M - GUT) / 2;
  var W = { sno: 9, qty: 15, cls: 15 };
  W.name = COLW - W.sno - W.qty - W.cls;
  var RH = L.rh, TABLE_Y = M + 14;
  var info = L.info, total = L.pages.length;

  doc.setLineWidth(0.2);
  var line = function () { doc.setDrawColor(110, 110, 110); };
  var mid = function (y) { return y + RH / 2 + 1.0; };

  var drawCells = function (x, y) {
    line();
    doc.rect(x, y, COLW, RH);
    doc.line(x + W.sno, y, x + W.sno, y + RH);
    doc.line(x + W.sno + W.name, y, x + W.sno + W.name, y + RH);
    doc.line(x + W.sno + W.name + W.qty, y, x + W.sno + W.name + W.qty, y + RH);
  };

  var fitName = function (name, room) {
    var size = 7.8;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(size);
    while (doc.getTextWidth(name) > room && size > 6.4) { size -= 0.2; doc.setFontSize(size); }
    var txt = name;
    if (doc.getTextWidth(txt) > room) {
      while (txt.length > 3 && doc.getTextWidth(txt + '...') > room) txt = txt.slice(0, -1);
      txt = txt.replace(/\s+$/, '') + '...';
    }
    return txt;
  };

  L.pages.forEach(function (pg, pi) {
    if (pi) doc.addPage();

    doc.setTextColor(40, 26, 12);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(13);
    doc.text(pdfText(info.title), M, M + 5);
    doc.setFontSize(10);
    doc.text('DATE: ________________', PW - M, M + 5, { align: 'right' });
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(7.8);
    doc.setTextColor(85, 85, 85);
    doc.text('Stock & Order Sheet   |   Filled by: ____________________________', M, M + 10.5);
    doc.text(info.count + ' active items  |  same order as New Order', PW - M, M + 10.5, { align: 'right' });

    pg.forEach(function (col, ci) {
      if (!col.length) return;
      var x = M + ci * (COLW + GUT);

      doc.setFillColor(244, 201, 126);
      doc.rect(x, TABLE_Y, COLW, RH, 'F');
      drawCells(x, TABLE_Y);
      doc.setTextColor(40, 26, 12);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(7.4);
      doc.text('S.No', x + W.sno / 2, mid(TABLE_Y), { align: 'center' });
      doc.text('ITEM NAME', x + W.sno + 2, mid(TABLE_Y));
      doc.text('QTY', x + W.sno + W.name + W.qty / 2, mid(TABLE_Y), { align: 'center' });
      doc.text('CLOSING', x + W.sno + W.name + W.qty + W.cls / 2, mid(TABLE_Y), { align: 'center' });

      col.forEach(function (r, ri) {
        var y = TABLE_Y + RH * (ri + 1);
        if (r.t === 'cat') {
          doc.setFillColor(255, 240, 212);
          doc.rect(x, y, COLW, RH, 'F');
          line();
          doc.rect(x, y, COLW, RH);
          doc.setTextColor(107, 63, 28);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(7.6);
          doc.text(pdfText(r.text.toUpperCase() + (r.contd ? '  (contd.)' : '')), x + 2, mid(y));
          return;
        }
        drawCells(x, y);
        if (r.t !== 'item') return;
        doc.setTextColor(110, 110, 110);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(7.4);
        doc.text(String(r.sno), x + W.sno / 2, mid(y), { align: 'center' });
        var unit = pdfText(r.unit);
        var unitW = 0;
        if (unit) {
          doc.setFontSize(5.8);
          unitW = doc.getTextWidth(unit) + 1.5;
          doc.setTextColor(140, 140, 140);
          doc.text(unit, x + W.sno + W.name - 1.2, mid(y) - 0.1, { align: 'right' });
        }
        var nm = fitName(pdfText(r.name), W.name - 3.2 - unitW);
        doc.setTextColor(25, 25, 25);
        doc.text(nm, x + W.sno + 1.8, mid(y));
      });
    });

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(6.8);
    doc.setTextColor(130, 130, 130);
    doc.text('Chai Govindam  |  Active items as on ' + info.dateStr, M, PH - 8);
    doc.text('Page ' + (pi + 1) + ' of ' + total, PW - M, PH - 8, { align: 'right' });
  });
  return doc;
}

function makeOrderSheetXlsx(L) {
  var info = L.info;
  var wb = new ExcelJS.Workbook();
  wb.creator = 'Chai Govindam';
  wb.created = new Date();
  var ws = wb.addWorksheet('Order Sheet', {
    views: [{ showGridLines: false }],
    pageSetup: {
      paperSize: 9, orientation: 'portrait', fitToPage: false, scale: 100, horizontalCentered: true,

      margins: { left: 0.5, right: 0.5, top: 0.5, bottom: 0.7, header: 0.25, footer: 0.35 }
    },
    headerFooter: { oddFooter: '&L&8Chai Govindam  |  Active items as on ' + info.dateStr + '&R&8Page &P of &N' }
  });
  ws.columns = [
    { width: 4.3 }, { width: 25.5 }, { width: 6.5 }, { width: 7.8 }, { width: 1 },
    { width: 4.3 }, { width: 25.5 }, { width: 6.5 }, { width: 7.8 }
  ]

  var thin = { style: 'thin', color: { argb: 'FF7A7A7A' } };
  var box = { top: thin, left: thin, bottom: thin, right: thin };
  var fillHead = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF4C97E' } };
  var fillCat = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFF0D4' } };
  var brown = { argb: 'FF4A2B13' };
  var RH = Math.round(L.rh / 25.4 * 72 * 0.97 * 10) / 10;
  var r = 1;

  L.pages.forEach(function (pg) {
    ws.mergeCells(r, 1, r, 6);
    ws.mergeCells(r, 7, r, 9);
    var t = ws.getCell(r, 1);
    t.value = info.title;
    t.font = { name: 'Arial', size: 13, bold: true, color: brown };
    t.alignment = { vertical: 'middle' };
    var d = ws.getCell(r, 7);
    d.value = 'DATE: ____________';
    d.font = { name: 'Arial', size: 10, bold: true, color: brown };
    d.alignment = { vertical: 'middle', horizontal: 'right' };
    ws.getRow(r).height = 22;
    r++;
    ws.mergeCells(r, 1, r, 5);
    ws.mergeCells(r, 6, r, 9);
    var s1 = ws.getCell(r, 1);
    s1.value = 'Stock & Order Sheet   |   Filled by: ______________________';
    s1.font = { name: 'Arial', size: 8, color: { argb: 'FF555555' } };
    var s2 = ws.getCell(r, 6);
    s2.value = info.count + ' active items  |  same order as New Order';
    s2.font = { name: 'Arial', size: 8, color: { argb: 'FF555555' } };
    s2.alignment = { horizontal: 'right' };
    ws.getRow(r).height = 15;
    r++;

    [0, 5].forEach(function (off, side) {
      if (!pg[side] || !pg[side].length) return;
      ['S.No', 'ITEM NAME', 'QTY', 'CLOSING'].forEach(function (h, i) {
        var c = ws.getCell(r, off + 1 + i);
        c.value = h;
        c.font = { name: 'Arial', size: 8, bold: true, color: brown };
        c.fill = fillHead;
        c.border = box;
        c.alignment = { vertical: 'middle', horizontal: i === 1 ? 'left' : 'center', indent: i === 1 ? 1 : 0 };
      });
    });
    ws.getRow(r).height = RH;
    r++;

    var lines = Math.max(pg[0].length, (pg[1] || []).length);
    for (var i = 0; i < lines; i++) {
      [0, 5].forEach(function (off, side) {
        var row = (pg[side] || [])[i];
        if (!row) return;
        if (row.t === 'cat') {
          ws.mergeCells(r, off + 1, r, off + 4);
          var cc = ws.getCell(r, off + 1);
          cc.value = row.text.toUpperCase() + (row.contd ? '  (contd.)' : '');
          cc.font = { name: 'Arial', size: 8, bold: true, color: { argb: 'FF6B3F1C' } };
          cc.fill = fillCat;
          cc.border = box;
          cc.alignment = { vertical: 'middle', indent: 1 };
          return;
        }
        for (var k = 0; k < 4; k++) ws.getCell(r, off + 1 + k).border = box;
        if (row.t !== 'item') return;
        var sn = ws.getCell(r, off + 1);
        sn.value = row.sno;
        sn.font = { name: 'Arial', size: 8, color: { argb: 'FF6E6E6E' } };
        sn.alignment = { vertical: 'middle', horizontal: 'center' };
        var nm = ws.getCell(r, off + 2);
        nm.value = {
          richText: [
            { font: { name: 'Arial', size: 8.5, color: { argb: 'FF191919' } }, text: row.name },
            { font: { name: 'Arial', size: 6.5, color: { argb: 'FF8C8C8C' } }, text: row.unit ? '   ' + row.unit : '' }
          ]
        };
        nm.alignment = { vertical: 'middle', shrinkToFit: true, indent: 1 };
      });
      ws.getRow(r).height = RH;
      r++;
    }
    ws.getRow(r - 1).addPageBreak();
  });
  ws.pageSetup.printArea = 'A1:I' + (r - 1);
  return wb.xlsx.writeBuffer();
}

function printSheetNow(L) {
  var w = null;
  try { w = window.open('', '_blank'); } catch (e) { w = null; }
  if (w && w.document) {
    w.document.open();
    w.document.write(makeOrderSheetHtml(L, true));
    w.document.close();
    return;
  }

  var old = document.getElementById('printFrame');
  if (old) old.remove();
  var f = document.createElement('iframe');
  f.id = 'printFrame';
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  oaLayer().appendChild(f);
  var fd = f.contentWindow.document;
  fd.open();
  fd.write(makeOrderSheetHtml(L, false));
  fd.close();
  setTimeout(function () {
    try { f.contentWindow.focus(); f.contentWindow.print(); }
    catch (e) { showNotification('⚠️ Printing is blocked here — use Download PDF instead', 'error'); }
  }, 400);
}

function isAdminByOutlet(outletId) {
  return outletId && outletId.toString().trim().toUpperCase().startsWith("HQ");
}

function outletLabel(user) {
  var n = (user && (user.outletFullName || user.outletShortName)) || '';
  n = n.toString().trim();
  if (!n) return 'CG';
  if (/^CG\s/i.test(n) || /^GFP\b/i.test(n)) return n;
  return 'CG ' + n;
}

function showDispatchOnly() {
  ['tab-new', 'tab-maxlevel', 'tab-history', 'tab-stockentry'].forEach(function (id) {
    var el = document.getElementById(id); if (el) el.style.display = 'none';
  });
  var dt = document.getElementById('tab-dispatch');
  if (dt) dt.style.display = '';
  switchTab('dispatch');
}

function resetScreensForLogout() {
  cart = {}; cartStock = {}; autoManaged = {};
  autoFillOn = false; updateAutoFillBtn();
  orderByName = '';
  obsData = null; csData = null; csValues = {}; csStdValues = {};
  mlData = null; mlBase = {}; mlValues = {};
  itemReqSent = [];
  closeItemSuggestion(); closeReviewModal();
  ['bulkSearch', 'mlSearch'].forEach(function (id) { var e = document.getElementById(id); if (e) e.value = ''; });
  var g = document.getElementById('bulkGrid');
  if (g) g.innerHTML = '<div class="bulk-empty"><div class="empty-icon">⏳</div><p>Loading items...</p></div>';
  var m = document.getElementById('mlScroll');
  if (m) m.innerHTML = '<div class="stock-loading">⏳ Loading items...</div>';
  bulkData = { items: [], categories: [], subs: [], units: [], lookbackDays: 60 };

}

function closeDialog() {
  var d = document.querySelector('.confirm-dialog');
  if (d) d.remove();
}

function switchTab(tab) {
  if (tab === 'stockentry' && !appConfig.SHOW_CLOSING_STOCK_TAB) tab = 'new';
  if (tab === 'dispatch' && !canDispatch) tab = 'new';
  if (isDispatchUser) tab = 'dispatch';
  oaShown(tab);
  document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
  document.querySelectorAll('.tab-content').forEach(function (c) { c.classList.remove('active'); });
  var btn = document.getElementById('tab-' + tab);
  var pane = document.getElementById('content-' + tab);
  if (btn) btn.classList.add('active');
  if (pane) pane.classList.add('active');
  if (tab === 'history') loadHistory();
  if (tab === 'dispatch') loadDispatch();
  if (tab === 'stockentry' && !csData) loadStockEntry();
  if (tab === 'maxlevel' && (!mlData || !mlData.success)) loadMaxLevel();
}

function loadAllData() {
  oaRun()
    .withSuccessHandler(function (res) {
      setCatalog(res);
      allItems = (res && res.items) ? res.items : [];
      if (res && res.ok === false) {
        showNotification('\u26A0\uFE0F Item list could not be read: ' + (res.error || 'unknown error'), 'error');
      }
      pruneCartToCatalog(false);
    })
    .withFailureHandler(function () {
      showNotification('\u26A0\uFE0F Could not load the item list. Tap 🔄 Refresh to retry.', 'error');
    })
    .getCatalog();
}

function setMinDate() {
  var d = document.getElementById('orderDate');
  if (!d) return;
  var t = new Date();
  var s = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
  d.setAttribute('min', s);
  if (!d.value) d.value = s;
}

function loadHistory() {
  var list = document.getElementById('historyList');
  list.innerHTML = '<div class="history-loading">⏳ Loading orders...</div>';

  if (!currentUser) return;

  oaRun()
    .withSuccessHandler(function (orders) {
      oaHistoryList = orders || [];
      document.getElementById('historyCount').textContent = oaHistoryList.length;
      renderHistory(oaHistoryList);
    })
    .withFailureHandler(function () {
      list.innerHTML = '<div class="history-empty"><div class="empty-icon">⚠️</div><p>Failed to load orders.</p></div>';
    })
    .getOrderHistory(currentUser.userId, isAdminByOutlet(currentUser.outletId));
}

function renderHistory(orders) {
  var list = document.getElementById('historyList');
  if (!orders || orders.length === 0) {
    list.innerHTML = '<div class="history-empty"><div class="empty-icon">📭</div><p>No orders found for today or yesterday.</p></div>';
    return;
  }

  var html = '';
  orders.forEach(function (order, idx) {
    var approvalClass = 'pending';
    var approvalText = '🕐 Pending';
    if (order.status === 'Approved') { approvalClass = 'approved'; approvalText = '✅ Approved'; }
    if (order.status === 'Rejected') { approvalClass = 'rejected'; approvalText = '❌ Rejected'; }

    var currentUserIsAdmin = isAdminByOutlet(currentUser.outletId);

    var isOrderOwner = order.mine === true || (order.userId && order.userId === currentUser.userId) ||
      (!order.userId && order.orderedBy && order.orderedBy.indexOf(currentUser.userId) !== -1);
    var canEdit = !currentUserIsAdmin && (order.status === 'Confirmed') && isOrderOwner;
    var revisionBadge = (parseInt(order.revision) > 0) ? '<span class="revision-badge">Rev.' + order.revision + '</span>' : '';
    var adminOwnerBadge = currentUserIsAdmin && order.userId ? '<span style="font-size:0.75rem;color:var(--gray);margin-left:6px">(' + order.userId + ')</span>' : '';

    var outletDisplay = order.outletFullName || order.outletShortName || '';

    var anyDispatched = order.items.some(function (it) {
      return it.dispatchQty !== '' && it.dispatchQty !== null && it.dispatchQty !== undefined;
    });
    var itemsHtml = '<table class="order-items-table"><thead><tr><th>#</th><th>Item Code</th><th>Item Name</th><th>Quantity</th>' +
      (anyDispatched ? '<th>Dispatched</th>' : '') + '</tr></thead><tbody>';
    order.items.forEach(function (item, i) {
      var inputDisabled = canEdit ? '' : 'disabled';
      var dq = (item.dispatchQty === '' || item.dispatchQty === null || item.dispatchQty === undefined)
        ? '' : fmtQty(item.dispatchQty);

      var gId = item.groupId || '';
      var mult = Number(item.multiple) || 0;
      var mnq = Number(item.minQty) || 0;
      var hintTxt = ruleHintText({ multiple: mult, minQty: mnq, unit: item.unit });
      var ruleNote = (gId ? '<span class="row-rule-note">🔗 Linked — same qty on every linked item</span>' : '') +
        (hintTxt ? '<span class="row-rule-note" style="color:#92400E">' + escHtml(hintTxt) + '</span>' : '');
      itemsHtml += '<tr>' +
        '<td data-label="#">' + (i + 1) + '</td>' +
        '<td data-label="Item Code" style="font-family:monospace;font-size:0.8rem;color:var(--primary)">' + escHtml(item.code || '—') + '</td>' +
        '<td data-label="Item Name">' + escHtml(item.name) + ruleNote + '</td>' +
        '<td data-label="Quantity"><div style="display:inline-flex;align-items:center;gap:6px;"><input type="number" class="qty-edit-input" value="' + item.qty + '" min="0" ' + (mult ? 'step="' + fmtQty(mult) + '" ' : '') + inputDisabled + ' data-item="' + escHtml(item.name) + '" data-unit="' + escHtml(item.unit) + '" data-code="' + escHtml(item.code || '') + '" data-group="' + escHtml(gId) + '" data-multiple="' + mult + '" data-minqty="' + mnq + '" data-order-idx="' + idx + '"><span class="unit-cell">' + escHtml(item.unit) + '</span></div></td>' +
        (anyDispatched
          ? '<td data-label="Dispatched" style="text-align:center"><span class="disp-badge ' +
          (dq === '' ? 'pending' : (Number(dq) < Number(item.qty) ? 'part' : 'done')) + '">' +
          (dq === '' ? '—' : dq) + '</span></td>'
          : '') +
        '</tr>';
    });
    itemsHtml += '</tbody></table>';

    var updateBtn = canEdit ?
      '<button class="oa-btn btn-update btn-sm" onclick="submitOrderUpdate(\'' + escHtml(order.orderNo) + '\', ' + idx + ')">💾 Save Changes</button>' : '';

    var addBtn = canEdit ?
      '<button class="oa-btn btn-sm" style="background:#F8AF03;color:#4A2B13" onclick="addEditRow(this, \'' + escHtml(order.orderNo) + '\', ' + idx + ')">➕ Add Item</button>' : '';

    var lockMessage = '';
    if (currentUserIsAdmin) {
      lockMessage = '<span class="summary-pill" style="background:#FFF0D4;color:var(--primary)">👁️ View Only (HQ Admin)</span>';
    } else if (!isOrderOwner) {
      lockMessage = '<span class="summary-pill" style="background:#f1f5f9;color:#64748b">🔒 Not Your Order</span>';
    } else if (order.status === 'Approved') {
      lockMessage = '<span class="summary-pill" style="background:#d1fae5;color:#065f46">🔒 Locked (Approved)</span>';
    } else if (order.status === 'Rejected') {
      lockMessage = '<span class="summary-pill" style="background:#fee2e2;color:#991b1b">🔒 Locked (Rejected)</span>';
    } else if (canEdit) {
      lockMessage = '<span class="summary-pill" style="background:#FFF0D4;color:#92400e">✏️ Editable</span>';
    }

    html += '<div class="order-card">' +
      '<div class="order-card-header" onclick="toggleOrderCard(this)">' +
      '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
      '<span class="order-no-badge">' + escHtml(order.orderNo) + '</span>' +
      revisionBadge +
      adminOwnerBadge +
      '</div>' +
      '<div class="order-meta">' +
      '<span class="order-timestamp">🕐 ' + escHtml(order.timestamp) + '</span>' +
      '<span class="order-outlet-badge">' + escHtml(outletDisplay) + '</span>' +
      '<span class="approval-badge ' + approvalClass + '">' + approvalText + '</span>' +
      '</div>' +
      '<span class="expand-icon">▼</span>' +

var historyRuleEventsBound = false;

function initHistoryRuleEvents() {
  if (historyRuleEventsBound) return;
  var list = document.getElementById('historyList');
  if (!list) return;
  historyRuleEventsBound = true;

  list.addEventListener('input', function (e) {
    var t = e.target;
    if (!t.matches || !t.matches('input.qty-edit-input')) return;
    syncLinkedQty(t);
    markQtyRule(t);
  });
  list.addEventListener('change', function (e) {
    var t = e.target;
    if (!t.matches || !t.matches('input.qty-edit-input')) return;
    fixHistoryMultiple(t);
  });
  list.addEventListener('focusout', function (e) {
    var t = e.target;
    if (!t.matches || !t.matches('input.qty-edit-input')) return;
    fixHistoryMultiple(t);
  });
}

function linkedQtyInputs(input) {
  var gid = input.getAttribute('data-group') || '';
  var oIdx = input.getAttribute('data-order-idx');
  if (!gid || oIdx === null) return [];
  var out = [];
  document.querySelectorAll('input.qty-edit-input[data-order-idx="' + oIdx + '"]').forEach(function (q) {
    if (q !== input && (q.getAttribute('data-group') || '') === gid) out.push(q);
  });
  return out;
}

function syncLinkedQty(input) {
  if (input.disabled) return;
  linkedQtyInputs(input).forEach(function (q) {
    if (q.value !== input.value) { q.value = input.value; markQtyRule(q); }
  });
}

function markQtyRule(input) {
  var q = parseFloat(input.value);
  var err = qtyRuleError(q, {
    unit: input.getAttribute('data-unit') || '',
    multiple: Number(input.getAttribute('data-multiple')) || 0,
    minQty: Number(input.getAttribute('data-minqty')) || 0
  });
  input.classList.toggle('qty-bad', !!err);
  input.title = err || '';
}

function fixHistoryMultiple(input) {
  if (input.disabled) return;
  markQtyRule(input);
}

var dispatchOrders = [];
var dispReasons = [];
var dispPendingOnly = false;

function loadDispatch() {
  var list = document.getElementById('dispatchList');
  if (!list || !currentUser) return;
  list.innerHTML = '<div class="history-loading">⏳ Loading orders...</div>';

  oaRun()
    .withSuccessHandler(function (res) {
      if (!res || res.success === false) {
        list.innerHTML = '<div class="history-empty"><div class="empty-icon">⚠️</div><p>' +
          escHtml((res && res.message) || 'Could not load orders.') + '</p></div>';
        return;
      }
      dispatchOrders = res.orders || [];
      dispReasons = res.reasons || dispReasons;
      var cnt = document.getElementById('dispatchCount');
      if (cnt) cnt.textContent = dispatchOrders.length;
      fillDispatchOutlets();
      renderDispatch();
    })
    .withFailureHandler(function () {
      list.innerHTML = '<div class="history-empty"><div class="empty-icon">⚠️</div><p>Failed to load orders.</p></div>';
    })
    .getDispatchOrders(currentUser.userId);
}

function fillDispatchOutlets() {
  var sel = document.getElementById('dispOutlet');
  if (!sel) return;
  var cur = sel.value;
  var seen = {};
  dispatchOrders.forEach(function (o) { if (o.outletFullName) seen[o.outletFullName] = true; });
  var names = Object.keys(seen).sort();
  sel.innerHTML = '<option value="">All Outlets</option>';
  names.forEach(function (n) {
    var o = document.createElement('option');
    o.value = n; o.textContent = n;
    sel.appendChild(o);
  });
  if (cur && names.indexOf(cur) > -1) sel.value = cur;
}

function toggleDispPending() {
  dispPendingOnly = !dispPendingOnly;
  var b = document.getElementById('dispPendingBtn');
  if (b) b.classList.toggle('on', dispPendingOnly);
  renderDispatch();
}

function dispState(order) {
  var filled = 0;
  order.items.forEach(function (i) { if (i.dispatchQty !== '' && i.dispatchQty !== null) filled++; });
  if (!filled) return 'pending';
  return filled === order.items.length ? 'done' : 'part';
}

function renderDispatch() {
  var list = document.getElementById('dispatchList');
  if (!list) return;

  var term = ((document.getElementById('dispSearch') || {}).value || '').toLowerCase().trim();
  var outlet = (document.getElementById('dispOutlet') || {}).value || '';

  var shown = dispatchOrders.filter(function (o) {
    if (outlet && o.outletFullName !== outlet) return false;
    if (dispPendingOnly && dispState(o) === 'done') return false;
    if (term) {
      var hay = (o.orderNo + ' ' + o.outletFullName + ' ' + (o.customerName || '') + ' ' +
        o.items.map(function (i) { return i.name + ' ' + (i.code || ''); }).join(' ')).toLowerCase();
      if (hay.indexOf(term) === -1) return false;
    }
    return true;
  });

  if (!shown.length) {
    list.innerHTML = '<div class="history-empty"><div class="empty-icon">📭</div><p>No orders to dispatch.</p></div>';
    return;
  }

  var html = '';
  shown.forEach(function (order) {
    var idx = dispatchOrders.indexOf(order);
    var st = dispState(order);
    var badge = st === 'done' ? '<span class="disp-badge done">✅ Dispatched</span>'
      : st === 'part' ? '<span class="disp-badge part">◑ Part dispatched</span>'
        : '<span class="disp-badge pending">🕐 To dispatch</span>';

    var rows = '';
    order.items.forEach(function (item, i) {
      var dv = (item.dispatchQty === '' || item.dispatchQty === null || item.dispatchQty === undefined)
        ? '' : fmtQty(item.dispatchQty);
      var cls = 'disp-qty-input' + (dv !== '' ? (Number(dv) < Number(item.qty) ? ' short' : ' has-value') : '');
      var isShort = dv !== '' && Number(dv) < Number(item.qty);
      var reasonOpts = '<option value="">Reason not dispatched</option>' + dispReasons.map(function (r0) {
        return '<option' + (r0 === item.ndReason ? ' selected' : '') + '>' + escHtml(r0) + '</option>';
      }).join('');
      rows += '<tr>' +
        '<td data-label="#">' + (i + 1) + '</td>' +
        '<td data-label="Item Code" style="font-family:monospace;font-size:0.8rem;color:var(--primary)">' + escHtml(item.code || '—') + '</td>' +
        '<td data-label="Item Name">' + escHtml(item.name) + '</td>' +
        '<td data-label="Ordered" style="text-align:center;"><span style="font-weight:700;display:inline-flex;align-items:center;gap:6px;">' + fmtQty(item.qty) + '<span class="unit-cell">' + escHtml(item.unit) + '</span></span></td>' +
        '<td data-label="Dispatch Qty" style="text-align:center">' +
        '<div style="display:inline-flex;align-items:center;gap:4px">' +
        '<button type="button" class="oa-btn btn-ghost" style="padding:4px 10px;border-radius:6px;background:var(--light);border:1px solid var(--border);" onclick="stepDispQty(this, -1)">−</button>' +
        '<input type="number" min="0" step="any" class="' + cls + '" style="width:70px" value="' + dv + '" placeholder="—" ' +
        'data-disp-idx="' + idx + '" data-item="' + escHtml(item.name) + '" data-code="' + escHtml(item.code || '') + '" ' +
        'data-ordered="' + item.qty + '" oninput="dispInputChanged(this)">' +
        '<button type="button" class="oa-btn btn-ghost" style="padding:4px 10px;border-radius:6px;background:var(--light);border:1px solid var(--border);" onclick="stepDispQty(this, 1)">+</button>' +
        '</div>' +
        '</td>' +
        '<td data-label="Not dispatched">' +
        '<div class="nd-box" style="display:' + (isShort ? 'flex' : 'none') + ';flex-direction:column;gap:4px;min-width:170px">' +
        '<select class="filter-select nd-reason" style="width:100%">' + reasonOpts + '</select>' +

      ? '<span class="summary-pill" style="background:#d1fae5;color:#065f46">🚚 ' + escHtml(order.dispatchedBy) +
      (order.dispatchTime ? ' · ' + escHtml(order.dispatchTime) : '') + '</span>'

      '<tbody>' + rows + '</tbody></table></div>' +

  });

function dispInputChanged(el) {
  var v = el.value.toString().trim();
  var ordered = Number(el.getAttribute('data-ordered')) || 0;
  var tr = el.closest('tr'), box = tr ? tr.querySelector('.nd-box') : null, none = tr ? tr.querySelector('.nd-none') : null;
  var short = v !== '' && Number(v) < ordered;
  if (box) box.style.display = short ? 'flex' : 'none';
  if (none) none.style.display = short ? 'none' : 'inline';
  el.classList.remove('has-value', 'short');
  if (v === '') return;
  el.classList.add(short ? 'short' : 'has-value');
}

function stepDispQty(btn, dir) {
  var inp = btn.parentNode.querySelector('input');
  if (!inp) return;
  var code = inp.getAttribute('data-code');
  var name = inp.getAttribute('data-item');
  var it = displayItemFor(code, name);
  var step = (it ? multipleFor(it) : 0) || 1;
  var cur = Number(inp.value) || 0;
  var next = snapStep(cur, step, dir);
  if (next === 0 && dir < 0) inp.value = '';
  else inp.value = next;
  dispInputChanged(inp);
}

function dispFillAll(idx) {
  document.querySelectorAll('[data-disp-idx="' + idx + '"]').forEach(function (el) {
    if (el.value.toString().trim() === '') {
      el.value = el.getAttribute('data-ordered') || '';
      dispInputChanged(el);
    }
  });
}

function saveDispatchForOrder(orderNo, idx) {
  var inputs = document.querySelectorAll('[data-disp-idx="' + idx + '"]');
  if (!inputs.length) { showNotification('Nothing to save', 'warning'); return; }

  var rows = [];
  var bad = false, noReason = [];
  inputs.forEach(function (el) {
    var v = el.value.toString().trim();
    if (v !== '' && (!isFinite(Number(v)) || Number(v) < 0)) { bad = true; return; }
    var tr = el.closest('tr'), rs = tr ? tr.querySelector('.nd-reason') : null, rm = tr ? tr.querySelector('.nd-remark') : null;
    var short = v !== '' && Number(v) < (Number(el.getAttribute('data-ordered')) || 0);
    if (short && rs && !rs.value) noReason.push(el.getAttribute('data-item'));
    rows.push({ name: el.getAttribute('data-item'), code: el.getAttribute('data-code') || '', dispatchQty: v,
      reason: short && rs ? rs.value : '', remark: short && rm ? rm.value.trim() : '' });
  });
  if (bad) { showNotification('⚠️ Dispatch quantity cannot be negative', 'warning'); return; }
  if (noReason.length) { showNotification('⚠️ Pick the reason for: ' + noReason.join(', '), 'warning'); return; }

  showNotification('⏳ Saving dispatch...', 'success');
  oaRun()
    .withSuccessHandler(function (res) {
      if (res && res.success) {
        showNotification('✅ ' + res.message, 'success');
        loadDispatch();
      } else {
        showNotification('❌ ' + ((res && res.message) || 'Could not save.'), 'error');
      }
    })
    .withFailureHandler(function (err) {
      showNotification('❌ Save failed: ' + (err.message || ''), 'error');
    })
    .saveDispatchQty({
      orderNo: orderNo,
      userId: currentUser.userId,
      userName: currentUser.name || '',
      rows: rows
    });
}

function toggleOrderCard(headerEl) {
  var body = headerEl.nextElementSibling;
  var icon = headerEl.querySelector('.expand-icon');
  body.classList.toggle('open');

}

function submitOrderUpdate(orderNo, orderIdx) {
  var order = oaHistoryList[orderIdx];
  if (!order) return;

  if (isAdminByOutlet(currentUser.outletId)) {
    showNotification('❌ HQ Admins cannot edit orders.', 'error');
    return;
  }

  var isOrderOwner = order.mine === true || (order.userId && order.userId === currentUser.userId) ||
    (!order.userId && order.orderedBy && order.orderedBy.indexOf(currentUser.userId) !== -1);
  if (!isOrderOwner) {
    showNotification('❌ You can only edit your own orders.', 'error');
    return;
  }

  if (order.status === 'Approved') {
    showNotification('❌ Order is approved. Cannot edit.', 'error');
    return;
  }
  if (order.status === 'Rejected') {
    showNotification('❌ Order is rejected. Cannot edit.', 'error');
    return;
  }

  var qtyInputs = document.querySelectorAll('[data-order-idx="' + orderIdx + '"]');
  var updatedItems = [];
  var seen = {};
  var dupes = [];
  var badMult = [];
  qtyInputs.forEach(function (input) {
    var itemName = input.getAttribute('data-item');
    var itemUnit = input.getAttribute('data-unit') || "";
    var itemCode = input.getAttribute('data-code') || "";
    var qty = parseFloat(input.value) || 0;
    if (!itemName) return;
    var k = skeyName(itemName);
    if (seen[k]) {
      dupes.push(itemName);
      input.closest('tr').classList.add('duplicate-row');
      return;
    }
    seen[k] = true;

    var rowRule = {
      unit: itemUnit,
      multiple: Number(input.getAttribute('data-multiple')) || 0,
      minQty: Number(input.getAttribute('data-minqty')) || 0
    };
    var rowErr = qtyRuleError(qty, rowRule);
    if (rowErr) { badMult.push(itemName + ' \u2014 ' + rowErr); input.classList.add('qty-bad'); }
    else input.classList.remove('qty-bad');
    updatedItems.push({ name: itemName, qty: qty, unit: itemUnit, code: itemCode });
  });

  if (dupes.length) {
    showNotification('\u26A0\uFE0F ' + dupes[0] + ' is already in this order \u2014 change its quantity instead of adding it again.', 'warning');
    return;
  }

  if (badMult.length) {
    showNotification('\u26A0\uFE0F Not saved \u2014 ' + badMult.slice(0, 3).join(' \u00B7 ') +
      (badMult.length > 3 ? ' \u00B7 and ' + (badMult.length - 3) + ' more' : '') +
      '. Fix the quantity and save again.', 'error');
    return;
  }

  if (!updatedItems.length) { showNotification('No items to update', 'warning'); return; }

  showNotification('⏳ Updating order...', 'success');

  oaRun()
    .withSuccessHandler(function (result) {
      if (result.success) {
        showNotification('✅ Order updated! Rev.' + result.revision, 'success');
        loadHistory();
      } else {
        showNotification('❌ ' + result.message, (result.duplicates && result.duplicates.length) ? 'warning' : 'error');
      }
    })
    .withFailureHandler(function (err) {
      showNotification('❌ Update failed: ' + (err.message || ''), 'error');
    })
    .updateOrderQuantity(orderNo, updatedItems, currentUser.userId);
}

function cartRuleErrors() {

function focusFirstBadQty() {

    '</table>' +

function confirmAndSaveOrder() {
  var confirmBtn = document.getElementById('confirmSaveBtn');

  var nameBox = document.getElementById('orderByInput');
  var customerName = nameBox ? nameBox.value.trim() : '';
  if (!customerName) {
    if (nameBox) {
      nameBox.classList.add('needs-input');
      try { nameBox.focus(); } catch (e) { }
      setTimeout(function () { nameBox.classList.remove('needs-input'); }, 2200);
    }
    return;
  }
  orderByName = customerName;

  if (confirmBtn) { confirmBtn.innerHTML = '<span class="loading"></span> Saving...'; confirmBtn.disabled = true; }

  var outlet = currentUser ? currentUser.outletShortName : '';
  var outletFullName = currentUser ? (currentUser.outletFullName || outlet) : '';
  var orderDate = (document.getElementById('orderDate') || {}).value || '';

  var badRule = cartRuleErrors();
  if (badRule.length) {
    closeReviewModal();
    if (confirmBtn) { confirmBtn.innerHTML = '✅ Confirm &amp; Save'; confirmBtn.disabled = false; }
    showNotification(ruleErrorNotice(badRule), 'error');
    focusFirstBadQty();
    return;
  }

  var blocked = [];
  var items = cartList().map(function (it) {
    return {
      code: it.code || '', name: it.name, unit: it.unit || '', qty: Number(it.qty) || 0,
      groupId: it.groupId || ''
    };
  }).filter(function (it) {
    if (!it.name || !(it.qty > 0)) return false;

    if (catalog.loaded && !catalogHas(it.code, it.name)) { blocked.push(it.name); return false; }
    return true;
  });

  if (blocked.length) {
    closeReviewModal();
    pruneCartToCatalog(false);
    if (confirmBtn) { confirmBtn.innerHTML = '✅ Confirm &amp; Save'; confirmBtn.disabled = false; }
    showNotification('⚠️ Not saved — these items are no longer Active: ' +
      blocked.slice(0, 4).join(', ') + (blocked.length > 4 ? '…' : '') + '. Please review the cart.', 'error');
    return;
  }

  if (!items.length) {
    closeReviewModal();
    if (confirmBtn) { confirmBtn.innerHTML = '✅ Confirm &amp; Save'; confirmBtn.disabled = false; }
    showNotification('No items to save', 'warning');
    return;
  }

  var timestamp = formatTimestampDDMMYYYY();
  var totalQty = Math.round(items.reduce(function (s, it) { return s + it.qty; }, 0) * 100) / 100;

  var stockRows = stockList().filter(function (r) {
    if (!r.name || !isFinite(r.qty) || r.qty < 0) return false;
    if (catalog.loaded && !catalogHas(r.code, r.name)) return false;
    return true;
  });

  var orderSummary = {
    orderNo: 'TEMP',
    date: orderDate || timestamp,
    outletShortName: outlet,
    outletFullName: outletFullName,
    items: items,
    closingStock: stockRows,
    totalItems: items.length,
    totalQuantity: totalQty,
    orderedBy: customerName,
    customerName: customerName,
    timestamp: timestamp,
    userId: currentUser.userId,
    userEmail: currentUser.email || ''
  };

  document.getElementById('progressFill').style.width = '40%';

  oaRun()
    .withSuccessHandler(function (response) {
      document.getElementById('progressFill').style.width = '0%';
      closeReviewModal();

      if (response && response.success === false) {
        var btn = document.getElementById('confirmSaveBtn');
        if (btn) { btn.innerHTML = '✅ Confirm &amp; Save'; btn.disabled = false; }
        showNotification('❌ ' + (response.message || 'Order was not saved.'), 'error');

        syncCatalog(false);
        return;
      }

      document.getElementById('progressFill').style.width = '100%';
      showCenteredSuccess(response.orderNo);
      clearForm();
      setTimeout(function () { document.getElementById('progressFill').style.width = '0%'; }, 800);
    })
    .withFailureHandler(function (err) {
      document.getElementById('progressFill').style.width = '0%';
      closeReviewModal();
      showNotification('Error: ' + (err.message || 'Save failed'), 'error');
    })
    .processOrder(orderSummary, { saveToSheet: true });
}

function showCenteredSuccess(orderNo) {
  var existing = document.querySelector('.success-notification');
  if (existing) existing.remove();
  var n = document.createElement('div');
  n.className = 'success-notification';
  n.innerHTML = '<div class="success-icon">✅</div><div class="success-title">Thank you for ordering.</div>' +
    '<div class="success-order-no">' + (orderNo || '') + '</div>' +
    '<button class="oa-btn btn-primary" onclick="this.closest(\'.success-notification\').remove()">OK</button>';
  oaLayer().appendChild(n);
  setTimeout(function () { if (n.parentNode) n.remove(); }, 5000);
}

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function formatDateDisplay(dateStr) {
  if (!dateStr) return '';
  var parts = dateStr.split('-');
  if (parts.length === 3) return parts[2] + '-' + parts[1] + '-' + parts[0];
  return dateStr;
}

function formatTimestampDDMMYYYY() {
  var now = new Date();
  var dd = String(now.getDate()).padStart(2, '0');
  var mm = String(now.getMonth() + 1).padStart(2, '0');
  var yyyy = now.getFullYear();
  var hh = String(now.getHours()).padStart(2, '0');
  var min = String(now.getMinutes()).padStart(2, '0');
  var ss = String(now.getSeconds()).padStart(2, '0');
  return dd + '-' + mm + '-' + yyyy + ' ' + hh + ':' + min + ':' + ss;
}

document.addEventListener('keydown', function (e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    var newTab = document.getElementById('tab-new');
    if (newTab && newTab.classList.contains('active')) showOrderReview();
    var mlTab = document.getElementById('tab-maxlevel');
    if (mlTab && mlTab.classList.contains('active')) saveMaxLevelEntry();
  }
  if (e.key === 'Escape') {
    var hadModal = !!document.getElementById('orderReviewOverlay') || !!document.querySelector('.confirm-dialog') ||
      !!document.getElementById('itemSuggestOverlay');
    closeReviewModal();
    closeDialog();
    closeItemSuggestion();

    if (!hadModal && currentMode === 'stock') {
      var newTab2 = document.getElementById('tab-new');
      if (newTab2 && newTab2.classList.contains('active')) backToItems();
    }
  }
});

function itemsAlreadyOnOrder(orderIdx, exceptInput) {
  var out = {};
  function mark(name, code) {
    if (name) out[skeyName(name)] = name;

    var g = displayItemFor(code, name);
    if (g && g.isGroup) out['G:' + g.groupId] = g.name;
  }
  var order = oaHistoryList[orderIdx];
  if (order && order.items) {
    order.items.forEach(function (it) { if (it && it.name) mark(it.name, it.code); });
  }
  document.querySelectorAll('[data-order-idx="' + orderIdx + '"]').forEach(function (q) {
    var n = q.getAttribute('data-item');
    if (!n) return;
    var row = q.closest('tr');
    if (exceptInput && row && row.contains(exceptInput)) return;
    mark(n, q.getAttribute('data-code') || '');
  });
  return out;
}

function searchHistoryProducts(input) {
  var term = input.value.toLowerCase().trim();
  var sug = input.nextElementSibling;
  sug.innerHTML = '';
  sug.classList.remove('show');

  if (term.length < 2) {
    var tr = input.closest('tr');
    tr.classList.remove('duplicate-row');
    tr.querySelector('.unit-cell').textContent = '—';
    tr.querySelector('.code-cell').textContent = '—';
    var qtyInput = tr.querySelector('.qty-edit-input');
    if (qtyInput) {
      qtyInput.removeAttribute('data-item');
      qtyInput.removeAttribute('data-unit');
      qtyInput.removeAttribute('data-code');
    }
    return;
  }

  var oIdx = input.getAttribute('data-order-row');
  var taken = (oIdx === null) ? {} : itemsAlreadyOnOrder(parseInt(oIdx, 10), input);

  var hiddenDupes = 0;
  var matches = allItems.filter(function (it) {
    if (!it || !it.name) return false;

    if (catalog.loaded && !catalogHas(it.code, it.name)) return false;
    var hit = it.name.toLowerCase().indexOf(term) > -1 ||
      (it.category || '').toLowerCase().indexOf(term) > -1 ||
      (it.code && it.code.toLowerCase().indexOf(term) > -1);
    if (!hit) return false;
    if (taken[skeyName(it.name)]) { hiddenDupes++; return false; }
    if (it.isGroup && taken['G:' + it.groupId]) { hiddenDupes++; return false; }
    return true;
  }).slice(0, 8);

  if (!matches.length) {
    sug.innerHTML = '<div class="suggestion-item"><small>' +
      (hiddenDupes ? 'Already in this order — change the quantity on its own line.' : 'No products found') +
      '</small></div>';
    sug.classList.add('show');
    return;
  }

  matches.forEach(function (item) {
    var div = document.createElement('div');
    div.className = 'suggestion-item';
    var mult = multipleFor(item);
    var mnq = minQtyFor(item);
    div.innerHTML = '<div><strong>' + escHtml(item.name) + '</strong>' +
      (item.isGroup ? ' <span class="oa-chip chip-link">🔗 ' + item.members.length + '</span>' : '') +
      (mult > 1 ? ' <span class="oa-chip chip-mult">× ' + fmtQty(mult) + '</span>' : '') +
      '<br><small>' + escHtml(item.codeLabel || item.code || '') + ' · ' + escHtml(item.category) + '</small></div>' +
      '<span class="suggestion-badge">' + escHtml(item.unit) + '</span>';
    div.onclick = function () {
      input.value = item.name;
      var row = input.closest('tr');
      row.querySelector('.unit-cell').textContent = item.unit;
      row.querySelector('.code-cell').textContent = item.codeLabel || item.code || '—';

      var qtyInput = row.querySelector('.qty-edit-input');
      if (qtyInput) {
        qtyInput.setAttribute('data-item', item.name);
        qtyInput.setAttribute('data-unit', item.unit);

        qtyInput.setAttribute('data-code', item.code || '');
        qtyInput.setAttribute('data-group', item.groupId || '');
        qtyInput.setAttribute('data-multiple', mult || 0);
        qtyInput.setAttribute('data-minqty', mnq || 0);
        if (mult) qtyInput.setAttribute('step', fmtQty(mult));

        if (mult || mnq) qtyInput.value = fmtQty(startQtyFor({ multiple: mult, minQty: mnq }));
        markQtyRule(qtyInput);
        qtyInput.focus();
      }
      row.classList.remove('duplicate-row');
      sug.classList.remove('show');
    };
    sug.appendChild(div);
  });
  sug.classList.add('show');
}

an class=\"fs-icon\"><span class=\"ms\">search</span></span>\n<input type=\"text\" id=\"dispSearch\" placeholder=\"Search order no, outlet or item...\" autocomplete=\"off\" oninput=\"renderDispatch()\">\n</div>\n<select class=\"filter-select\" id=\"dispOutlet\" onchange=\"renderDispatch()\">\n<option value=\"\">All Outlets</option>\n</select>\n<button type=\"button\" class=\"filter-toggle\" id=\"dispPendingBtn\" onclick=\"toggleDispPending()\"><span class=\"ms\">push_pin</span> Only pending</button>\n</div>\n<div id=\"dispatchList\">\n<div class=\"history-loading\"><span class=\"ms\">hourglass_top</span> Loading orders...</div>\n</div>\n</div>\n</div>";
var OA = { root: null, sig: '', pick: '', pickAll: '', tab: 'new', layer: null, top: null, lastErr: null, boot: null, fitBound: false };
var OA_EXTRA = { veg: 1, bill: 1, past: 1 };
var OA_WRITES = { saveStandardQty: 1, saveClosingStock: 1, saveMaxLevel: 1, submitItemRequest: 1, saveDispatchQty: 1, updateOrderQuantity: 1, processOrder: 1 };
var OA_FNS = ['getCatalog', 'getCatalogSignature', 'getAppBootstrap', 'getOrderModeData', 'getStockBoard', 'getMaxLevelBoard', 'getItemRequestData',
  'getOrderHistory', 'getDispatchOrders'].concat(Object.keys(OA_WRITES));

function oaLayer() {
  if (!OA.layer || !document.body.contains(OA.layer)) {
    OA.layer = document.createElement('div');
    OA.layer.className = 'oa oa-layer';
    document.body.appendChild(OA.layer);
  }
  return OA.layer;
}

function oaOn() { return !!(OA.root && document.body.contains(OA.root)); }

function oaRun() {
  var ok = null, bad = null, tok = S.token, pick = OA.pick, r = {
    withSuccessHandler: function (f) { ok = f; return r; },
    withFailureHandler: function (f) { bad = f; return r; }
  };
  OA_FNS.forEach(function (fn) {
    r[fn] = function () {
      var args = Array.prototype.slice.call(arguments);
      api(OA_WRITES[fn] ? 'oa.write' : 'oa.read', { fn: fn, args: args, outlet: pick }).then(function (res) {
        if (S.token !== tok || OA.pick !== pick) return;
        if (ok) ok(res);
      }, function (e) {
        if (S.token !== tok || OA.pick !== pick) return;
        OA.lastErr = { msg: e && e.message ? e.message : String(e), t: Date.now() };
        if (bad) bad(e); else showNotification(OA.lastErr.msg, 'error');
      });
    };
  });
  return r;
}

function showNotification(message, type) {
  var msg = String(message || '');
  if (type === 'error' && OA.lastErr && Date.now() - OA.lastErr.t < 2500) {
    if (msg.indexOf(OA.lastErr.msg) < 0) msg = OA.lastErr.msg;
    OA.lastErr = null;
  }
  msg = msg.replace(/^[\p{Extended_Pictographic}️‍\s]+/u, '');
  toast(msg, type === 'success' ? 'ok' : type === 'error' ? 'bad' : '');
}

function showApp(user) {
  isDispatchUser = !!user.isDispatch;
  canDispatch = isDispatchUser || !!user.canDispatch;
  ['tab-new', 'tab-maxlevel', 'tab-history'].forEach(function (id) {
    var b = document.getElementById(id);
    if (b) b.style.display = isDispatchUser ? 'none' : '';
  });
  var dt = document.getElementById('tab-dispatch');
  if (dt) dt.style.display = canDispatch ? '' : 'none';
  if (isDispatchUser) { switchTab('dispatch'); return; }
  switchTab('new');
  loadAllData();
  initStockFeatures(user);
}

function oaShown(tab) {
  OA.tab = tab;
  var host = document.getElementById('oaHost'), box = document.getElementById('olBox');
  if (host) host.hidden = false;
  if (box) box.hidden = true;
}

function oaShow(tab) {
  if (!OA_EXTRA[tab]) { switchTab(tab); return; }
  OA.tab = tab;
  $$('#ordTabs .tab-btn').forEach(function (b) { b.classList.toggle('active', b.id === 'tab-' + tab); });
  $('#oaHost').hidden = true;
  var box = $('#olBox');
  box.hidden = false;
  if (tab === 'veg') vegOrder(box);
  else if (tab === 'bill') { box.innerHTML = '<div class="card" id="bf"></div>'; billEntryForm($('#bf', box), function () { oaShow('bill'); }); }
  else orderHistory(box);
}

function oaTabs(b) {
  var t = [['new', 'receipt_long', 'New Order'], ['maxlevel', 'height', 'Max Level'], ['stockentry', 'inventory', 'Closing Stock'],
    ['history', 'history', 'Order History', 'historyCount'], ['dispatch', 'local_shipping', 'Dispatch', 'dispatchCount']];
  if (!b.dispatchOnly) t = t.concat([['veg', 'eco', 'Vegetables'], ['bill', 'receipt', 'Bill entry'], ['past', 'manage_search', 'Past orders']]);
  return '<div class="tabs oa-tabs" id="ordTabs">' + t.map(function (x) {
    var hide = (x[0] === 'stockentry') || (x[0] === 'dispatch' && !b.canDispatch) || (b.dispatchOnly && x[0] !== 'dispatch');
    return '<button class="tab tab-btn" id="tab-' + x[0] + '" data-oat="' + x[0] + '"' + (hide ? ' style="display:none"' : '') + '>' + icon(x[1]) + h(x[2]) +
      (x[3] ? '<span class="tab-count" id="' + x[3] + '">0</span>' : '') + '</button>';
  }).join('') + '</div>';
}

function oaFrame(el, b) {
  var pick = S.outlet === 'ALL' && !b.hq && b.picks.length > 1 ? '<select class="inp oa-pick" id="oaPick">' + b.picks.map(function (o) {
    return '<option value="' + h(o.id) + '"' + (o.id === b.pick ? ' selected' : '') + '>' + h(o.name) + '</option>';
  }).join('') + '</select>' : '';
  var sub = b.dispatchOnly ? 'Dispatch · every outlet' : b.user.isAdmin ? 'All outlets · HQ view<span class="oa-hm"> · orders of every outlet, Max Level for any outlet</span>' :
    h(b.user.outletFullName) + '<span class="oa-hm"> · GFP orders, Max Level, vegetables and bill entry</span>';
  el.innerHTML = '<div id="ordWrap">' + pageHead('Orders', sub, pick) + oaTabs(b) + '<div id="oaHost"></div><div id="olBox" hidden></div></div>';
  $$('[data-oat]', el).forEach(function (x) { x.onclick = function () { if (!x.classList.contains('active')) oaShow(x.dataset.oat); }; });
  var sel = $('#oaPick', el);
  if (sel) sel.onchange = function () { OA.pickAll = sel.value; oaMount(el, { outlet: sel.value }); };
}

function oaFit() {
  var c = document.getElementById('appContainer');
  if (!c || !oaOn()) return;
  var top = c.getBoundingClientRect().top + window.scrollY;
  c.style.height = Math.max(window.innerHeight - top - 14, 440) + 'px';
}

function oaBuild() {
  var r = document.createElement('div');
  r.className = 'oa';
  r.innerHTML = '<div class="app-container show" id="appContainer">' + OA_MARKUP + '</div>';
  return r;
}

function oaStart(b) {
  screenEventsBound = false;
  historyRuleEventsBound = false;
  mlData = null; csData = null; obsData = null; oaHistoryList = []; dispatchOrders = [];
  stockOutletInfo = { isHq: false, outlets: [] };
  currentUser = b.user;
  resetScreensForLogout();
  orderByName = b.user.name || '';
  setMinDate();
  showApp(b.user);
  oaFitSoon();
}

function oaFitSoon() {
  oaFit();
  setTimeout(oaFit, 60);
  if (!OA.fitBound) { OA.fitBound = true; window.addEventListener('resize', oaFit); }
}

function oaMount(el, p) {
  p = p || {};
  try { closeReviewModal(); closeDialog(); closeItemSuggestion(); } catch (e) {}
  var top = S.outlet || '', prevTop = OA.top;
  var want = p.outlet || (top && top !== 'ALL' ? top : (OA.pickAll || 'HQ'));
  if (!$('#oaHost', el)) el.innerHTML = pageHead('Orders', '') + '<div class="card">' + loadingHtml('Opening the order screen…') + '</div>';
  var nav = S.nav;
  api('oa.boot', { outlet: want }).catch(function (e) {
    if (want === 'HQ' || want === OA.pickAll) return api('oa.boot', { outlet: '' });
    throw e;
  }).then(function (b) {
    if (S.view !== 'orders' || S.nav !== nav) return;
    var who = S.token + '|' + (S.viewAs ? S.viewAs.uid : '') + '|' + b.user.userId, sig = who + '|' + b.pick;
    var n = OA.root && OA.sig.indexOf(who + '|') === 0 && OA.sig !== sig && !p.sure ? cartTotals().count : 0;
    if (n) {
      var from = OA.boot ? OA.boot.user.outletFullName : 'this outlet';
      return confirmBox('Switch to ' + b.user.outletFullName + '?', 'The ' + n + ' item(s) added to the order for ' + h(from) + ' will be cleared.', 'Switch').then(function (yes) {
        if (yes) return oaMount(el, Object.assign({}, p, { outlet: b.pick, sure: true }));
        if (prevTop !== null && prevTop !== top && $('#outletSel')) { S.outlet = prevTop; $('#outletSel').value = prevTop; try { sset(OUT_KEY, prevTop, true); } catch (e) {} }
        oaMount(el, { outlet: OA.pick, sure: true });
      });
    }
    OA.top = S.outlet || '';
    OA.boot = b;
    oaFrame(el, b);
    var host = $('#oaHost', el);
    if (OA.root && OA.sig === sig) {
      host.appendChild(OA.root);
      oaRestore(b);
      return;
    }
    OA.sig = sig;
    OA.pick = b.pick;
    OA.tab = 'new';
    OA.root = oaBuild();
    host.appendChild(OA.root);
    oaStart(b);
  }).catch(function (e) { if (S.view === 'orders') el.innerHTML = pageHead('Orders') + errHtml(e); });
}

function oaRestore(b) {
  var st = document.getElementById('tab-stockentry');
  if (st) st.style.display = appConfig.SHOW_CLOSING_STOCK_TAB ? '' : 'none';
  var hc = document.getElementById('historyCount'), dc = document.getElementById('dispatchCount');
  if (hc) hc.textContent = oaHistoryList.length;
  if (dc) dc.textContent = dispatchOrders.length;
  var t = OA.tab;
  if (isDispatchUser) t = 'dispatch';
  if (OA_EXTRA[t]) oaShow(t);
  else switchTab(t);
  renderCartBar();
  oaFitSoon();
}
</script>
