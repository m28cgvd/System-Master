<script>
/* =====================================================================
   FMS Summary — step-wise status (done / due / overdue / waiting) of every FMS sheet
   listed in the "FMS Sheets" tab. Admins and MIS see all of them; everyone else sees the
   FMS of their own department (or one that names their designation).
   ===================================================================== */
V.fms = function (el, p) {
  var L = null, dep = p.dep || '', nav = S.nav;
  el.innerHTML = pageHead('FMS Summary', '', '<span id="fmA"></span><button class="btn sm ghost" id="fmR">' + icon('sync') + 'Refresh</button>') +
    '<div id="fmF"></div><div id="fmB">' + loadingHtml() + '</div>';
  var B = $('#fmB', el);
  function alive() { return S.nav === nav && document.body.contains(B); }

  function list(d) {
    L = d;
    $('#fmA', el).innerHTML = d.admin ? '<button class="btn sm" id="fmAdd">' + icon('add') + 'Add FMS</button>' : '';
    if ($('#fmAdd', el)) $('#fmAdd', el).onclick = function () { edit({ active: true }); };
    var all = d.list.filter(function (f) { return f.active || d.admin; });
    var deps = [];
    all.forEach(function (f) { var k = f.department || 'All'; if (deps.indexOf(k) < 0) deps.push(k); });
    $('#fmF', el).innerHTML = deps.length > 1 ? '<div class="row gap6 mb" style="flex-wrap:wrap">' + [''].concat(deps).map(function (k) {
      return '<span class="qf' + (k === dep ? ' on' : '') + '" data-d="' + h(k) + '">' + h(k || 'Every department') + '</span>'; }).join('') + '</div>' : '';
    $$('[data-d]', el).forEach(function (x) { x.onclick = function () { dep = x.dataset.d; S.params.dep = dep; list(L); }; });
    var rows = all.filter(function (f) { return !dep || (f.department || 'All') === dep; });
    if (!rows.length) { B.innerHTML = '<div class="card">' + emptyHtml('account_tree', 'No FMS is set up for your department yet.') + '</div>'; return; }
    B.innerHTML = rows.map(function (f) {
      return '<div class="card mb" data-f="' + h(f.id) + '"><div class="row" style="flex-wrap:wrap;gap:6px"><h3 class="grow" style="margin:0">' + icon('account_tree') + ' ' + h(f.name) + '</h3>' +
        chip(f.department || 'All departments', 'blue') + (f.active ? '' : chip('switched off', 'grey')) +
        (d.admin ? '<button class="icon-btn" data-e="' + h(f.id) + '" title="Edit">' + icon('edit') + '</button>' : '') + '</div>' +
        (f.designations && f.designations.length ? '<div class="tiny muted">Also for: ' + h(f.designations.join(', ')) + '</div>' : '') +
        '<div data-body class="mt">' + loadingHtml('Reading the sheet…') + '</div></div>';
    }).join('');
    $$('[data-e]', B).forEach(function (x) { x.onclick = function () { edit(L.list.filter(function (f) { return f.id === x.dataset.e; })[0]); }; });
    rows.forEach(function (f) { one(f); });
  }
  function box(id) { var c = $('[data-f="' + id + '"]', B); return c ? $('[data-body]', c) : null; }
  function one(f) {
    if (!f.hasSheet) { var b0 = box(f.id); if (b0) b0.innerHTML = '<div class="small muted">' + icon('link_off') + ' No sheet is linked yet' + (L.admin ? ' — tap ✏️ and paste its link.' : ' — MIS will add it.') + '</div>'; return; }
    live('fms.load', { id: f.id }, function (d) { var b = box(f.id); if (b) { b.innerHTML = body(d); bindDone(b, f); } }, { alive: alive })
      .catch(function (e) { var b = box(f.id); if (b) b.innerHTML = errHtml(e); });
  }
  function bindDone(b, f) {
    $$('[data-done]', b).forEach(function (bt) {
      bt.onclick = function () {
        var k = bt.dataset.done.split('|'), tr = bt.closest('tr');
        busy(bt, true, '…');
        api('fms.done', { id: k[0], tab: k[1], row: +k[2], step: +k[3] }).then(function (r) {
          toast(r.message, 'ok'); if (tr) tr.remove();
          api('fms.load', { id: f.id, force: true }).then(function (d) { dcSet(dcKey('fms.load', { id: f.id }), d); var x = box(f.id); if (x) { x.innerHTML = body(d); bindDone(x, f); } }).catch(function () {});
        }).catch(function (e) { busy(bt, false); toast(e.message, 'bad'); });
      };
    });
  }
  function body(d) {
    if (d.note) return '<div class="small muted">' + h(d.note) + '</div>';
    return (d.tabs || []).map(function (t) {
      if (t.error) return '<div class="warn mb">' + icon('error') + ' ' + h(t.tab) + ': ' + h(t.error) + '</div>';
      return ((d.tabs.length > 1) ? '<div class="section-title" style="margin-top:6px">' + h(t.tab) + '</div>' : '') +
        '<div class="row gap6 mb" style="flex-wrap:wrap">' + chip(num(t.total) + ' rows', '') + chip(num(t.open) + ' open', 'orange') + chip(num(t.overdue) + ' overdue', t.overdue ? 'red' : 'grey') +
        chip(num(t.complete) + ' complete', 'green') + chip(num(t.recent) + ' in the last 30 days', 'blue') + (t.excel ? chip('Excel file — slower', 'grey') : '') + '</div>' +
        fmsStepsHtml(t.steps) +
        ((t.todo || []).length ? '<details class="mt"' + (p.open ? ' open' : '') + '><summary class="small b" style="cursor:pointer;color:var(--brown)">' + icon('task_alt') + ' Tasks waiting (' + t.todo.length + ')' + (t.canDo ? ' — mark them done here' : '') + '</summary><div class="mt">' +
          tableHtml([{ t: 'Row', f: function (x) { return '<b>' + h(x.label || ('Row ' + x.row)) + '</b>'; } }, { t: 'Step', f: function (x) { return '<span class="small">' + x.stepN + '. ' + h(x.step) + '</span>'; } },
            { t: 'Planned', f: function (x) { return '<span class="nowrap small">' + h(x.planned) + '</span>' + (x.late ? '<div class="tiny" style="color:var(--red)">late ' + h(x.late) + '</div>' : ''); } },
            { t: '', f: function (x, i) { return t.canDo ? '<button class="btn sm green" data-done="' + h(d.id) + '|' + h(t.tab) + '|' + x.row + '|' + x.stepN + '">' + icon('check') + 'Done</button>' : ''; } }], t.todo, { max: '46vh' }) + '</div></details>' : '');
    }).join('') + '<div class="tiny muted mt">Read ' + h(d.at || '') + '' + (d.url ? ' · <a href="' + h(d.url) + '" target="_blank">open the sheet</a>' : '') + '</div>';
  }
  function edit(f) {
    var depts = (L.departments || []).slice(); if (depts.indexOf('All') < 0) depts.unshift('All');
    if (f.department && depts.indexOf(f.department) < 0) depts.push(f.department);
    modal({ title: f.id ? 'Edit ' + f.name : 'Add an FMS', body:
      '<div class="field"><label>FMS name</label><input class="inp" data-k="name" value="' + h(f.name || '') + '"></div>' +
      '<div class="field"><label>Google Sheet link or ID</label><input class="inp" data-k="link" value="' + h(f.link || '') + '" placeholder="https://docs.google.com/spreadsheets/d/…"></div>' +
      '<div class="field"><label>Tabs to summarise <span class="muted">(comma separated — blank = first tab)</span></label><input class="inp" data-k="tabs" value="' + h((f.tabs || []).join(', ')) + '"></div>' +
      '<div class="form-grid"><div class="field"><label>Department that sees it</label><select class="inp" data-k="department">' + depts.map(function (x) { return '<option' + (x === (f.department || 'All') ? ' selected' : '') + '>' + h(x) + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label>Status</label><select class="inp" data-k="active"><option value="1"' + (f.active !== false ? ' selected' : '') + '>Active</option><option value="0"' + (f.active === false ? ' selected' : '') + '>Switched off</option></select></div></div>' +
      '<div class="field"><label>Also for designations <span class="muted">(comma separated — e.g. Store Incharge, Store Head)</span></label><input class="inp" data-k="designations" value="' + h((f.designations || []).join(', ')) + '"></div>' +
      '<div class="field"><label>Notes</label><input class="inp" data-k="notes" value="' + h(f.notes || '') + '"></div>' +
      '',
      actions: [{ label: 'Cancel', cls: 'ghost' }, { label: icon('save') + 'Save', cls: 'green', click: function (close, m, btn) {
        var g = function (k) { return val('[data-k="' + k + '"]', m); };
        if (!g('name')) return toast('Enter the FMS name.', 'bad');
        busy(btn, true);
        api('fms.save', { id: f.id || '', name: g('name'), link: g('link'), tabs: g('tabs'), department: g('department'), designations: g('designations'), notes: g('notes'), active: g('active') === '1' })
          .then(function (r) { close(); toast(r.message, 'ok'); dcSet(dcKey('fms.list', {}), r.view); list(r.view); })
          .catch(function (e) { busy(btn, false); toast(e.message, 'bad'); });
      } }] });
  }
  $('#fmR', el).onclick = function () {
    if (!L) return;
    var btn = this; busy(btn, true, 'Refreshing…');
    var jobs = L.list.filter(function (f) { return f.hasSheet && (f.active || L.admin) && (!dep || (f.department || 'All') === dep); }).map(function (f) {
      var b = box(f.id); if (b) b.innerHTML = loadingHtml('Reading the sheet…');
      return api('fms.load', { id: f.id, force: true }).then(function (d) { dcSet(dcKey('fms.load', { id: f.id }), d); var x = box(f.id); if (x) { x.innerHTML = body(d); bindDone(x, f); } })
        .catch(function (e) { var x = box(f.id); if (x) x.innerHTML = errHtml(e); });
    });
    Promise.all(jobs).then(function () { busy(btn, false); });
  };
  live('fms.list', {}, list, { alive: alive }).catch(function (e) { B.innerHTML = errHtml(e); });
};
</script>
