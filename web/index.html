<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#FBF6EE">
<title>Chai Govindam</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,450,0..1,0&display=block" rel="stylesheet">
<style>
:root{
  --brown:#6B3F1C;--brown2:#8B5A2B;--brown3:#A9774A;--amber:#F8AF03;--amber2:#FFE3A1;--cream:#FFF8EC;--cream2:#F4C97E;
  --ink:#2B1D12;--muted:#7A6A5D;--line:#EADBC8;--bg:#FBF6EE;--card:#FFFFFF;
  --green:#2E9E57;--green2:#E3F5EA;--red:#D64545;--red2:#FDE8E8;--blue:#2F6FDE;--blue2:#E6EEFD;--violet:#7B4FD6;--violet2:#EFE8FC;
  --orange:#E07B12;--orange2:#FDEFD9;--r:14px;--shadow:0 1px 2px rgba(60,35,10,.06),0 4px 16px rgba(60,35,10,.06);
  --side:260px;--top:60px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:14px/1.45 'Inter','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brown2)}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 450,'GRAD' 0,'opsz' 24;vertical-align:middle;user-select:none}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 450,'GRAD' 0,'opsz' 24}
.hide{display:none!important}
.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}.b{font-weight:600}.nowrap{white-space:nowrap}
.hi{font-family:'Noto Sans Devanagari','Inter',sans-serif}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1 1 auto;min-width:0}.col{display:flex;flex-direction:column;gap:6px}
.right{margin-left:auto}.center{text-align:center}.mt{margin-top:14px}.mb{margin-bottom:14px}.mt0{margin-top:0}.gap6{gap:6px}

/* ---------- boot / login ---------- */
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brown);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(1200px 600px at 10% -10%,#FCE7B8 0,transparent 60%),radial-gradient(900px 500px at 110% 110%,#F2D6B6 0,transparent 55%),var(--bg)}
.login-card{width:100%;max-width:400px;background:var(--card);border-radius:22px;box-shadow:0 10px 40px rgba(60,35,10,.14);padding:30px 26px 22px;border:1px solid var(--line)}
.login-card .logo{display:block;height:74px;margin:0 auto 6px;object-fit:contain}
.login-card .logo-crop{height:80px;overflow:hidden;width:max-content;max-width:100%;margin:0 auto 12px}
.login-card .logo-crop img{height:98px;display:block;max-width:none}
.login-card h1{margin:4px 0 2px;text-align:center;font-size:22px;color:var(--brown)}
.login-card p.sub{margin:0 0 20px;text-align:center;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.2px}
.inp,select.inp,textarea.inp{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;outline:none;transition:border .15s,box-shadow .15s;min-height:42px}
.inp:focus{border-color:var(--brown3);box-shadow:0 0 0 3px rgba(169,119,74,.15)}
textarea.inp{min-height:76px;resize:vertical}
.inp.sm{min-height:34px;padding:6px 9px;border-radius:9px}
.pw{position:relative}.pw .inp{padding-right:44px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.check input{width:18px;height:18px;accent-color:var(--brown)}
.err{background:var(--red2);color:#9b1c1c;border-radius:10px;padding:9px 12px;margin-bottom:12px;font-size:13px;white-space:pre-line}
.foot{text-align:center;margin-top:16px;font-size:12px;color:var(--muted)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:11px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--brown);color:#fff;min-height:40px;transition:filter .15s,transform .05s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.block{width:100%}.btn.sm{padding:6px 11px;min-height:32px;font-size:13px;border-radius:9px}
.btn.ghost{background:#fff;color:var(--brown);border:1.5px solid var(--line)}
.btn.amber{background:var(--amber);color:#3b2605}.btn.green{background:var(--green)}.btn.red{background:var(--red)}
.btn.soft{background:var(--cream);color:var(--brown);border:1px solid var(--line)}
.btn .ms{font-size:19px}
.icon-btn{border:0;background:none;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn:hover{background:rgba(107,63,28,.08)}

/* ---------- shell ---------- */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--top);background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;z-index:30}
.topbar .logo{height:36px;width:36px;flex:0 0 auto;display:block;overflow:hidden;border-radius:9px}.topbar .logo img{width:100%;height:100%;object-fit:contain;display:block}
.topbar .logo.crop{position:relative}.topbar .logo.crop img{position:absolute;width:auto;height:84px;max-width:none;left:50%;top:0;transform:translateX(-50%)}
.login-mark{display:block;width:84px;height:84px;margin:0 auto 10px;overflow:hidden;border-radius:18px}.login-mark img{width:100%;height:100%;object-fit:contain;display:block}
.login-mark.crop{position:relative}.login-mark.crop img{position:absolute;width:auto;height:194px;max-width:none;left:50%;top:0;transform:translateX(-50%)}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0;flex:1 1 auto;overflow:hidden}
.brand b{font-size:15px;color:var(--brown);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.top-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex:0 0 auto;min-width:0}
@media (max-width:560px){.topbar{gap:6px;padding:0 8px}.brand b{display:none}.brand small{font-size:13px;font-weight:600;color:var(--brown);max-width:30vw}.outlet-pick{max-width:36vw;padding:6px 6px;font-size:14px}.top-right{gap:4px}.topbar .icon-btn{width:34px;height:34px}}
@media (max-width:380px){.brand small{display:none}}
.outlet-pick{border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--cream);font-weight:600;color:var(--brown);max-width:170px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--brown);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;cursor:pointer;border:2px solid var(--amber2)}
.sidebar{position:fixed;top:var(--top);bottom:0;left:0;width:var(--side);background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:10px 10px 30px;z-index:25;transition:transform .22s ease}
.nav-group{margin:12px 8px 4px;font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:#B29C86}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:11px;cursor:pointer;color:#4A3527;font-weight:500;margin:1px 0;text-decoration:none}
.nav-item:hover{background:var(--cream)}
.nav-item.active{background:var(--brown);color:#fff}
.nav-item.active .ms{color:var(--amber)}
.nav-item .ms{font-size:21px;color:var(--brown3)}
.nav-item .badge{margin-left:auto;background:var(--amber);color:#3b2605;border-radius:20px;font-size:11px;font-weight:700;padding:1px 7px}
.nav-item .soon{margin-left:auto;font-size:10px;background:var(--line);color:var(--muted);border-radius:20px;padding:1px 7px}
.content{margin-left:var(--side);padding:calc(var(--top) + 18px) 22px 60px;transition:margin .22s ease;min-height:100vh}
body.nav-hidden .sidebar{transform:translateX(-100%)}
body.nav-hidden .content{margin-left:0}
.backdrop{display:none}
@media (max-width:900px){
  .content{margin-left:0;padding:calc(var(--top) + 12px) 12px 70px}
  .sidebar{transform:translateX(-100%);width:min(84vw,300px)}
  body.nav-open .sidebar{transform:none;box-shadow:0 10px 40px rgba(0,0,0,.2)}
  body.nav-open .backdrop{display:block;position:fixed;inset:var(--top) 0 0 0;background:rgba(30,18,8,.35);z-index:20}
  .brand small{max-width:38vw}
}

/* ---------- page ---------- */
.page-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head h2{margin:0;font-size:21px;color:var(--ink)}
.page-head .sub{color:var(--muted);margin-top:2px}
.page-head .back-btn{flex:none;width:36px;height:36px;margin:-3px -4px 0 -8px;background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(60,30,10,.06)}
.backbar{margin:-4px 0 10px}.backbar .back-btn{width:36px;height:36px;background:#fff;border:1px solid var(--line)}
#view:has(.crumb > button:first-child) .page-head .back-btn,#view:has(.crumb > button:first-child) .backbar{display:none}
.dtodo .r{align-items:center}.dtodo .r .btn{flex:none}.dtodo h3 .n{font-size:12px;background:var(--orange2);color:var(--orange);border-radius:10px;padding:1px 8px;margin-left:6px;font-weight:700}
.tpick{display:inline-flex;align-items:center;gap:4px}.tpick select{width:auto;min-width:58px;padding-right:22px}.tpick b{color:var(--muted)}
.dash-cards.dhire{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.dhire .dcard{padding:14px;gap:10px;min-height:92px}.dhire .dc-ic{width:40px;height:40px;border-radius:12px}.dhire .dc-ic .ms{font-size:22px}.dhire .dcard > .ms:last-child{display:none}
@media (max-width:1180px){.dash-cards.dhire{grid-template-columns:repeat(3,minmax(0,1fr))}}@media (max-width:600px){.dash-cards.dhire{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.dhire .dcard{padding:12px;min-height:0}.dhire .dc-ic{width:34px;height:34px;border-radius:10px}.dhire .dc-ic .ms{font-size:19px}.dhire .dc-l{font-size:12px}}
.bulkbar{position:sticky;bottom:10px;z-index:5;display:flex;gap:10px;align-items:center;background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;margin-top:12px;box-shadow:0 10px 30px rgba(0,0,0,.18)}.bulkbar .grow{font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card h3{margin:0 0 10px;font-size:15px}
.card + .card{margin-top:14px}
.grid > .card + .card,.grid > .card{margin-top:0}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.g3,.g2{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}

.dash-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.dcard{display:flex;align-items:center;gap:14px;text-align:left;padding:18px;border:1px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;box-shadow:var(--shadow);transition:border-color .12s,transform .12s;min-height:104px;min-width:0;width:100%;font:inherit;color:inherit}
.dcard:hover{border-color:var(--cream2);transform:translateY(-1px)}.dcard > .ms:last-child{color:var(--muted);transition:transform .15s}.dcard.open > .ms:last-child{transform:rotate(180deg)}
.dc-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto;color:#fff}.dc-ic .ms{font-size:26px}
.dc-ic.c1{background:linear-gradient(135deg,#6B3F1C,#A9774A)}.dc-ic.c2{background:linear-gradient(135deg,#2F6FDE,#6C9BF0)}.dc-ic.c3{background:linear-gradient(135deg,#D97706,#F8AF03)}.dc-ic.c4{background:linear-gradient(135deg,#7B4FD6,#A98AEB)}.dc-ic.c5{background:linear-gradient(135deg,#C62828,#EF5350)}
.dc-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}.dc-l{font-weight:600;color:var(--muted);font-size:13px}
.dc-v{font-size:30px;font-weight:800;line-height:1.1}.dc-v .shimmer{display:block;height:30px;width:56px;border-radius:8px;background:var(--cream);animation:pulse 1.2s infinite}
.dc-s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.qa-row{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;transition:border-color .12s;min-width:0;width:100%;font:inherit;color:inherit}
.qa-row:hover{border-color:var(--cream2);background:#FFFCF6}.qa-row > .ms:last-child{color:var(--muted);margin-left:auto}
.qa-ic{width:38px;height:38px;border-radius:11px;background:var(--cream);color:var(--brown);display:grid;place-items:center;flex:0 0 auto}
.qa-t{display:flex;flex-direction:column;min-width:0}.qa-t b{font-size:14px}.qa-t span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal .qa{grid-template-columns:1fr}
@media (max-width:1100px){.qa{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.dash-cards{grid-template-columns:minmax(0,1fr);gap:10px}.dcard{min-height:0;padding:14px}.dc-v{font-size:26px}.qa{grid-template-columns:minmax(0,1fr);gap:8px}.qa-row{padding:11px 12px}}
.rows{display:flex;flex-direction:column}.rows .r{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}.rows .r:last-child{border-bottom:0}.rows .r:hover{background:#FFFCF6}

.hcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.hcard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:15px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;box-shadow:var(--shadow);transition:border-color .12s,transform .12s;position:relative;min-height:96px}
.hcard:hover{border-color:var(--cream2);transform:translateY(-1px)}.hcard.on{border-color:var(--brown);box-shadow:0 0 0 1px var(--brown) inset}
.hcard.static{cursor:default}.hcard.static:hover{transform:none;border-color:var(--line)}
.hcard .hc-top{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600;font-size:13px}.hcard .hc-top .ms{font-size:20px;color:var(--brown3)}
.hcard .hc-v{font-size:26px;font-weight:800;line-height:1.15}.hcard .hc-s{font-size:12px;color:var(--muted)}
.hcard .hc-badge{position:absolute;right:12px;top:12px}
@media (max-width:600px){.hcards{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.hcard{padding:12px;min-height:84px}.hcard .hc-v{font-size:22px}}
.crumb{display:flex;align-items:center;gap:8px;margin:2px 0 12px;flex-wrap:wrap}.crumb .btn{padding-left:8px}
.fbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:12px}
.fbar .ff{display:flex;flex-direction:column;gap:3px}.fbar .ff label{font-size:11.5px;color:var(--muted);font-weight:600}.fbar .grow{flex:1 1 auto}
@media (max-width:600px){.fbar{gap:8px;padding:10px}.fbar .ff{flex:1 1 45%}.fbar .ff .inp{width:100%}}
.recs{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.rec{border-bottom:1px solid var(--line)}.rec:last-child{border-bottom:0}
.rec-h{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer}.rec-h:hover{background:#FFFCF6}
.rec-h .rc{width:18px;height:18px;flex:0 0 auto;accent-color:var(--brown)}
.rec-h .rm{flex:1 1 auto;min-width:0}.rec-h .rm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-h .rm .tiny{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-h .rr{display:flex;align-items:center;gap:8px;flex:0 0 auto;text-align:right}
.rec-h .rx{color:var(--muted);transition:transform .15s}.rec.open .rec-h .rx{transform:rotate(180deg)}
.rec-b{display:none;padding:4px 14px 14px 42px;background:#FFFCF6}.rec.open .rec-b{display:block}.rec.nock .rec-b{padding-left:14px}
.rec-b .kv{margin:6px 0 10px}
@media (max-width:600px){.rec-h{padding:10px 11px;gap:8px}.rec-b{padding:4px 11px 12px}.rec-h .rr .hide-m{display:none}}
.bulk{position:sticky;bottom:10px;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;margin-top:12px;border-radius:14px;background:var(--ink);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.bulk .inp{background:#fff;color:var(--ink)}

.ck-score{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.ck-sh{display:flex;align-items:center;justify-content:flex-start;text-align:left;gap:8px;margin-bottom:10px;color:var(--brown)}.ck-sh b{flex:0 1 auto}.ck-sh b{font-size:14px}.ck-sh > span:last-child{margin-left:auto;font-size:12px;color:var(--muted)}
.ck-sl+.ck-sl{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}.ck-sn{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.ck-sm{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.ck-m{border-radius:12px;padding:10px 12px;background:var(--cream);display:flex;flex-direction:column;gap:2px;min-width:0}
.ck-m b{font-size:22px;line-height:1.1}.ck-m span{font-size:12px;color:var(--muted)}
.ck-m.t-good{background:#EAF7EE}.ck-m.t-good b{color:#1E7B3C}.ck-m.t-warn{background:#FFF4E0}.ck-m.t-warn b{color:#B45309}.ck-m.t-bad{background:#FDECEC}.ck-m.t-bad b{color:#B42318}
.ck-sx{font-size:12px;color:var(--muted);margin-top:6px}
.ck-seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--cream);border-radius:12px;padding:4px;margin-bottom:12px}
.ck-seg button{border:0;background:transparent;border-radius:9px;padding:9px 4px;font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.ck-seg button em{font-style:normal;font-size:12px;background:#fff;border-radius:10px;padding:1px 7px;color:var(--brown)}
.ck-seg button.on{background:#fff;color:var(--brown);box-shadow:0 1px 3px rgba(0,0,0,.08)}.ck-seg button.on em{background:var(--brown);color:#fff}
.ck-r{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}.ck-r:last-child{border-bottom:0}.ck-r:hover{background:#FFFCF6}
.ck-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}.ck-dot.d-ok{background:var(--green)}.ck-r.done .ck-t b{color:var(--muted);font-weight:500}.ck-dot.d-bad{background:var(--red)}.ck-dot.d-warn{background:#F59E0B}.ck-dot.d-up{background:#93A3B8}
.ck-t{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}.ck-t b{font-size:14px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  function fallback() { var a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); toast('Copied', 'ok'); } catch (x) {} a.remove(); }
}

/* ---------------- files: camera / upload / view ---------------- */
function readB64(file) {
  return new Promise(function (res, rej) {
    var r = new FileReader();
    r.onload = function () { res(String(r.result).split(',')[1]); };
    r.onerror = function () { rej(new Error('Could not read the file.')); };
    r.readAsDataURL(file);
  });
}
function shrinkImage(file, max, q) {
  return new Promise(function (res) {
    if (!/^image\//.test(file.type) || /gif|svg/.test(file.type)) return readB64(file).then(function (d) { res({ data: d, mime: file.type || 'application/octet-stream', name: file.name }); });
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var w = img.naturalWidth, hgt = img.naturalHeight, s = Math.min(1, (max || 1600) / Math.max(w, hgt));
      var c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(hgt * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res({ data: c.toDataURL('image/jpeg', q || 0.8).split(',')[1], mime: 'image/jpeg', name: (file.name || 'photo').replace(/\.\w+$/, '') + '.jpg' });
    };
    img.onerror = function () { URL.revokeObjectURL(url); readB64(file).then(function (d) { res({ data: d, mime: file.type, name: file.name }); }); };
    img.src = url;
  });
}
/** A camera + upload box. Returns { get() → {fileId,name,mime} | null, busy() } */
function filePicker(box, module, opt) {
  opt = opt || {};
  var st = { file: null, busy: false };
  box.className = 'file-box';
  box.innerHTML = '<div class="grow"><div class="b small">' + h(opt.label || 'Photo / document') + (opt.required ? ' *' : '') + '</div>' +
    '<div class="small muted" data-st>' + h(opt.hint || 'Take a photo or upload from this device') + '</div></div>' +
    '<label class="btn sm soft">' + icon('photo_camera') + 'Camera<input type="file" accept="image/*" capture="environment" hidden></label>' +
    '<label class="btn sm ghost">' + icon('upload') + 'Upload<input type="file" accept="' + (opt.accept || 'image/*,application/pdf') + '" hidden></label>';
  $$('input[type=file]', box).forEach(function (inp) {
    inp.onchange = function () {
      var f = inp.files && inp.files[0]; if (!f) return;
      st.busy = true; st.file = null;
      $('[data-st]', box).innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px;display:inline-block;vertical-align:middle"></span> Uploading ' + h(f.name) + '…';
      shrinkImage(f, 1600, 0.8).then(function (p) {
        return api('file.upload', { module: module, name: p.name, mime: p.mime, data: p.data }).then(function (r) {
          st.file = r; st.busy = false;
          var prev = /^image\//.test(p.mime) ? '<img src="data:' + p.mime + ';base64,' + p.data + '">' : icon('description');
          var img = $('img', box); if (img) img.remove();
          box.insertAdjacentHTML('afterbegin', /^image\//.test(p.mime) ? prev : '');
          $('[data-st]', box).innerHTML = '<span style="color:var(--green)">✓ Attached</span> · ' + h(r.name);
          if (opt.onDone) opt.onDone(r);
        });
      }).catch(function (e) { st.busy = false; $('[data-st]', box).innerHTML = '<span style="color:var(--red)">' + h(e.message) + '</span>'; });
      inp.value = '';

}
function viewFile(module, id, title) {
  var m = modal({ title: title || 'Document', wide: true, body: loadingHtml('Opening…') });
  api('file.view', { module: module, id: id }).then(function (f) {
    var b = $('.modal-b', m.el), link = f.url ? '<p class="small center mt"><a href="' + h(f.url) + '" target="_blank">Open in Google Drive</a></p>' : '';
    if (!f.data) { b.innerHTML = '<div class="empty">' + icon('description') + 'This file is large.' + link + '</div>'; return; }
    if (/^image\//.test(f.mime)) b.innerHTML = '<div class="viewer"><img src="data:' + f.mime + ';base64,' + f.data + '"></div>' + link;
    else if (f.mime === 'application/pdf') {
      var bin = atob(f.data), arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));
      b.innerHTML = '<div class="viewer"><iframe src="' + url + '"></iframe></div><p class="small center mt"><a href="' + url + '" download="' + h(f.name) + '.pdf">Download</a>' + (f.url ? ' · <a href="' + h(f.url) + '" target="_blank">Open in Drive</a>' : '') + '</p>';
    } else b.innerHTML = '<div class="empty">' + icon('description') + h(f.name) + '<p><a class="btn sm" download="' + h(f.name) + '" href="data:' + f.mime + ';base64,' + f.data + '">Download</a></p>' + link + '</div>';
  }).catch(function (e) { $('.modal-b', m.el).innerHTML = errHtml(e); });
}

/* ---------------- sign in ---------------- */
function boot() {
  S.token = loadToken();
  if (!S.token) { dcClear(); $('#boot').classList.add('hide'); return showLogin(); }   // an ended sign-in leaves nothing behind
  S.persist = !!(ls() && ls().getItem(TOKEN_KEY));
  var cb = bootGet();
  if (cb) { $('#boot').classList.add('hide'); startApp(cb, true); }         // instant: last shell for this sign-in
  api('auth.resume', { dash: !cb, outlet: sget(OUT_KEY) }).then(function (b) {
    takeDash(b); bootSet(b);
    if (cb) refreshBoot(b); else { $('#boot').classList.add('hide'); startApp(b); }
  }).catch(function (e) {
    if (cb && !/session|sign in/i.test(e.message)) { toast('Offline? Showing the last copy — ' + e.message, 'bad'); return; }
    sdel(TOKEN_KEY); S.token = null; dcClear(); $('#boot').classList.add('hide'); showLogin();
  });
}
/** Sign-in / resume bring the dashboard along (one call instead of two) — kept aside for V.dashboard. */
function takeDash(b) { S.bootDash = (b && b.dash) || null; if (b) delete b.dash; }
function bootSet(b) { try { var st = dcStore(); st && st.setItem('cg1_boot', JSON.stringify({ tk: String(S.token).slice(-16), b: b })); } catch (e) {} }
function bootGet() {
  try { var st = dcStore(), raw = st && st.getItem('cg1_boot'), o = raw ? JSON.parse(raw) : null; return o && o.tk === String(S.token).slice(-16) ? o.b : null; } catch (e) { return null; }
}
/** The server's bootstrap after an instant start: redraw the shell only when the menu or outlets changed. */
function refreshBoot(b) {
  var sig = function (x) { return JSON.stringify([x.menu, x.outlets, x.user.title, x.perms]); };
  if (!S.boot || sig(S.boot) !== sig(b)) { var v = S.view, p = S.params; startApp(b, true); if (v && b.menu.some(function (m) { return m.key === v; })) go(v, p); }
  else S.boot = b;
}

/* ---------------- the shell ---------------- */

    '<button class="icon-btn" id="refreshBtn" title="Refresh">' + icon('refresh') + '</button>' +
    '<div class="avatar" id="meBtn" title="' + h(b.user.name) + '">' + h(b.user.initials || '?') + '</div></div></header>' +
    (S.viewAs ? '<div class="evbar">' + icon('visibility') + '<span class="grow">Viewing <b>' + h(S.viewAs.name) + '</b>\'s screens · view only</span><button class="btn sm" id="evExit">' + icon('close') + 'Exit</button></div>' : '') +
    '<aside class="sidebar" id="side">' + navHtml() + '</aside><div class="backdrop" id="backdrop"></div>' +
    '<main class="content"><div id="view"></div></main>';

    $('#outletSel').onchange = function () { S.outlet = this.value; sset(OUT_KEY, S.outlet, true); S.cache = {}; S.prefetched = null; go(S.view, S.params); setTimeout(prefetchData, 2500); };
  }
  $('#navBtn').onclick = toggleNav;
  $('#backdrop').onclick = function () { document.body.classList.remove('nav-open'); };

  $('#meBtn').onclick = meMenu;
  S.hist = [];

    S.backWired = true;
    document.addEventListener('click', function (e) { var b = e.target.closest && e.target.closest('[data-pageback]'); if (b) { e.preventDefault(); goBack(); } });
    new MutationObserver(function () { if (!S.addingBack) { S.addingBack = true; try { addBack(); } finally { S.addingBack = false; } } }).observe($('#app'), { childList: true, subtree: true });

        if (!S.token || !S.boot) return;
        if ($('.modal-bg')) { $$('.modal-bg').forEach(function (m) { m.remove(); }); try { history.pushState({ cg: 1 }, ''); } catch (e) {} return; }

function go(view, params, how) {

  if (!m) { view = S.boot.menu[0].key; m = S.boot.menu[0]; }
  if (how !== 'back' && S.view && (S.view !== view || JSON.stringify(S.params || {}) !== JSON.stringify(params || {}))) {
    S.hist = S.hist || []; S.hist.push({ v: S.view, p: S.params }); if (S.hist.length > 40) S.hist.shift();
  }
  if (view === homeView()) S.hist = [];
  S.view = view; S.params = params || {}; S.nav = (S.nav || 0) + 1;
  dropFreshChip();
  $$('.nav-item').forEach(function (a) { a.classList.toggle('active', a.dataset.view === view || a.dataset.view === m.parent); });
  document.body.classList.remove('nav-open');
  var el = $('#view');
  window.scrollTo(0, 0);
  if (m.soon) { el.innerHTML = pageHead(m.name) + '<div class="card">' + emptyHtml('hourglass_top', m.name + ' is coming soon.') + '</div>'; return; }
  var fn = V[view];
  if (!fn && BUNDLE_OF[view]) {
    el.innerHTML = pageHead(m.name) + '<div class="card">' + loadingHtml('Opening ' + m.name + '…') + '</div>';
    var want = view, wantParams = S.params;

      .catch(function (e) { if (S.view === want) el.innerHTML = pageHead(m.name) + errHtml(e); });
    return;
  }
  if (!fn) { el.innerHTML = pageHead(m.name) + '<div class="card">' + emptyHtml('construction', 'This section is being prepared.') + '</div>'; return; }
  try { fn(el, S.params); } catch (e) { el.innerHTML = errHtml(e); }
  addBack();
  S.fresh = false;
}

/**
 * The dashboard in ONE request (the server answers what it has within ~2.5 s and the page asks again

  // came with the sign-in a moment ago: draw it, ask only for what was not ready yet
  if (pre && pre.data && pre.outletId === S.outlet && JSON.stringify(pre.parts) === JSON.stringify(parts)) {
    var pend = pre.data._pending; delete pre.data._pending;
    merged = pre.data; paint(merged);

      Object.keys(d).forEach(function (p) { merged[p] = d[p]; });

function chkScoreTone(v) { return v >= -5 ? 't-good' : v >= -20 ? 't-warn' : 't-bad'; }
function chkPct(v) { var r = Math.round(v * 10) / 10; return (r === 0 ? '0' : r.toFixed(1)) + '%'; }
function chkScores(body) {
  var D = null, st = { id: '', week: '', doer: '' };
  body.innerHTML = loadingHtml('Working out the scores…');
  live('chk.scores', { weeks: 8 }, function (d) { D = d; if (body.dataset.tab === 'scores') paint(); }, { alive: function () { return body.dataset.tab === 'scores'; } })
    .catch(function (e) { body.innerHTML = errHtml(e); });
  function wkLabel(w) { return w ? fmtISO(w.from).slice(0, 5) + ' – ' + fmtISO(w.to).slice(0, 5) : ''; }
  function sum(rows) {
    var p = 0, dn = 0, ot = 0; rows.forEach(function (x) { p += x.plan; dn += x.done; ot += x.onTime; });
    return p ? { plan: p, done: dn, onTime: ot, nd: dn / p * 100 - 100, ot: ot / p * 100 - 100 } : null;
  }
  function metric(x) {
    return '<div class="ck-sm"><div class="ck-m ' + chkScoreTone(x.nd) + '"><b>' + chkPct(x.nd) + '</b><span>% work not done</span></div>' +
      '<div class="ck-m ' + chkScoreTone(x.ot) + '"><b>' + chkPct(x.ot) + '</b><span>% work not done on time</span></div></div>';
  }
  function paint() {
    if (st.id) return detail();
    var last = D.weeks[0];
    body.innerHTML = (D.errors.length ? '<div class="warn mb">' + h(D.errors.join(' · ')) + '</div>' : '') + '<div id="scC"></div>';
    hubCards($('#scC', body), D.lists.map(function (l) {
      var x = sum(l.rows.filter(function (r) { return r.week === last.i; }));
      return { key: l.id, icon: 'insights', label: l.name, value: x ? chkPct(x.nd) : '—', sub: x ? 'last week ' + wkLabel(last) + ' · on time ' + chkPct(x.ot) + ' · ' + l.doers.length + ' doers' : 'No task planned last week' };
    }), function (k) { st.id = k; st.week = String(last.i); st.doer = ''; paint(); });
  }
  function detail() {
    var L = D.lists.filter(function (l) { return l.id === st.id; })[0];
    var b = hubPanel(body, L.name + ' · Scores', 'insights', function () { st.id = ''; paint(); });
    b.innerHTML = '<div class="fbar"><div class="ff"><label>Week</label><select class="inp sm" id="scW"><option value="">Every week</option>' + D.weeks.map(function (w) {
        return '<option value="' + w.i + '"' + (String(w.i) === st.week ? ' selected' : '') + '>' + wkLabel(w) + '</option>'; }).join('') + '</select></div>' +
      '<div class="ff grow"><label>Doer</label><select class="inp sm" id="scD"><option value="">Every doer</option>' + L.doers.map(function (n) {
        return '<option' + (n === st.doer ? ' selected' : '') + '>' + h(n) + '</option>'; }).join('') + '</select></div></div><div id="scT"></div><div id="scL"></div>';
    $('#scW', b).onchange = function () { st.week = this.value; rows(); };
    $('#scD', b).onchange = function () { st.doer = this.value; rows(); };
    function rows() {
      var R = L.rows.filter(function (x) { return (st.week === '' || String(x.week) === st.week) && (!st.doer || x.doer === st.doer); });
      var tot = sum(R), weekOf = function (i) { return D.weeks.filter(function (w) { return w.i === i; })[0]; };
      $('#scT', b).innerHTML = tot ? '<div class="ck-score"><div class="ck-sh">' + icon('insights') + '<b>' + h(st.doer || 'Everyone') + '</b><span>' + (st.week === '' ? 'last ' + D.weeks.length + ' weeks' : wkLabel(weekOf(+st.week))) + '</span></div>' +
        metric(tot) + '<div class="ck-sx">' + tot.done + ' of ' + tot.plan + ' done · ' + tot.onTime + ' on time</div></div>' : '';
      R.sort(function (x, y) { return (y.week - x.week) || (x.nd - y.nd) || x.doer.localeCompare(y.doer); });
      recList($('#scL', b), R, {
        title: function (x) { return h(st.doer && st.week === '' ? wkLabel(weekOf(x.week)) : x.doer); },
        sub: function (x) { return h((st.week === '' && !st.doer ? wkLabel(weekOf(x.week)) + ' · ' : '') + x.done + ' of ' + x.plan + ' done · ' + x.onTime + ' on time'); },
        right: function (x) { return '<span class="chip ' + (x.nd >= -5 ? 'green' : x.nd >= -20 ? 'orange' : 'red') + '">' + chkPct(x.nd) + '</span> <span class="chip ' + (x.ot >= -5 ? 'green' : x.ot >= -20 ? 'orange' : 'red') + '">' + chkPct(x.ot) + '</span>'; },
        empty: 'No task was planned for this choice.', emptyIcon: 'insights'
      });
    }
    rows();
  }
}

function chkDetail(el, id, date, quiet) {
  var mark = el.dataset.chk = id + '|' + date;

  // filters and ticks stay when the list is redrawn with newer data
  var st = el.__chkSt && el.__chkSt.key === mark ? el.__chkSt : (el.__chkSt = { key: mark, doer: '', status: 'pending', q: '', qRaw: '', sel: {} });
  var args = st.status === 'overdue' ? { id: id, date: date, overdue: true } : { id: id, date: date };
  live('chk.tasks', args, draw, { el: el, busy: true, quiet: quiet, alive: function () { return el.dataset.chk === mark && (st.status === 'overdue') === !!args.overdue; } })
    .catch(function (e) { el.innerHTML = '<button class="btn ghost mb" id="bk">' + icon('arrow_back') + 'Back</button>' + errHtml(e); $('#bk', el).onclick = function () { chkTeam(el, '', date); }; });
  function draw(d) {
    el.innerHTML =
      '<div class="page-head"><button class="icon-btn" id="back">' + icon('arrow_back') + '</button><div class="grow"><h2>' + h(d.name) + '</h2>' +
      '<div class="sub">' + (d.overdue ? 'Overdue — daily tasks of today, weekly of this week and monthly of this month not done in time' : fmtISO(d.date)) + ' · ' + (d.manage ? 'Team view — you can mark any task' + (d.canAssign ? ' or give it to someone' : '') : 'Your tasks') + '</div></div>' +
      '<input type="date" class="inp sm" id="dd" value="' + d.date + '" max="' + todayISO() + '" style="width:auto"></div>' +
      '<div class="card"><div class="row">' +
      '<div class="seg" id="sseg">' + [['pending', 'Pending'], ['overdue', 'Overdue'], ['done', 'Done'], ['all', 'All']].map(function (x) { return '<button data-s="' + x[0] + '"' + (st.status === x[0] ? ' class="on"' : '') + '>' + x[1] + '</button>'; }).join('') + '</div>' +
      (d.manage && d.doers.length > 1 ? '<select class="inp sm" id="doer" style="width:auto" data-free><option value="">Everyone</option>' + d.doers.map(function (x) { return '<option' + (x === st.doer ? ' selected' : '') + '>' + h(x) + '</option>'; }).join('') + '</select>' : '') +
      '<input class="inp sm grow" id="q" placeholder="Search task…" style="min-width:140px" data-free value="' + h(st.qRaw) + '">' +
      '<span class="right small muted" id="cnt"></span></div></div><div class="list mt" id="tl"></div><div id="abar"></div>';
    $('#back', el).onclick = function () { chkTeam(el, '', date); };
    $('#dd', el).onchange = function () { chkDetail(el, id, this.value); };
    $$('#sseg button', el).forEach(function (b) {
      b.onclick = function () {
        var was = st.status; st.status = b.dataset.s;
        if ((was === 'overdue') !== (st.status === 'overdue')) return chkDetail(el, id, date);
        $$('#sseg button', el).forEach(function (x) { x.classList.toggle('on', x === b); }); render();
      };
    });
    if ($('#doer', el)) $('#doer', el).onchange = function () { st.doer = this.value; render(); };
    $('#q', el).oninput = function () { st.qRaw = this.value; st.q = this.value.toLowerCase(); render(); };
    function render() {
      var rows = d.tasks.filter(function (t) {
        if ((st.status === 'pending' || st.status === 'overdue') && t.done) return false;
        if (st.status === 'done' && !t.done) return false;
        if (st.doer && t.name !== st.doer) return false;
        if (st.q && (t.task + ' ' + t.name + ' ' + t.id).toLowerCase().indexOf(st.q) < 0) return false;
        return true;
      });
      var done = d.tasks.filter(function (t) { return t.done; }).length;
      $('#cnt', el).textContent = done + ' / ' + d.tasks.length + ' done';
      $('#tl', el).innerHTML = rows.length ? rows.map(function (t) {
        var sel = d.canAssign && !t.done;
        return '<div class="li ' + (t.done ? 'done' : '') + '"><div class="top">' +
          (sel ? '<input type="checkbox" class="selbox" data-free data-sel="' + t.row + '"' + (st.sel[t.row] ? ' checked' : '') + '>' : '') +
          '<div class="grow"><div class="small muted">' + (d.overdue ? '<b style="color:var(--red)">' + h((t.plannedText || '').slice(0, 10)) + '</b> ' : '') + h(t.time) + ' · ' + h(t.name) + (t.mine ? ' (you)' : '') + ' · ' + h(t.id) +
          (t.assignedTo ? ' · <b style="color:var(--violet)">given to ' + h(t.assignedTo) + '</b>' : '') + '</div>' +
          '<div class="task-text hi">' + h(t.task) + '</div>' +
          (t.done ? '<div class="small" style="color:var(--green)">✓ ' + h(t.doneAt) + (t.late ? ' <span class="chip red">late</span>' : '') + (t.remark ? ' · ' + h(t.remark) : '') +
            (t.att ? ' · <a href="' + h(t.att) + '" target="_blank">photo</a>' : '') + '</div>' : '') + '</div>' +
          (t.canDo ? '<button class="btn sm green" data-done="' + t.row + '">' + icon('done') + 'Done</button>' : (t.done ? icon('check_circle', 'fill') : '')) +
          '</div></div>';

            else if (stage === 'ok') { if (r && r.doneAt) t.doneAt = r.doneAt; if (!SAVING) chkDetail(el, id, date, true); else render(); }
            else { t.done = false; t.canDo = true; t.doneAt = ''; render(); }

      var n = Object.keys(st.sel).length, ab = $('#abar', el);
      if (!n) { ab.innerHTML = ''; return; }
      ab.innerHTML = '<div class="sticky-bar"><b>' + n + ' selected</b><span class="grow"></span><button class="btn sm ghost" id="clr" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.4)">Clear</button>' +
        '<button class="btn sm" id="asg">' + icon('assignment_ind') + 'Give to someone</button></div>';
      $('#clr', ab).onclick = function () { st.sel = {}; render(); };
      $('#asg', ab).onclick = function () {
        var items = Object.keys(st.sel).map(function (r) { var t = d.tasks.filter(function (x) { return x.row === +r; })[0]; return { row: t.row, taskId: t.id }; });
        chkAssignModal(id, date, items, function () { st.sel = {}; chkDetail(el, id, date, true); });
      };
    }
    render();
  }
}

function chkDoneModal(t, after) {
  var pk;
  modal({ title: 'Mark done', body: '<div class="task-text hi mb">' + h(t.task) + '</div>' +
      '<div class="field"><label>Remark (optional)</label><textarea class="inp" id="rm" placeholder="Anything to note?"></textarea></div><div id="fb"></div><div id="derr" class="mt"></div>',
    onOpen: function (el) { pk = filePicker($('#fb', el), 'checklist', { label: 'Photo (optional)' }); },
    actions: [{ label: 'Cancel', cls: 'ghost' }, { label: icon('done') + 'Mark done', cls: 'green', click: function (close, el, btn) {
      if (pk.busy()) return toast('Wait for the photo to finish uploading.');
      var f = pk.get(), rm = val('#rm', el);
      close(); after && after('start');                                  // ticked at once — saved behind it
      saveInBg('chk.done', { id: t.id, row: t.row, taskId: t.taskId, remark: rm, fileId: f ? f.fileId : '' }, 'Marking ' + (t.taskId || 'the task') + ' done…')
        .then(function (r) { S.cache.dashChk = null; S.cache.chkMy = null; after && after('ok', r); })
        .catch(function (e) { after && after('fail', e); });
    } }] });
}

function chkAssignModal(id, date, items, after) {
  var m = modal({ title: 'Give ' + items.length + ' task(s) to…', body: loadingHtml('Loading people…'),
    actions: [{ label: 'Cancel', cls: 'ghost' }, { label: icon('send') + 'Give', click: function (close, el, btn) {
      var to = picked(el)[0];
      if (!to) return toast('Pick a person.', 'bad');
      busy(btn, true);
      api('chk.assign', { id: id, date: date, items: items, to: to, note: val('#note', el) })
        .then(function (r) { close(); toast(r.message, 'ok'); after && after(); })
        .catch(function (e) { busy(btn, false); toast(e.message, 'bad'); });
    } }] });
  cached('users', function () { return api('chk.users'); }).then(function (users) {
    $('.modal-b', m.el).innerHTML = userPicker(users, false) + '<div class="field mt"><label>Note (optional)</label><input class="inp" id="note" placeholder="e.g. Umesh is on leave today"></div>';
    bindUserPicker(m.el);
  }).catch(function (e) { $('.modal-b', m.el).innerHTML = errHtml(e); });
}

/* ---------------- MY DELEGATED TASKS ---------------- */
V.tasks = function (el, p) {
  var f = (p && p.tab) || 'open', ap = !!S.boot.perms.dlgApprove, data = null, A = null;
  var tabs = [['open', 'Open'], ['wait', 'Pending with EA'], ['done', 'Done'], ['all', 'All']];
  if (ap) tabs.unshift(['approve', 'To approve']);
  if (ap && !(p && p.tab)) f = 'approve';
  el.innerHTML = pageHead('My Delegated Tasks', '') + tabsHtml(tabs, f) + '<div id="tb">' + loadingHtml() + '</div>';
  bindTabs(el, function (t) { f = t; S.params.tab = t; render(); });
  load(false);
  function load(quiet) {
    live('task.mine', {}, function (d) { data = d; render(); }, { el: $('#tb', el), busy: true, quiet: quiet }).catch(function (e) { $('#tb', el).innerHTML = errHtml(e); });
    if (ap) live('task.approveList', {}, function (d) { A = d; render(); }, { quiet: true }).catch(function (e) { if (f === 'approve') $('#tb', el).innerHTML = errHtml(e); });
  }
  function render() {
    if (f === 'approve') return approve();
    if (!data) return;
    var list = data.tasks.filter(function (t) {
      if (f === 'open') return t.open;
      if (f === 'wait') return t.waiting;
      if (f === 'done') return t.done;
      return true;
    });
    $('#tb', el).innerHTML = list.length ? '<div class="list">' + list.map(function (t) {
      return '<div class="li"><div class="top"><div class="grow"><div class="row gap6">' + chip(t.statusText, t.done ? 'green' : t.waiting ? 'violet' : t.status === 'Reopened' ? 'red' : 'orange') +
        chip(t.priority, t.priority === 'High' ? 'red' : t.priority === 'Low' ? 'grey' : 'blue') + (t.overdue ? chip('Overdue', 'red') : '') + '<span class="small muted">' + h(t.id) + '</span></div>' +
        '<div class="title mt" style="margin-top:6px">' + h(t.title) + '</div>' + (t.desc ? '<div class="small" style="white-space:pre-line">' + h(t.desc) + '</div>' : '') +
        '<div class="small muted mt" style="margin-top:6px">From ' + h(t.byName || '—') + ' · ' + h(t.created) + (t.dueText ? ' · Due <b>' + h(t.dueText) + '</b>' : '') + '</div>' +
        (t.assigneeRemarks ? '<div class="small mt" style="margin-top:4px;white-space:pre-line">' + icon('edit_note') + ' ' + h(t.assigneeRemarks) + '</div>' : '') +
        (t.link ? '<div class="small"><a href="' + h(t.link) + '" target="_blank" rel="noopener">' + icon('link') + ' ' + h(t.link) + '</a></div>' : '') +
        (t.delegatorRemarks ? '<div class="small" style="white-space:pre-line;color:var(--violet)">' + icon('chat') + ' ' + h(t.delegatorRemarks) + '</div>' : '') +
        (t.done && t.approvedBy ? '<div class="small muted">Approved by ' + h(t.approvedBy) + (t.approved ? ' · ' + h(t.approved) : '') + '</div>' : '') + '</div></div>' +
        '<div class="row mt">' + (t.fileId ? '<button class="btn sm ghost" data-file="' + h(t.id) + '">' + icon('attach_file') + 'Attachment</button>' : '') +
        (t.open && t.status !== 'In Progress' ? '<button class="btn sm soft" data-start="' + h(t.id) + '">' + icon('play_arrow') + 'Start</button>' : '') +
        (t.open && has('tickets') ? '<button class="btn sm amber" data-iss="' + h(t.id) + '">' + icon('report_problem') + 'Raise issue</button>' : '') +
        (t.open ? '<button class="btn sm green" data-fin="' + h(t.id) + '">' + icon('done_all') + 'Done</button>' : '') + '</div></div>';
    }).join('') + '</div>' : '<div class="card">' + emptyHtml('task_alt', { open: 'No open task.', wait: 'Nothing is waiting for the EA.', done: 'Nothing done yet.', all: 'No task given to you.' }[f]) + '</div>';
    $$('[data-file]', el).forEach(function (b) { b.onclick = function () { viewFile('task', b.dataset.file, 'Attachment'); }; });
    $$('[data-iss]', el).forEach(function (b) {
      b.onclick = function () { var t = data.tasks.filter(function (x) { return x.id === b.dataset.iss; })[0]; if (t) raiseTicket({ task: { id: t.id, title: t.title }, subject: t.title, outletId: t.outletId || '' }); };
    });
    $$('[data-start]', el).forEach(function (b) { b.onclick = function () { busy(b, true); api('task.update', { id: b.dataset.start, status: 'In Progress' }).then(function (r) { toast(r.message, 'ok'); load(true); }).catch(function (e) { busy(b, false); toast(e.message, 'bad'); }); }; });
    $$('[data-fin]', el).forEach(function (b) {
      b.onclick = function () { var t = data.tasks.filter(function (x) { return x.id === b.dataset.fin; })[0]; taskDoneModal(t, function () { settle(b.closest('.li')); load(true); }); };
    });
  }
  function approve() {
    var box = $('#tb', el);
    if (!A) { box.innerHTML = loadingHtml(); return; }
    box.innerHTML = '<div class="section-title">Waiting for your approval (' + A.waiting.length + ')</div><div id="taW"></div><div id="taBar"></div>' +
      '<div class="section-title">Approved in ' + h(A.month) + ' (' + A.recent.length + ')</div><div id="taR"></div>';
    var pickedNow = [];
    recList($('#taW', box), A.waiting, {
      title: function (t) { return h(t.title); },
      sub: function (t) { return h([t.id, t.toName, t.completed ? 'done ' + t.completed : '', t.byName ? 'from ' + t.byName : ''].filter(Boolean).join(' · ')); },
      right: function (t) { return t.own ? chip('Your own task', 'grey') : chip('Pending with EA', 'violet'); },
      check: function (t) { return !t.own; },
      onCheck: function (L) { pickedNow = L; bar(); },
      body: function (b, t) {
        b.innerHTML = kvHtml([['Task ID', t.id], ['Doer', t.toName], ['From', t.byName], ['Due', t.dueText], ['Marked done', t.completed], ['Remark', t.assigneeRemarks],
            t.link ? ['Link', '<a href="' + h(t.link) + '" target="_blank" rel="noopener">' + h(t.link) + '</a>', true] : null, t.desc ? ['Details', t.desc] : null]) +
          '<div class="row gap6 mt">' + (t.fileId ? '<button class="btn sm ghost" data-af>' + icon('attach_file') + 'Attachment</button>' : '') + '<span class="grow"></span>' +
          (t.own ? '' : '<button class="btn sm ghost" data-ab>' + icon('undo') + 'Send back</button><button class="btn sm green" data-ao>' + icon('verified') + 'Approve</button>') + '</div>';
        if ($('[data-af]', b)) $('[data-af]', b).onclick = function (e) { e.stopPropagation(); viewFile('task', t.id, 'Attachment'); };
        if ($('[data-ao]', b)) $('[data-ao]', b).onclick = function (e) { e.stopPropagation(); decide([t], 'approve'); };
        if ($('[data-ab]', b)) $('[data-ab]', b).onclick = function (e) { e.stopPropagation(); decide([t], 'return'); };
      },
      empty: 'Nothing is waiting for your approval.', emptyIcon: 'verified'
    });
    recList($('#taR', box), A.recent, { title: function (t) { return h(t.title); }, sub: function (t) { return h([t.id, t.toName, 'approved ' + t.approved].join(' · ')); },
      right: function () { return chip('Done', 'green'); }, empty: 'Nothing approved this month yet.', emptyIcon: 'task_alt' });
    function bar() {
      var b0 = $('#taBar', box);
      b0.innerHTML = pickedNow.length ? '<div class="bulkbar"><span class="grow">' + pickedNow.length + ' ticked</span><button class="btn sm ghost" data-bb style="color:#fff;border-color:rgba(255,255,255,.4)">' + icon('undo') + 'Send back</button>' +
        '<button class="btn sm green" data-bo>' + icon('verified') + 'Approve</button></div>' : '';
      if (!pickedNow.length) return;
      $('[data-bo]', b0).onclick = function () { decide(pickedNow, 'approve'); };
      $('[data-bb]', b0).onclick = function () { decide(pickedNow, 'return'); };
    }
    function decide(L, dec) {
      var run = function (rm, btn, close) {
        busy(btn, true);
        api('task.approve', { ids: L.map(function (t) { return t.id; }), decision: dec, remark: rm || '' }).then(function (r) {
          if (close) close(); toast(r.message, 'ok'); dcDel('task.approveList', {}); A = null; load(true); render();
        }).catch(function (e) { busy(btn, false); toast(e.message, 'bad'); });
      };
      modal({ title: (dec === 'approve' ? 'Approve ' : 'Send back ') + L.length + ' task(s)', body: '<div class="small muted mb">' + h(L.map(function (t) { return t.title; }).slice(0, 5).join(' · ')) + (L.length > 5 ? ' …' : '') + '</div>' +
          '<div class="field"><label>' + (dec === 'approve' ? 'Remark (optional)' : 'What is missing? *') + '</label><textarea class="inp" data-k="rm" rows="3"></textarea></div>',
        actions: [{ label: 'Cancel', cls: 'ghost' }, { label: dec === 'approve' ? icon('verified') + 'Approve' : icon('undo') + 'Send back', cls: dec === 'approve' ? 'green' : 'amber', click: function (close, m, btn) {
          var rm = val('[data-k="rm"]', m); if (dec === 'return' && !rm) return toast('Write what is missing.', 'bad');
          run(rm, btn, close);
        } }] });
    }
  }
};

/* ---------------- DELEGATE TASKS ---------------- */
V.delegate = function (el, p) {
  var mode = 'mine';
  el.innerHTML = pageHead('Delegate Tasks', '',
    '<button class="btn" id="nt">' + icon('add') + 'New task</button>') +
    (perm('super') || perm('director') || perm('dlgApprove') ? tabsHtml([['mine', 'Delegated by me'], ['all', 'Everyone\'s']], mode) : '') + '<div id="db">' + loadingHtml() + '</div>';
  $('#nt', el).onclick = newTask;
  bindTabs(el, function (t) { mode = t; load(); });
  function load(quiet) {
    var box = $('#db', el), m0 = mode;
    live('task.sent', { all: mode === 'all' }, function (d) {
      var list = d.tasks;
      $('#db', el).innerHTML = list.length ? '<div class="tbl-wrap"><table class="tbl"><tr><th>Task</th><th>To</th><th>Due</th><th>Status</th><th>Updates</th><th></th></tr>' +
        list.map(function (t) {
          return '<tr><td><div class="b">' + h(t.title) + '</div><div class="small muted">' + h(t.id) + ' · ' + h(t.created) + (mode === 'all' ? ' · by ' + h(t.byName) : '') + '</div></td>' +
            '<td>' + h(t.toName) + '</td><td class="nowrap">' + h(t.dueText || '—') + (t.overdue ? '<br>' + chip('Overdue', 'red') : '') + '</td><td>' + chip(t.statusText, t.done ? 'green' : t.waiting ? 'violet' : t.cancelled ? 'grey' : 'orange') + '</td>' +
            '<td class="small" style="max-width:260px;white-space:pre-line">' + h(t.assigneeRemarks || '') + (t.link ? '<br><a href="' + h(t.link) + '" target="_blank" rel="noopener">link</a>' : '') + (t.fileId ? '<br><a href="#" data-f="' + h(t.id) + '">attachment</a>' : '') + '</td>' +
            '<td class="nowrap">' + (!t.done && !t.cancelled ? '<button class="btn sm soft" data-m="' + h(t.id) + '">Manage</button>' : '') + '</td></tr>';
        }).join('') + '</table></div>' : '<div class="card">' + emptyHtml('forward_to_inbox', 'You have not delegated anything yet.') + '</div>';
      $$('[data-f]', el).forEach(function (a) { a.onclick = function (e) { e.preventDefault(); viewFile('task', a.dataset.f, 'Attachment'); }; });
      $$('[data-m]', el).forEach(function (b) { b.onclick = function () { manage(list.filter(function (t) { return t.id === b.dataset.m; })[0]); }; });
    }, { box: box, quiet: quiet, alive: function () { return mode === m0; } }).catch(function (e) { $('#db', el).innerHTML = errHtml(e); });
  }
  function manage(t) {
    var acts = [{ label: 'Cancel task', cls: 'red', click: act('cancel') }, { label: 'Move due date', cls: 'ghost', click: act('extend') }, { label: 'Reopen', cls: 'soft', click: act('reopen') }];
    if (t.waiting && S.boot.perms.dlgApprove && t.to !== S.boot.user.uid) acts.push({ label: icon('verified') + 'Approve', cls: 'green', click: act('verify') });
    modal({ title: t.title, body: '<div class="kv mb"><b>To</b><span>' + h(t.toName) + '</span><b>Status</b><span>' + h(t.statusText) + '</span><b>Due</b><span>' + h(t.dueText || '—') + '</span></div>' +
        (t.waiting ? '<div class="note mb">' + icon('verified') + ' Marked done by the doer — the EA approves it.</div>' : '') +
        '<div class="field"><label>Remark</label><textarea class="inp" id="rm"></textarea></div>' +
        '<div class="field"><label>New due date (for "Move due date")</label><input type="date" class="inp" id="due" value="' + h(t.due || '') + '"></div>',
      actions: acts });
    function act(a) {
      return function (close, m, btn) {
        busy(btn, true);
        api('task.manage', { id: t.id, action: a, remark: val('#rm', m), due: val('#due', m) })
          .then(function (r) { close(); toast(r.message, 'ok'); load(true); }).catch(function (e) { busy(btn, false); toast(e.message, 'bad'); });
      };
    }
  }
  function newTask() {
    var pk;
    var m = modal({ title: 'Delegate a task', wide: true, body: loadingHtml(), actions: [{ label: 'Cancel', cls: 'ghost' }, { label: icon('send') + 'Delegate', click: function (close, el2, btn) {
      var to = picked(el2);
      if (!val('#tt', el2)) return toast('Write the task.', 'bad');
      if (!to.length) return toast('Pick at least one person.', 'bad');
      if (pk.busy()) return toast('Wait for the upload.');
      busy(btn, true); var f = pk.get();
      api('task.create', { title: val('#tt', el2), desc: val('#td', el2), to: to, due: val('#tdue', el2), priority: val('#tp', el2), fileId: f ? f.fileId : '' })
        .then(function (r) { close(); toast(r.message, 'ok'); load(true); }).catch(function (e) { busy(btn, false); toast(e.message, 'bad'); });
    } }] });
    cached('dusers', function () { return api('task.users'); }).then(function (users) {
      $('.modal-b', m.el).innerHTML = '<div class="form-grid"><div class="field full"><label>Task *</label><input class="inp" id="tt" placeholder="What needs to be done"></div>' +
        '<div class="field full"><label>Details</label><textarea class="inp" id="td"></textarea></div>' +
        '<div class="field"><label>Due date</label><input type="date" class="inp" id="tdue" min="' + todayISO() + '"></div>' +
        '<div class="field"><label>Priority</label><select class="inp" id="tp"><option>High</option><option selected>Medium</option><option>Low</option></select></div>' +
        '<div class="full" id="fb"></div><div class="field full mt"><label>Assign to *</label>' + userPicker(users, true) + '</div></div>';
      pk = filePicker($('#fb', m.el), 'task', { label: 'Attachment (optional)' });
      bindUserPicker(m.el);
    }).catch(function (e) { $('.modal-b', m.el).innerHTML = errHtml(e); });
  }
  load();
  if (p && p.add) newTask();
};
</script>
